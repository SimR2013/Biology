<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f34"><title>Kindred — Make Your Time Matter</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--forest:#154b3a;--dark:#133629;--sage:#eaf3eb;--lime:#c4ef83;--cream:#f8f9f5;--ink:#172d24;--muted:#718177;--border:#dfebe1}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);font-family:"DM Sans",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:inherit;text-decoration:none}h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-.045em}p{line-height:1.65}.container{width:min(1180px,calc(100% - 36px));margin:auto}.bar{background:var(--dark);color:white;text-align:center;padding:10px;font-size:12px}.nav{background:#ffffffed;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);backdrop-filter:blur(15px)}.navin{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:72px}.logo{font-size:28px;font-weight:800;letter-spacing:-2px}.logo em{font-style:normal;color:#6da58b}.links{display:flex;gap:20px;align-items:center}.links button{background:none;border:0;color:#455a4d;font-size:13px;font-weight:700}.btn{border-radius:999px;padding:12px 19px;background:var(--forest);border:1px solid var(--forest);color:white;font-weight:800;transition:.18s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn.alt{background:white;color:var(--forest)}.btn.light{background:var(--lime);color:#143b2d;border:0}.btn.small{padding:9px 14px;font-size:13px}.hero{padding:100px 0 90px}.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:65px;align-items:center}.pill{display:inline-block;border:1px solid #c5dacb;border-radius:50px;padding:8px 13px;font-weight:800;font-size:12px;color:var(--forest);background:#f1f8ee}.hero h1{font-size:clamp(3.6rem,6vw,6.5rem);line-height:1.05;margin:24px 0}.hero h1 span{color:#4d916b}.lead{font-size:18px;color:#61766a;max-width:500px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.hero-art{min-height:475px;position:relative;border-radius:35px;background:linear-gradient(145deg,#254d38aa,#163f3199),url('https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&fit=crop&w=1300&q=85') center/cover;box-shadow:0 25px 65px #163a2b28}.float{position:absolute;bottom:25px;left:-25px;background:white;border-radius:19px;padding:17px 22px;box-shadow:0 15px 50px #122c241c}.float strong{display:block}.float small{color:var(--muted)}section{padding:76px 0}.muted-section{background:var(--sage)}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-weight:800;font-size:12px;color:#548369}.sectionhead{max-width:650px;margin-bottom:28px}.sectionhead h2{font-size:clamp(2.1rem,4vw,3.7rem);line-height:1.15;margin:12px 0}.sectionhead p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:white;border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:0 5px 20px #163b2610}.card h3{margin:10px 0}.card p{color:#64796b;font-size:14px}.stepnumber{font-size:13px;color:#629072;font-weight:800}.emoji{font-size:35px}.category{font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.opgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.op{padding:0;overflow:hidden}.op-art{height:125px;display:flex;justify-content:center;align-items:center;background:#e6f0de;font-size:55px}.op-body{padding:22px}.op-body h3{margin:10px 0}.tag{display:inline-block;background:#eef6e9;color:#416b4e;border-radius:30px;padding:6px 11px;font-size:11px;font-weight:800;margin-right:5px;margin-bottom:5px}.meta{font-size:12px;color:#6d8072;line-height:1.8}.foot{background:#123b2d;color:white;padding:50px 0}.foot p{color:#a7c3b3}.app{padding:42px 0 90px}.layout{display:grid;grid-template-columns:215px 1fr;gap:25px}.side{display:flex;flex-direction:column;gap:5px}.side button{padding:13px;text-align:left;border:0;background:transparent;border-radius:12px;font-weight:700;color:#6a7d70}.side button.active,.side button:hover{background:#e4f0e4;color:var(--forest)}.panel{background:white;border:1px solid var(--border);padding:25px;border-radius:22px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.kpi{padding:20px;background:var(--sage);border-radius:14px}.kpi strong{display:block;font-size:30px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.field{border:1px solid #cfddd2;border-radius:12px;padding:12px 13px;width:100%;background:white;min-width:0;color:var(--ink)}.toolbar .field{flex:1;min-width:145px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form label{font-size:12px;font-weight:800;display:block;margin-bottom:6px}.full{grid-column:1/-1}.notice{padding:15px;border-radius:13px;background:#fff6dc;color:#765b20;font-size:13px;margin:12px 0}.success{background:#e4f4e3;color:#215f3b}.list{display:flex;flex-direction:column;gap:12px}.listrow{background:#fff;border:1px solid var(--border);padding:18px;border-radius:17px;display:flex;justify-content:space-between;gap:15px;align-items:center}.listrow p{margin:3px 0;font-size:13px;color:var(--muted)}.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed #c7d9ca;border-radius:18px}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#eaf4e5;font-size:11px;font-weight:800}.overlay{position:fixed;inset:0;background:#102e24ad;z-index:30;display:grid;place-items:center;padding:15px}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:25px;background:white;padding:28px;position:relative}.close{position:absolute;right:18px;top:15px;background:none;border:0;font-size:25px}.toast{position:fixed;bottom:20px;right:20px;background:var(--dark);color:white;border-radius:12px;padding:15px 20px;z-index:50}.fine{font-size:12px;color:var(--muted)}.hidden{display:none!important}@media(max-width:850px){.hero-grid,.layout{grid-template-columns:1fr}.hero-art{min-height:350px}.float{left:15px}.grid,.grid.four,.opgrid{grid-template-columns:repeat(2,1fr)}.links{gap:6px}.links button{font-size:11px}.side{flex-direction:row;flex-wrap:wrap}.side button{font-size:12px}.hero{padding:60px 0}}@media(max-width:560px){.grid,.grid.four,.opgrid,.form,.kpis{grid-template-columns:1fr}.links button:nth-child(2),.links button:nth-child(3){display:none}.hero h1{font-size:3.5rem}.container{width:calc(100% - 28px)}.hero-art{min-height:280px}}
</style></head><body><div id="app"></div><div id="dialog"></div><div id="notifications"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const CONFIG={url:"",anonKey:""}; // Paste your Supabase project URL and PUBLISHABLE/anon key here after running schema.sql. NEVER use service_role or secret keys.
const live=Boolean(CONFIG.url&&CONFIG.anonKey&&window.supabase);
const db=live?window.supabase.createClient(CONFIG.url,CONFIG.anonKey):null;
let user=null,profile=null,view="home",items=[],orgs=[],applications=[],sessions=[],saved=[],category="All",search="",tab="volunteer",loading=false;
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
function notify(msg){$("#notifications").innerHTML='<div class="toast">'+E(msg)+'</div>';setTimeout(()=>$("#notifications").innerHTML="",3800)}
function nav(to){view=to;render();scrollTo(0,0);if(live&&user)loadData()}
function guard(){if(!live){notify("Live backend not configured yet. See README.");return false}if(!user){openAuth();return false}return true}
const CATS=[["🌱","Environment"],["📚","Education"],["🐾","Animals"],["🩺","Healthcare"],["🤝","Community"],["🍽️","Food Security"]];
function header(){return '<div class="bar">A better way to give back, together.</div><div class="nav"><div class="container navin"><a class="logo" href="#" onclick="nav(\'home\');return false">✳ kindred<em>.</em></a><div class="links"><button onclick="nav(\'discover\')">Explore</button><button onclick="nav(\'dashboard\')">Dashboard</button><button onclick="nav(\'organizations\')">Organizations</button></div><button class="btn small" onclick="'+(user?"signout()":"openAuth()")+'">'+(user?"Sign out":"Sign in / Join")+'</button></div></div>'}
function home(){return '<div class="hero"><div class="container hero-grid"><div><span class="pill">✳ Good things happen when we show up</span><h1>Make your <span>time matter.</span></h1><p class="lead">Discover meaningful volunteer opportunities that fit your interests, schedule and goals. Spend less time searching and more time making a difference.</p><div class="actions"><button class="btn" onclick="nav(\'discover\')">Find your perfect opportunity ↗</button><button class="btn alt" onclick="nav(\'organizations\')">For organizations</button></div><p class="fine">Discover causes. Connect with people. Keep track of your impact.</p></div><div class="hero-art"><div class="float"><strong>🌿 Find your people. Find your purpose.</strong><small>Volunteering, made simple.</small></div></div></div></div><section class="muted-section"><div class="container"><div class="sectionhead"><span class="eyebrow">How Kindred works</span><h2>Four steps to a little more good.</h2></div><div class="grid four">'+[["01","🔎","Discover","Explore causes that fit your interests and schedule."],["02","💌","Connect","Apply to opportunities with community organizations."],["03","🤝","Volunteer","Give your time to the causes that matter."],["04","📈","Track","Record hours and celebrate verified milestones."]].map(x=>'<div class="card"><span class="stepnumber">'+x[0]+'</span><div class="emoji">'+x[1]+'</div><h3>'+x[2]+'</h3><p>'+x[3]+'</p></div>').join("")+'</div></div></section><section><div class="container"><div class="sectionhead"><span class="eyebrow">Your cause is out there</span><h2>Something meaningful for everyone.</h2></div><div class="grid">'+CATS.map(x=>'<button class="card category" onclick="category=\''+x[1]+'\';nav(\'discover\')">'+x[0]+' '+x[1]+' <span>↗</span></button>').join("")+'</div></div></section><section class="muted-section"><div class="container"><div class="sectionhead"><span class="eyebrow">Built for real impact</span><h2>Good for volunteers. Great for communities.</h2><p>One place for personalized discovery, applications, verified service hours, and nonprofit opportunity management.</p></div><button class="btn" onclick="nav(\'discover\')">Explore opportunities →</button></div></section>'}
function shell(inner){return '<div class="app"><div class="container layout"><div class="side">'+[["dashboard","⌂ Dashboard"],["discover","⌕ Discover"],["saved","♡ Saved"],["applications","▤ Applications"],["hours","◷ Hours"],["organizations","♧ Organizations"],["profile","⚙ Profile"]].map(x=>'<button class="'+(view===x[0]?"active":"")+'" onclick="nav(\''+x[0]+'\')">'+x[1]+'</button>').join("")+'</div><div>'+inner+'</div></div></div>'}
function warning(){return !live?'<div class="notice">⚙ Live service is not connected yet. This site is published as a frontend. To activate shared accounts and data, configure Supabase using README.md and schema.sql. No sample opportunities are presented as real.</div>':""}
function eligible(o){return !profile?.age||profile.age>=o.min_age}
function match(o){if(!profile||!eligible(o))return null;const a=profile;let n=0;n+=a.interests?.includes(o.category)?30:0;n+=a.availability?.includes(o.schedule)?25:0;n+=o.distance_miles!==null&&a.max_distance!==null&&o.distance_miles<=a.max_distance?20:0;n+=a.commitment===o.commitment?10:0;n+=a.activities?.includes(o.activity)?15:0;return n}
function opportunity(o){const s=match(o),isSaved=saved.some(x=>x.opportunity_id===o.id);return '<div class="card op"><div class="op-art">'+({Environment:"🌱",Education:"📚",Animals:"🐾",Healthcare:"🩺",Community:"🤝","Food Security":"🍽️"}[o.category]||"🤲")+'</div><div class="op-body"><span class="tag">'+E(o.category)+'</span>'+(s!==null?'<span class="tag">'+s+'% match</span>':"")+'<h3>'+E(o.title)+'</h3><p>'+E(o.organizations?.name||"Community organization")+'</p><p>'+E(o.description)+'</p><div class="meta">📍 '+E(o.city)+' · Ages '+o.min_age+'+<br>📅 '+E(o.schedule)+' · '+E(o.commitment)+' · '+o.estimated_hours+' hours</div><div class="actions"><button class="btn small" onclick="apply(\''+o.id+'\')">Apply ↗</button><button class="btn small alt" onclick="toggleSaved(\''+o.id+'\')">'+(isSaved?"♥ Saved":"♡ Save")+'</button></div></div></div>'}
function discover(){let visible=items.filter(o=>eligible(o)&&(!search||(o.title+" "+o.description+" "+o.city+" "+o.organizations?.name).toLowerCase().includes(search.toLowerCase()))&&(category==="All"||o.category===category)).sort((a,b)=>(match(b)??-1)-(match(a)??-1));return shell('<div class="sectionhead"><span class="eyebrow">Discover</span><h2>Find your next opportunity.</h2><p>Browse real listings posted by participating organizations.</p></div>'+warning()+'<div class="toolbar"><input class="field" placeholder="Search causes, cities, organizations..." value="'+E(search)+'" oninput="search=this.value;refreshList()"><select class="field" onchange="category=this.value;refreshList()">'+["All",...CATS.map(x=>x[1])].map(c=>'<option '+(category===c?"selected":"")+'>'+c+'</option>').join("")+'</select></div><div id="results"><div class="opgrid">'+visible.map(opportunity).join("")+'</div>'+(visible.length?"":'<div class="empty">No eligible listings match these filters yet. Try another category or check back later.</div>')+'</div>')}
function refreshList(){let d=discover();$("#app").innerHTML=header()+d+footer()}
function dashboard(){let verified=sessions.filter(x=>x.status==="verified"),pending=applications.filter(x=>x.status==="pending"),hours=verified.reduce((n,x)=>n+Number(x.hours),0),monthly=verified.filter(x=>new Date(x.date).getMonth()===new Date().getMonth()).reduce((n,x)=>n+Number(x.hours),0);return shell('<div class="sectionhead"><span class="eyebrow">Your space</span><h2>Welcome'+(profile?.full_name?", "+E(profile.full_name.split(" ")[0]):"")+" ✨</h2><p>A little progress makes a big difference.</p></div>'+warning()+(!user?'<div class="notice">Sign in to access your personal dashboard.</div><button class="btn" onclick="openAuth()">Sign in / Join</button>':'<div class="kpis"><div class="kpi"><small>✓ Verified hours</small><strong>'+hours.toFixed(1)+'</strong></div><div class="kpi"><small>↗ This month</small><strong>'+monthly.toFixed(1)+'</strong></div><div class="kpi"><small>⌛ Pending applications</small><strong>'+pending.length+'</strong></div></div><div class="panel"><h3>Recommendations for you</h3><div class="opgrid">'+items.filter(eligible).sort((a,b)=>(match(b)??-1)-(match(a)??-1)).slice(0,3).map(opportunity).join("")+'</div>'+(!items.length?'<div class="empty">Organizations have not posted any opportunities yet.</div>':"")+'</div>'))}
function savedPage(){let ids=new Set(saved.map(x=>x.opportunity_id));return shell('<div class="sectionhead"><h2>Saved opportunities</h2></div>'+warning()+'<div class="opgrid">'+items.filter(x=>ids.has(x.id)).map(opportunity).join("")+'</div>'+(!saved.length?'<div class="empty">Your saved list is empty.</div>':""))}
function applicationsPage(){return shell('<h2>My applications</h2>'+warning()+'<div class="list">'+applications.map(a=>'<div class="listrow"><div><strong>'+E(a.opportunities?.title||"Opportunity")+'</strong><p>Submitted '+E(a.created_at?.slice(0,10))+'</p></div><span class="badge">'+E(a.status)+'</span></div>').join("")+'</div>'+(!applications.length?'<div class="empty">You have not applied to any opportunities.</div>':""))}
function hoursPage(){let total=sessions.filter(x=>x.status==="verified").reduce((s,x)=>s+Number(x.hours),0);return shell('<div class="sectionhead"><h2>Community service hours</h2><p>Track your contribution with verified and unverified hours clearly separated.</p></div>'+warning()+'<div class="kpis"><div class="kpi"><small>Verified hours</small><strong>'+total.toFixed(1)+'</strong></div><div class="kpi"><small>Awaiting verification</small><strong>'+sessions.filter(x=>x.status==="pending").reduce((s,x)=>s+Number(x.hours),0).toFixed(1)+'</strong></div><div class="kpi"><small>Sessions</small><strong>'+sessions.length+'</strong></div></div><button class="btn" onclick="openHours()">+ Log a session</button><div class="list" style="margin-top:18px">'+sessions.map(s=>'<div class="listrow"><div><strong>'+E(s.organizations?.name||"Organization")+'</strong><p>'+E(s.date)+' · '+s.hours+' hours · '+E(s.notes)+'</p></div><span class="badge">'+E(s.status)+'</span></div>').join("")+'</div>'+(!sessions.length?'<div class="empty">No volunteer sessions logged yet.</div>':""))}
function organizationsPage(){let mine=orgs.filter(x=>x.owner_id===user?.id);return shell('<div class="sectionhead"><span class="eyebrow">For organizations</span><h2>Bring great people to your cause.</h2><p>Post real volunteering opportunities and review applications from interested volunteers.</p></div>'+warning()+'<div class="actions"><button class="btn" onclick="openOrg()">+ Register organization</button><button class="btn alt" onclick="openOpportunity()">+ Post opportunity</button></div><div class="list">'+mine.map(o=>'<div class="card"><h3>'+E(o.name)+' <span class="badge">'+(o.verified?"Verified":"Not verified")+'</span></h3><p>'+E(o.description)+'</p><p class="fine">'+E(o.city)+'</p><button class="btn small alt" onclick="manageOrg(\''+o.id+'\')">Manage applications →</button></div>').join("")+'</div>'+(!mine.length?'<div class="empty">Create your organization profile to start posting opportunities.</div>':""))}
function profilePage(){return shell('<div class="sectionhead"><h2>My volunteering profile</h2><p>Improve recommendations by sharing your interests and availability.</p></div>'+warning()+(!user?'<button class="btn" onclick="openAuth()">Sign in to set up profile</button>':'<div class="panel"><form class="form" onsubmit="saveProfile(event)"><div><label>Name</label><input required name="full_name" class="field" value="'+E(profile?.full_name||"")+'"></div><div><label>City</label><input name="city" class="field" value="'+E(profile?.city||"")+'"></div><div><label>Age (required for eligibility)</label><input type="number" min="1" max="120" name="age" class="field" value="'+E(profile?.age||"")+'"></div><div><label>Maximum travel distance (miles)</label><input type="number" min="0" max="500" name="max_distance" class="field" value="'+E(profile?.max_distance??20)+'"></div><div><label>Available day</label><select class="field" name="availability">'+["Saturday","Sunday","Weekday","Flexible"].map(x=>'<option '+(profile?.availability?.includes(x)?"selected":"")+'>'+x+'</option>').join("")+'</select></div><div><label>Commitment</label><select class="field" name="commitment">'+["One-time","Weekly","Monthly"].map(x=>'<option '+(profile?.commitment===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div><div><label>Preferred activity</label><select class="field" name="activity">'+["Hands-on","Outdoor","Teaching","Social"].map(x=>'<option '+(profile?.activities?.includes(x)?"selected":"")+'>'+x+'</option>').join("")+'</select></div><div><label>Favorite cause</label><select class="field" name="interest">'+CATS.map(x=>'<option '+(profile?.interests?.includes(x[1])?"selected":"")+'>'+x[1]+'</option>').join("")+'</select></div><div class="full"><button class="btn">Save preferences</button></div></form></div>'))}
function footer(){return '<div class="foot"><div class="container"><h2>Kindred ✳</h2><p>Make your time matter. Built to connect communities through meaningful service.</p><small>© '+new Date().getFullYear()+' Kindred · New organizations are unverified until reviewed.</small></div></div>'}
function render(){let page=view==="home"?home():view==="discover"?discover():view==="dashboard"?dashboard():view==="saved"?savedPage():view==="applications"?applicationsPage():view==="hours"?hoursPage():view==="organizations"?organizationsPage():profilePage();$("#app").innerHTML=header()+page+footer()}
function modal(title,body){$("#dialog").innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>'+E(title)+'</h2>'+body+'</div></div>'}
function closeModal(){$("#dialog").innerHTML=""}
function openAuth(){if(!live)return notify("Connect Supabase to activate real accounts. See README.");modal("Join Kindred",'<p>Sign in or create your free account.</p><form onsubmit="auth(event)" class="form"><div class="full"><label>Email</label><input class="field" name="email" type="email" required autocomplete="email"></div><div class="full"><label>Password</label><input class="field" name="password" type="password" required minlength="6" autocomplete="current-password"></div><button class="btn" name="action" value="login">Sign in</button><button class="btn alt" name="action" value="signup">Create account</button><button class="btn alt full" name="action" value="reset" formnovalidate>Send password reset email</button></form><p class="fine">Account confirmation may be required depending on your Supabase settings.</p>')}
async function auth(ev){ev.preventDefault();let f=new FormData(ev.target),action=ev.submitter?.value||"login",email=f.get("email"),password=f.get("password"),result;if(action==="reset"){result=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});}else if(action==="signup"){result=await db.auth.signUp({email,password});}else{result=await db.auth.signInWithPassword({email,password})}if(result.error)return notify(result.error.message);closeModal();notify(action==="signup"?"Account created. Check your email if confirmation is required.":action==="reset"?"Check your email for a reset link.":"Signed in.");await bootstrap();nav("dashboard")}
async function signout(){if(!db)return;const r=await db.auth.signOut();if(r.error)return notify(r.error.message);user=null;profile=null;items=[];orgs=[];applications=[];sessions=[];saved=[];nav("home")}
async function fetchTable(table,query){const {data,error}=await query;if(error){console.warn(table,error);return []}return data||[]}
async function bootstrap(){if(!db){render();return}let result=await db.auth.getUser();user=result.data.user;if(!user){profile=null;applications=[];sessions=[];saved=[]}await loadData()}
async function loadData(){if(!db)return;let ops=await fetchTable("opportunities",db.from("opportunities").select("*,organizations(name)").eq("active",true).order("created_at",{ascending:false}));items=ops; if(user){const results=await Promise.all([db.from("profiles").select("*").eq("id",user.id).maybeSingle(),db.from("organizations").select("*").eq("owner_id",user.id),db.from("applications").select("*,opportunities(title)").eq("user_id",user.id).order("created_at",{ascending:false}),db.from("volunteer_sessions").select("*,organizations(name)").eq("user_id",user.id).order("date",{ascending:false}),db.from("saved_opportunities").select("*").eq("user_id",user.id)]);profile=results[0].data;orgs=results[1].data||[];applications=results[2].data||[];sessions=results[3].data||[];saved=results[4].data||[]}render()}
async function saveProfile(ev){ev.preventDefault();if(!guard())return;let f=new FormData(ev.target),v={id:user.id,full_name:f.get("full_name"),city:f.get("city"),age:Number(f.get("age"))||null,max_distance:Number(f.get("max_distance")),availability:[f.get("availability")],commitment:f.get("commitment"),activities:[f.get("activity")],interests:[f.get("interest")]};let r=await db.from("profiles").upsert(v);if(r.error)return notify(r.error.message);profile=v;notify("Preferences saved");render()}
async function toggleSaved(id){if(!guard())return;let existing=saved.find(x=>x.opportunity_id===id);let r=existing?await db.from("saved_opportunities").delete().eq("user_id",user.id).eq("opportunity_id",id):await db.from("saved_opportunities").insert({user_id:user.id,opportunity_id:id});if(r.error)return notify(r.error.message);await loadData();notify(existing?"Removed from saved":"Opportunity saved")}
function apply(id){if(!guard())return;let o=items.find(x=>x.id===id);if(!o)return;if(!eligible(o))return notify("This opportunity has an age requirement.");modal("Apply: "+o.title,'<p>Applications are sent to the organization for review. Applying does not mean you are accepted.</p><form onsubmit="submitApplication(event,\''+id+'\')"><label>Why would you like to volunteer?</label><textarea required maxlength="2000" class="field" name="message" rows="5" placeholder="Write a short introduction..."></textarea><div class="actions"><button class="btn">Submit application</button></div></form>')}
async function submitApplication(ev,id){ev.preventDefault();if(!guard())return;let r=await db.from("applications").insert({user_id:user.id,opportunity_id:id,message:new FormData(ev.target).get("message")});if(r.error)return notify(r.error.message);closeModal();await loadData();nav("applications");notify("Application submitted; awaiting organization review")}
function openOrg(){if(!guard())return;modal("Register your organization",'<form class="form" onsubmit="createOrg(event)"><div class="full"><label>Organization name</label><input class="field" name="name" required maxlength="120"></div><div><label>City</label><input class="field" name="city" required></div><div><label>Public contact email</label><input type="email" class="field" name="contact_email" required></div><div class="full"><label>Mission</label><textarea class="field" rows="3" name="description"></textarea></div><div class="full notice">Your organization starts unverified. Verification cannot be granted by organization owners.</div><button class="btn">Create organization</button></form>')}
async function createOrg(ev){ev.preventDefault();if(!guard())return;let f=new FormData(ev.target),r=await db.from("organizations").insert({owner_id:user.id,name:f.get("name"),city:f.get("city"),contact_email:f.get("contact_email"),description:f.get("description")});if(r.error)return notify(r.error.message);closeModal();await loadData();notify("Organization created (unverified)")}
function openOpportunity(){if(!guard())return;if(!orgs.length)return notify("Register your organization first.");modal("Post an opportunity",'<form class="form" onsubmit="postOpportunity(event)"><div class="full"><label>Organization</label><select class="field" name="organization_id">'+orgs.map(o=>'<option value="'+o.id+'">'+E(o.name)+'</option>').join("")+'</select></div><div class="full"><label>Title</label><input class="field" name="title" required></div><div class="full"><label>Description</label><textarea class="field" name="description" required rows="4"></textarea></div><div><label>Category</label><select class="field" name="category">'+CATS.map(x=>'<option>'+x[1]+'</option>').join("")+'</select></div><div><label>City</label><input class="field" name="city" required></div><div><label>Minimum age</label><input class="field" name="min_age" type="number" min="1" max="120" value="16" required></div><div><label>Estimated hours</label><input class="field" name="estimated_hours" type="number" min="0.25" max="24" step=".25" value="2" required></div><div><label>Schedule</label><select class="field" name="schedule"><option>Saturday</option><option>Sunday</option><option>Weekday</option><option>Flexible</option></select></div><div><label>Commitment</label><select class="field" name="commitment"><option>One-time</option><option>Weekly</option><option>Monthly</option></select></div><div><label>Activity</label><select class="field" name="activity"><option>Hands-on</option><option>Outdoor</option><option>Teaching</option><option>Social</option></select></div><div><label>Distance (miles; optional)</label><input class="field" type="number" name="distance_miles" min="0" max="500"></div><div class="full"><button class="btn">Publish listing</button></div></form>')}
async function postOpportunity(ev){ev.preventDefault();if(!guard())return;let f=new FormData(ev.target),v={organization_id:f.get("organization_id"),title:f.get("title"),description:f.get("description"),category:f.get("category"),city:f.get("city"),min_age:Number(f.get("min_age")),estimated_hours:Number(f.get("estimated_hours")),schedule:f.get("schedule"),commitment:f.get("commitment"),activity:f.get("activity"),distance_miles:f.get("distance_miles")?Number(f.get("distance_miles")):null,active:true};let r=await db.from("opportunities").insert(v);if(r.error)return notify(r.error.message);closeModal();await loadData();notify("Opportunity published")}
async function manageOrg(id){if(!guard())return;let {data,error}=await db.from("applications").select("id,status,message,created_at,opportunities!inner(title,organization_id)").eq("opportunities.organization_id",id);if(error)return notify(error.message);modal("Organization applications",'<p class="fine">Only the owner can review these applications.</p><div class="list">'+(data||[]).map(x=>'<div class="card"><strong>'+E(x.opportunities?.title)+'</strong><p>'+E(x.message)+'</p><span class="badge">'+E(x.status)+'</span><div class="actions"><button class="btn small" onclick="review(\''+x.id+'\',\'accepted\',\''+id+'\')">Accept</button><button class="btn small alt" onclick="review(\''+x.id+'\',\'declined\',\''+id+'\')">Decline</button></div></div>').join("")+'</div>'+(!data?.length?'<div class="empty">No applications yet.</div>':""))}
async function review(id,status,org){let r=await db.from("applications").update({status}).eq("id",id);if(r.error)return notify(r.error.message);notify("Application "+status);await manageOrg(org)}
function openHours(){if(!guard())return;if(!applications.some(a=>a.status==="accepted"||a.status==="completed"))return notify("You need an accepted volunteer application to log a session.");modal("Log volunteer hours",'<form class="form" onsubmit="logHours(event)"><div class="full"><label>Accepted opportunity</label><select class="field" name="application_id">'+applications.filter(a=>["accepted","completed"].includes(a.status)).map(a=>'<option value="'+a.id+'">'+E(a.opportunities?.title)+'</option>').join("")+'</select></div><div><label>Date</label><input class="field" type="date" name="date" required max="'+new Date().toISOString().slice(0,10)+'"></div><div><label>Hours</label><input class="field" type="number" name="hours" min=".25" max="24" step=".25" required></div><div class="full"><label>Description</label><textarea class="field" name="notes" maxlength="500"></textarea></div><div class="full notice">Your submission remains unverified until the organization confirms it.</div><button class="btn">Submit hours</button></form>')}
async function logHours(ev){ev.preventDefault();if(!guard())return;let f=new FormData(ev.target),a=applications.find(x=>x.id===f.get("application_id"));if(!a)return notify("Choose an accepted application.");const opp=items.find(o=>o.id===a.opportunity_id);if(!opp)return notify("Opportunity not found.");let r=await db.from("volunteer_sessions").insert({application_id:a.id,organization_id:opp.organization_id,user_id:user.id,date:f.get("date"),hours:Number(f.get("hours")),notes:f.get("notes")});if(r.error)return notify(r.error.message);closeModal();await loadData();notify("Hours submitted, pending verification")}
if(db){db.auth.onAuthStateChange((event)=>{if(event==="SIGNED_IN"||event==="SIGNED_OUT")setTimeout(bootstrap,0)});bootstrap()}else render();
</script></body></html>
