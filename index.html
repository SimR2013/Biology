organization first.\");modal(\"Post an opportunity\",'\u003cform class=\"form\" onsubmit=\"postOpportunity(event)\">\u003cdiv class=\"full\">\u003clabel>Organization\u003c/label>\u003cselect class=\"field\" name=\"organization_id\">'+orgs.map(o=>'\u003coption value=\"'+o.id+'\">'+E(o.name)+'\u003c/option>').join(\"\")+'\u003c/select>\u003c/div>\u003cdiv class=\"full\">\u003clabel>Title\u003c/label>\u003cinput class=\"field\" name=\"title\" required>\u003c/div>\u003cdiv class=\"full\">\u003clabel>Description\u003c/label>\u003ctextarea class=\"field\" name=\"description\" required rows=\"4\">\u003c/textarea>\u003c/div>\u003cdiv>\u003clabel>Category\u003c/label>\u003cselect class=\"field\" name=\"category\">'+CATS.map(x=>'\u003coption>'+x[1]+'\u003c/option>').join(\"\")+'\u003c/select>\u003c/div>\u003cdiv>\u003clabel>City\u003c/label>\u003cinput class=\"field\" name=\"city\" required>\u003c/div>\u003cdiv>\u003clabel>Minimum age\u003c/label>\u003cinput class=\"field\" name=\"min_age\" type=\"number\" min=\"1\" max=\"120\" value=\"16\" required>\u003c/div>\u003cdiv>\u003clabel>Estimated hours\u003c/label>\u003cinput class=\"field\" name=\"estimated_hours\" type=\"number\" min=\"0.25\" max=\"24\" step=\".25\" value=\"2\" required>\u003c/div>\u003cdiv>\u003clabel>Schedule\u003c/label>\u003cselect class=\"field\" name=\"schedule\">\u003coption>Saturday\u003c/option>\u003coption>Sunday\u003c/option>\u003coption>Weekday\u003c/option>\u003coption>Flexible\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>Commitment\u003c/label>\u003cselect class=\"field\" name=\"commitment\">\u003coption>One-time\u003c/option>\u003coption>Weekly\u003c/option>\u003coption>Monthly\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>Activity\u003c/label>\u003cselect class=\"field\" name=\"activity\">\u003coption>Hands-on\u003c/option>\u003coption>Outdoor\u003c/option>\u003coption>Teaching\u003c/option>\u003coption>Social\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel>Distance (miles; optional)\u003c/label>\u003cinput class=\"field\" type=\"number\" name=\"distance_miles\" min=\"0\" max=\"500\">\u003c/div>\u003cdiv class=\"full\">\u003cbutton class=\"btn\">Publish listing\u003c/button>\u003c/div>\u003c/form>')}\nasync function postOpportunity(ev){ev.preventDefault();if(!guard())return;let f=new FormData(ev.target),v={organization_id:f.get(\"organization_id\"),title:f.get(\"title\"),description:f.get(\"description\"),category:f.get(\"category\"),city:f.get(\"city\"),min_age:Number(f.get(\"min_age\")),estimated_hours:Number(f.get(\"estimated_hours\")),schedule:f.get(\"schedule\"),commitment:f.get(\"commitment\"),activity:f.get(\"activity\"),distance_miles:f.get(\"distance_miles\")?Number(f.get(\"distance_miles\")):null,active:true};let r=await db.from(\"opportunities\").insert(v);if(r.error)return notify(r.error.message);closeModal();await loadData();notify(\"Opportunity published\")}\nasync function manageOrg(id){if(!guard())return;let {data,error}=await db.from(\"applications\").select(\"id,status,message,created_at,opportunities!inner(title,organization_id)\").eq(\"opportunities.organization_id\",id);if(error)return notify(error.message);modal(\"Organization applications\",'\u003cp class=\"fine\">Only the owner can review these applications.\u003c/p>\u003cdiv class=\"list\">'+(data||[]).map(x=>'\u003cdiv class=\"card\">\u003cstrong>'+E(x.opportunities?.title)+'\u003c/strong>\u003cp>'+E(x.message)+'\u003c/p>\u003cspan class=\"badge\">'+E(x.status)+'\u003c/span>\u003cdiv class=\"actions\">\u003cbutton class=\"btn small\" onclick=\"review(\\''+x.id+'\\',\\'accepted\\',\\''+id+'\\')\">Accept\u003c/button>\u003cbutton class=\"btn small alt\" onclick=\"review(\\''+x.id+'\\',\\'declined\\',\\''+id+'\\')\">Decline\u003c/button>\u003c/div>\u003c/div>').join(\"\")+'\u003c/div>'+(!data?.length?'\u003cdiv class=\"empty\">No applications yet.\u003c/div>':\"\"))}\nasync function review(id,status,org){let r=await db.from(\"applications\").update({status}).eq(\"id\",id);if(r.error)return notify(r.error.message);notify(\"Application \"+status);await manageOrg(org)}\nfunction openHours(){if(!guard())return;if(!applications.some(a=>a.status===\"accepted\"||a.status===\"completed\"))return notify(\"You need an accepted volunteer application to log a session.\");modal(\"Log volunteer hours\",'\u003cform class=\"form\" onsubmit=\"logHours(event)\">\u003cdiv class=\"full\">\u003clabel>Accepted opportunity\u003c/label>\u003cselect class=\"field\" name=\"application_id\">'+applications.filter(a=>[\"accepted\",\"completed\"].includes(a.status)).map(a=>'\u003coption value=\"'+a.id+'\">'+E(a.opportunities?.title)+'\u003c/option>').join(\"\")+'\u003c/select>\u003c/div>\u003cdiv>\u003clabel>Date\u003c/label>\u003cinput class=\"field\" type=\"date\" name=\"date\" required max=\"'+new Date().toISOString().slice(0,10)+'\">\u003c/div>\u003cdiv>\u003clabel>Hours\u003c/label>\u003cinput class=\"field\" type=\"number\" name=\"hours\" min=\".25\" max=\"24\" step=\".25\" required>\u003c/div>\u003cdiv class=\"full\">\u003clabel>Description\u003c/label>\u003ctextarea class=\"field\" name=\"notes\" maxlength=\"500\">\u003c/textarea>\u003c/div>\u003cdiv class=\"full notice\">Your submission remains unverified until the organization confirms it.\u003c/div>\u003cbutton class=\"btn\">Submit hours\u003c/button>\u003c/form>')}\nasync function logHours(ev){ev.preventDefault();if(!guard())return;let f=new FormData(ev.target),a=applications.find(x=>x.id===f.get(\"application_id\"));if(!a)return notify(\"Choose an accepted application.\");const opp=items.find(o=>o.id===a.opportunity_id);if(!opp)return notify(\"Opportunity not found.\");let r=await db.from(\"volunteer_sessions\").insert({application_id:a.id,organization_id:opp.organization_id,user_id:user.id,date:f.get(\"date\"),hours:Number(f.get(\"hours\")),notes:f.get(\"notes\")});if(r.error)return notify(r.error.message);closeModal();await loadData();notify(\"Hours submitted, pending verification\")}\nif(db){db.auth.onAuthStateChange((event)=>{if(event===\"SIGNED_IN\"||event===\"SIGNED_OUT\")setTimeout(bootstrap,0)});bootstrap()}else render();\n\u003c/script>\u003c/body>\u003c/html>";
const ARCHIVE={"Kindred/README.md":"# Kindred — Volunteer platform\n\nA GitHub Pages frontend backed by Supabase authentication and Postgres with Row Level Security.\n\n## Publish on GitHub Pages\nThis project lives at `Kindred/` in `SimR2013/Biology`. In that repository, open **Settings → Pages**, select **Deploy from a branch**, branch **main**, folder **/(root)**, and save. After GitHub finishes deploying, open:\n\nhttps://simr2013.github.io/Biology/Kindred/\n\nIf Pages is already configured for main/root, changes publish automatically.\n\n## Connect the real backend\n1. Create a project at https://supabase.com/dashboard and use the **SQL Editor** to execute `schema.sql` once.\n2. In Supabase **Project Settings → API**, copy the project URL and **publishable key** (or legacy `anon` key). NEVER put the secret/service_role key in client code.\n3. Edit the top of the inline script in `index.html`:\n   `const CONFIG={url:\"https://YOURPROJECT.supabase.co\",anonKey:\"YOUR_PUBLISHABLE_KEY\"};`\n4. In Supabase **Authentication → URL Configuration**, set Site URL to `https://simr2013.github.io/Biology/Kindred/` and add that URL to allowed redirect URLs.\n5. Commit the modified file. GitHub Pages deploys the updated site.\n\n## Included\n- Responsive landing page and discover pages\n- Real email/password signup and login with Supabase Auth once configured\n- Profiles and scored recommendations (interest 30%, availability 25%, distance 20%, commitment 10%, activity 15%)\n- Age eligibility filtering and server-side application eligibility checks\n- Organizations and listing creation\n- Applications and organization accept/decline actions\n- Hours logging from accepted applications (pending verification), saved listings, dashboards\n- Row Level Security policies to separate volunteer and organization data\n\n## Important limitations / to build before a public launch\n- **Backend credentials must be configured**. Without this, actions tell the visitor that the service has not been activated.\n- No organizations, opportunity listings, user counts, or verified badges are fabricated.\n- Organization verification is admin-controlled in SQL; there is no browser admin verification screen yet.\n- Organization **hours verification UI is not implemented** yet; the underlying SQL schema supports owner-authorized status changes. Add that screen before claiming hours verification works end-to-end.\n- Match distance is meaningful only if each opportunity has an accurate distance_miles for each user; currently listing distance is a basic entered number. Replace with geocoding/road-distance calculation for trustworthy personalized results.\n- Email notifications, external applications, rich availability, badges/streaks, photo uploads, abuse reports, and full accessibility/security testing remain future work.\n- Real deployments should add rate limits, CAPTCHA/anti-spam, privacy policy, terms, user deletion workflow, moderation and parental/age safeguards.\n- The dashboard counts only `verified` sessions. Do not mark unapproved sessions as verified.\n\n## Security\nSupabase's public/publishable key is designed for browser use. Sensitive permissions are enforced via Postgres RLS. Do not expose the service-role or secret key in GitHub. Keep Supabase project administration private.\n\n## Test\nTest with two distinct emails: volunteer (complete profile with valid age) and organization owner (register organization, post a listing, review an application). Confirm users cannot see each other's private application histories. Use Supabase SQL Editor for inspecting or administering backend data.\n","Kindred/schema.sql":"-- Kindred database schema. Run once in Supabase SQL Editor.\n-- Never use a service_role key in the browser.\ncreate extension if not exists pgcrypto;\ncreate table if not exists public.profiles (\n  id uuid primary key references auth.users(id) on delete cascade,\n  full_name text not null default '',\n  city text,\n  age integer check(age between 1 and 120),\n  interests text[] not null default '{}',\n  availability text[] not null default '{}',\n  activities text[] not null default '{}',\n  max_distance numeric check(max_distance between 0 and 500),\n  commitment text,\n  created_at timestamptz not null default now()\n);\ncreate table if not exists public.organizations (\n  id uuid primary key default gen_random_uuid(),\n  owner_id uuid not null references auth.users(id) on delete cascade,\n  name text not null check(length(name) between 2 and 120),\n  description text,\n  city text not null,\n  contact_email text not null,\n  verified boolean not null default false,\n  created_at timestamptz not null default now()\n);\ncreate table if not exists public.opportunities (\n  id uuid primary key default gen_random_uuid(),\n  organization_id uuid not null references public.organizations(id) on delete cascade,\n  title text not null,\n  description text not null,\n  category text not null,\n  city text not null,\n  min_age int not null default 16 check(min_age between 1 and 120),\n  estimated_hours numeric not null default 2 check(estimated_hours > 0 and estimated_hours \u003c= 24),\n  schedule text not null default 'Flexible',\n  commitment text not null default 'One-time',\n  activity text not null default 'Hands-on',\n  distance_miles numeric check(distance_miles between 0 and 500),\n  active boolean not null default true,\n  created_at timestamptz not null default now()\n);\ncreate table if not exists public.applications (\n  id uuid primary key default gen_random_uuid(),\n  opportunity_id uuid not null references public.opportunities(id) on delete cascade,\n  user_id uuid not null references auth.users(id) on delete cascade,\n  message text not null,\n  status text not null default 'pending' check(status in ('pending','accepted','declined','completed','cancelled')),\n  created_at timestamptz not null default now(),\n  unique(opportunity_id,user_id)\n);\ncreate table if not exists public.saved_opportunities (\n  user_id uuid not null references auth.users(id) on delete cascade,\n  opportunity_id uuid not null references public.opportunities(id) on delete cascade,\n  primary key(user_id,opportunity_id)\n);\ncreate table if not exists public.volunteer_sessions (\n  id uuid primary key default gen_random_uuid(),\n  application_id uuid not null references public.applications(id) on delete cascade,\n  organization_id uuid not null references public.organizations(id) on delete cascade,\n  user_id uuid not null references auth.users(id) on delete cascade,\n  date date not null,\n  hours numeric not null check(hours > 0 and hours \u003c= 24),\n  notes text,\n  status text not null default 'pending' check(status in ('pending','verified','rejected')),\n  created_at timestamptz not null default now()\n);\n-- Admin membership is managed only via SQL/service role, never by the browser.\ncreate table if not exists public.platform_admins (\n  user_id uuid primary key references auth.users(id) on delete cascade\n);\ncreate or replace function public.is_platform_admin() returns boolean language sql stable security definer set search_path=public as $\n  select exists(select 1 from public.platform_admins where user_id=auth.uid());\n$;\n-- Prevent client-side spoofing of verification, review status, and session status.\ncreate or replace function public.guard_kindred_changes() returns trigger language plpgsql security definer set search_path=public as $\nbegin\n  if tg_table_name = 'organizations' then\n    if (tg_op='INSERT' and new.verified) or (tg_op='UPDATE' and new.verified is distinct from old.verified) then\n      if not public.is_platform_admin() then raise exception 'Only admins can verify organizations'; end if;\n    end if;\n  elsif tg_table_name='applications' then\n    if tg_op='INSERT' then\n      new.status:='pending';\n    else\n      if new.opportunity_id\u003c>old.opportunity_id or new.user_id\u003c>old.user_id then\n        raise exception 'Application ownership cannot change';\n      end if;\n      if new.status\u003c>old.status and not exists(\n        select 1 from public.opportunities p join public.organizations o on o.id=p.organization_id\n        where p.id=old.opportunity_id and o.owner_id=auth.uid()\n      ) and not public.is_platform_admin() then raise exception 'Only organization owners can review applications'; end if;\n    end if;\n  elsif tg_table_name='volunteer_sessions' then\n    if tg_op='INSERT' then\n      new.status:='pending';\n    else\n      if new.user_id\u003c>old.user_id or new.organization_id\u003c>old.organization_id or new.application_id\u003c>old.application_id then\n        raise exception 'Session ownership cannot change';\n      end if;\n      if new.status\u003c>old.status and not exists(select 1 from public.organizations o where o.id=old.organization_id and o.owner_id=auth.uid()) and not public.is_platform_admin() then\n        raise exception 'Only organization owners can verify hours';\n      end if;\n    end if;\n  end if;\n  return new;\nend; $;\ndrop trigger if exists guard_org on public.organizations;\ncreate trigger guard_org before insert or update on public.organizations for each row execute function public.guard_kindred_changes();\ndrop trigger if exists guard_app on public.applications;\ncreate trigger guard_app before insert or update on public.applications for each row execute function public.guard_kindred_changes();\ndrop trigger if exists guard_sessions on public.volunteer_sessions;\ncreate trigger guard_sessions before insert or update on public.volunteer_sessions for each row execute function public.guard_kindred_changes();\n\nalter table public.profiles enable row level security;\nalter table public.organizations enable row level security;\nalter table public.opportunities enable row level security;\nalter table public.applications enable row level security;\nalter table public.saved_opportunities enable row level security;\nalter table public.volunteer_sessions enable row level security;\nalter table public.platform_admins enable row level security;\n\ncreate policy \"Read own profile\" on public.profiles for select to authenticated using(id=auth.uid());\ncreate policy \"Create own profile\" on public.profiles for insert to authenticated with check(id=auth.uid());\ncreate policy \"Edit own profile\" on public.profiles for update to authenticated using(id=auth.uid()) with check(id=auth.uid());\n\ncreate policy \"Public organizations\" on public.organizations for select to anon,authenticated using(true);\ncreate policy \"Organization owner creates\" on public.organizations for insert to authenticated with check(owner_id=auth.uid() and verified=false);\ncreate policy \"Organization owner updates\" on public.organizations for update to authenticated using(owner_id=auth.uid()) with check(owner_id=auth.uid());\ncreate policy \"Organization owner deletes\" on public.organizations for delete to authenticated using(owner_id=auth.uid());\n\ncreate policy \"Read active opportunities and owned listings\" on public.opportunities for select to anon,authenticated using(active=true or exists(select 1 from public.organizations o where o.id=organization_id and o.owner_id=auth.uid()));\ncreate policy \"Owner posts opportunities\" on public.opportunities for insert to authenticated with check(exists(select 1 from public.organizations o where o.id=organization_id and o.owner_id=auth.uid()));\ncreate policy \"Owner edits opportunities\" on public.opportunities for update to authenticated using(exists(select 1 from public.organizations o where o.id=organization_id and o.owner_id=auth.uid())) with check(exists(select 1 from public.organizations o where o.id=organization_id and o.owner_id=auth.uid()));\ncreate policy \"Owner deletes opportunities\" on public.opportunities for delete to authenticated using(exists(select 1 from public.organizations o where o.id=organization_id and o.owner_id=auth.uid()));\n\ncreate policy \"Read own or organization applications\" on public.applications for select to authenticated using(user_id=auth.uid() or exists(select 1 from public.opportunities p join public.organizations o on o.id=p.organization_id where p.id=opportunity_id and o.owner_id=auth.uid()));\ncreate policy \"Volunteer applies if eligible\" on public.applications for insert to authenticated with check(\n user_id=auth.uid() and status='pending' and exists(\n select 1 from public.opportunities p where p.id=opportunity_id and p.active=true\n and exists(select 1 from public.profiles pr where pr.id=auth.uid() and pr.age is not null and pr.age>=p.min_age)\n ));\ncreate policy \"Organization owner reviews\" on public.applications for update to authenticated using(exists(select 1 from public.opportunities p join public.organizations o on o.id=p.organization_id where p.id=opportunity_id and o.owner_id=auth.uid())) with check(exists(select 1 from public.opportunities p join public.organizations o on o.id=p.organization_id where p.id=opportunity_id and o.owner_id=auth.uid()));\n\ncreate policy \"User sees saved\" on public.saved_opportunities for select to authenticated using(user_id=auth.uid());\ncreate policy \"User saves\" on public.saved_opportunities for insert to authenticated with check(user_id=auth.uid());\ncreate policy \"User unsaves\" on public.saved_opportunities for delete to authenticated using(user_id=auth.uid());\n\ncreate policy \"Session owner and org read\" on public.volunteer_sessions for select to authenticated using(user_id=auth.uid() or exists(select 1 from public.organizations o where o.id=organization_id and o.owner_id=auth.uid()));\ncreate policy \"Volunteer logs own accepted application\" on public.volunteer_sessions for insert to authenticated with check(\n user_id=auth.uid() and status='pending' and date \u003c= current_date\n and exists(select 1 from public.applications a join public.opportunities p on p.id=a.opportunity_id\n where a.id=application_id and a.user_id=auth.uid() and a.status in ('accepted','completed') and p.organization_id=organization_id));\ncreate policy \"Organization owner verifies sessions\" on public.volunteer_sessions for update to authenticated\n using(exists(select 1 from public.organizations o where o.id=organization_id and o.owner_id=auth.uid()))\n with check(exists(select 1 from public.organizations o where o.id=organization_id and o.owner_id=auth.uid()));\n-- No select/insert/update/delete policies for platform_admins; only privileged SQL can assign admins.\ncreate index if not exists idx_kindred_ops_org on public.opportunities(organization_id);\ncreate index if not exists idx_kindred_app_user on public.applications(user_id);\ncreate index if not exists idx_kindred_sessions_user on public.volunteer_sessions(user_id);\n","README.md":"# Biology — Chapter 4 Study Guide\n\nInteractive Chapter 4 study website with game and hardcore study modes, flashcards, practice questions, and an offline tutor.\n\nThe site is served from `index.html` using GitHub Pages.\n\n**Note:** Real AI tutoring is not active until a secure server-side AI provider is configured. Never commit API keys into this public repository.\n","TEST_FORMAT.md":"# /test — Biology Study Vault format\n\nUse this format when creating any new **/test** study website from the student's supplied source materials.\n\n## Entry experience\n\n- The root (`index.html`) is a chapter/test picker.\n- Keep each chapter as a dedicated page, starting with `chapter4.html`.\n- Pick a **chapter** first, then pick a **mode** (teacher-style mock exam, generated practice, hardcore, flashcards, notes, written practice, guided tutor, and optional ecosystem game).\n- Only mark a chapter **Ready** after its content has actually been built and checked against the student's source materials.\n- Never claim an offline rubric checker is live AI.\n\n## Required study experience for future chapters\n\n1. Full, source-grounded, clearly organized lesson notes, definitions and diagram explanations.\n2. Flashcards and recall quiz with mastered/missed review and browser-local progress.\n3. Mock exam matching the supplied teacher question count, written response count, and common question patterns.\n4. Repeatable practice question generator with real explanations and resource references, and explicit notice that the templates are finite and may repeat.\n5. Hardcore difficulty mode, game/mission mode when relevant, and complete review after each quiz.\n6. Written-response practice with model responses, rubric feedback, and disclosure when checking is rule-based.\n7. Mobile-friendly navigation, clear source labels and accessible controls.\n8. Preserve previous content and progress when adding material.\n9. No API keys in GitHub Pages. Any live AI integration requires a protected service and user authorization.\n\n## Chapter registry\n\n- Chapter 1 — **placeholder only** until the complete source material is retrieved and reviewed.\n- Chapter 2 — **placeholder only** until the complete source material is retrieved and reviewed.\n- Chapter 4 — **ready**: Lessons 4.1, 4.2, 4.3 and 7.2; teacher blueprint: 23 questions, 21 multiple choice + 2 written.\n\nThe root selector deep-links into `chapter4.html?mode=exam`, `?mode=generator&topic=4.2`, etc. The `route.js` script opens the proper mode.\n\n## Repository structure\n\n- `index.html` — choose your chapter and study mode\n- `chapter4.html` — full Chapter 4 study website\n- `endless.js` — renewable practice and flashcards\n- `organize.js` — grouped study navigation\n- `route.js` — landing-page to study-mode routing\n- `bioforge.html` — Chapter 4 interactive ecosystem game\n\nNever alter the user's existing mock-exam question/answer structure without checking it against the source materials.\n"};
