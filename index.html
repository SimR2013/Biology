))}\nheader a{text-decoration:none;font-weight:800;color:var(--t-accent)}\nmain{max-width:1060px;margin:auto;padding:24px 18px 90px}\nh1{font-size:clamp(1.9rem,5vw,3rem);margin:4px 0}\nh2{margin:4px 0 12px;font-size:1.4rem}\n.muted,p{color:var(--t-muted)}\n.intro{margin-bottom:24px}\n.card{border:1px solid var(--t-border);background:var(--t-card);border-radius:20px;padding:20px;margin:17px 0}\n.palette-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px;margin-top:16px}\n.palette{border:2px solid var(--t-border);background:var(--t-card2);color:var(--t-text);border-radius:15px;padding:10px;display:grid;gap:8px;text-align:left;min-height:122px}\n.palette[aria-pressed=\"true\"]{border-color:var(--t-accent);box-shadow:0 0 0 2px var(--t-accent)}\n.swatches{display:flex;gap:4px;height:54px}\n.swatches span{flex:1;border-radius:8px}\n.palette strong{font-size:.94rem}.palette small{color:var(--t-muted);font-size:.78rem}\n.color-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:end}\n.color-controls label{display:grid;gap:7px;font-weight:750}\n.color-controls select,.color-controls input[type=\"range\"]{width:100%;background:var(--t-card2);color:var(--t-text);border:1px solid var(--t-border);border-radius:10px;padding:9px;min-height:48px}\n.color-controls input[type=\"color\"]{width:100%;height:54px;border:1px solid var(--t-border);border-radius:10px;background:transparent;cursor:pointer}\n.custom-preview{display:flex;min-height:95px;gap:11px;padding:14px;border-radius:13px;background:var(--t-card2);align-items:center;justify-content:space-between;margin-top:16px}\n.preview-button{background:var(--t-accent);color:var(--t-accent-text);border:0;padding:12px 18px;border-radius:11px;font-weight:800}\n.quick-links{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}\n.quick-links a{padding:13px 17px;background:var(--t-card2);border:1px solid var(--t-border);border-radius:12px;text-decoration:none;font-weight:800}\n#status{font-weight:700;color:var(--t-text)}\n@media(max-width:640px){.palette-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.palette{padding:8px;min-height:109px}.swatches{height:43px}.card{padding:15px}.color-controls{grid-template-columns:1fr}.custom-preview{flex-wrap:wrap}.quick-links{display:grid;grid-template-columns:1fr 1fr}.quick-links a{font-size:.83rem;text-align:center;padding:12px 7px}}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cheader>\u003ca href=\"./\">← Biology Study Vault\u003c/a>\u003c/header>\n\u003cmain>\u003cdiv class=\"intro\">\u003cdiv style=\"font-size:.82rem;font-weight:850;letter-spacing:.12em;color:var(--t-accent)\">PERSONALIZE YOUR STUDY SPACE\u003c/div>\u003ch1>🎨 Themes & Color Wheel\u003c/h1>\u003cp>Choose a full color combination—not just a background color. Tap a palette to preview it instantly. Your selection automatically applies to the homepage, lessons, flashcards, mock exams, and BioForge.\u003c/p>\u003c/div>\n\u003csection class=\"card\">\u003ch2>Color combinations\u003c/h2>\u003cp>Bright palettes, calm palettes, dark palettes, and automatic appearance.\u003c/p>\u003cdiv class=\"palette-grid\" id=\"palettes\">\u003c/div>\u003c/section>\n\u003csection class=\"card\">\u003ch2>🌈 Custom color wheel\u003c/h2>\u003cp>Choose any color, then select a dark or light version of your personalized theme.\u003c/p>\u003cdiv class=\"color-controls\">\u003clabel>Pick your color\u003cinput type=\"color\" id=\"wheel\" value=\"#3976bd\">\u003c/label>\u003clabel>Light or dark\u003cselect id=\"light\">\u003coption value=\"dark\">Dark background\u003c/option>\u003coption value=\"light\">Light background\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"custom-preview\">\u003cdiv>\u003cstrong>Live preview\u003c/strong>\u003cdiv class=\"muted\">Buttons, borders, and backgrounds change together.\u003c/div>\u003c/div>\u003cbutton class=\"preview-button\" type=\"button\" id=\"applyCustom\">Apply custom theme\u003c/button>\u003c/div>\u003c/section>\n\u003cp id=\"status\" role=\"status\" aria-live=\"polite\">Your theme is saved on this device.\u003c/p>\n\u003cnav class=\"quick-links\">\u003ca href=\"./\">⌂ Homepage\u003c/a>\u003ca href=\"chapter4.html?mode=course\">📘 Lessons\u003c/a>\u003ca href=\"chapter4.html?mode=flash\">🧠 Flashcards\u003c/a>\u003ca href=\"chapter4.html?mode=smart\">🚀 Smart Hub\u003c/a>\u003c/nav>\n\u003c/main>\n\u003cscript>\n(()=>{\n'use strict';\nconst options=[\n['blue','💙 Calm Blue',['#0e2038','#254362','#a8d2ef'],'Classic blue shades'],\n['midnight','🌙 Midnight',['#101626','#313f5d','#b5c8fc'],'Deep night blue'],\n['lavender','💜 Lavender',['#211d3b','#47406d','#d7bcfa'],'Purple and lilac'],\n['forest','🌲 Forest',['#102822','#2a594b','#a5dfcb'],'Deep green'],\n['light','☀️ Light',['#eaf2fb','#ffffff','#286c99'],'Airy and clear'],\n['ocean','🌊 Ocean',['#09283a','#235d72','#9edfe9'],'Sea blue'],\n['rose','🌹 Rose',['#32202b','#624558','#f2c2d5'],'Dusty rose'],\n['sunset','🌅 Sunset',['#34242c','#694953','#f3c5a6'],'Peach at dusk'],\n['amber','🍯 Amber',['#29251b','#594c34','#f0d39d'],'Warm golden'],\n['mint','🍃 Mint',['#142c2c','#356062','#b0e9dc'],'Cool mint'],\n['berry','🫐 Berry',['#251b34','#564069','#d8b9ee'],'Purple berry'],\n['slate','🪨 Slate',['#1b2532','#40556b','#c4daed'],'Cool grey blue'],\n['beach','🏖️ Beach',['#047aa5','#f6e9ca','#e97629'],'Bright blue + sand + orange'],\n['tropical','🌴 Tropical',['#007a7b','#e9f7ef','#d95660'],'Aqua + mint + coral'],\n['sunshine','☀️ Sunshine',['#1769ab','#fff5c6','#e79222'],'Blue + yellow + orange'],\n['candy','🍬 Candy',['#cf5a95','#dff8ed','#9d70df'],'Pink + mint + purple'],\n['lagoon','🐠 Lagoon',['#137c89','#fce5d1','#c65c2f'],'Teal + peach'],\n['festival','🎉 Festival',['#4a2a76','#d0ed72','#dc72b7'],'Purple + lime + pink'],\n['auto','🌓 Auto',['#142c48','#ffffff','#a8d2ef'],'Follows your device'],\n['custom','🎨 Custom',['#3976bd','#dceafb','#f3ba7b'],'Your color-wheel choice']\n];\nconst root=document.documentElement,grid=document.querySelector('#palettes'),wheel=document.querySelector('#wheel'),mode=document.querySelector('#light');\nconst get=(k,f)=>{try{return localStorage.getItem(k)||f}catch(e){return f}},put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};\nlet choice=get('biology:color-theme','blue');\nmode.value=get('biology:custom-light','dark');\nconst m=window.matchMedia?window.matchMedia('(prefers-color-scheme: light)'):null;\nfunction hex(h,s,l){s/=100;l/=100;let a=s*Math.min(l,1-l),f=n=>{let k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}\nfunction colorHue(s){let n=parseInt(s.slice(1),16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255,d=Math.max(r,g,b)-Math.min(r,g,b);if(!d)return 210;let h=Math.max(r,g,b)===r?((g-b)/d)%6:Math.max(r,g,b)===g?(b-r)/d+2:(r-g)/d+4;return (h*60+360)%360}\nfunction custom(h,light){const v=light?{bg:hex(h,34,96),header:hex(h,45,98),card:'#ffffff',card2:hex(h,34,90),border:hex(h,28,74),text:hex(h,40,19),muted:hex(h,24,37),accent:hex(h,72,34),'accent-text':'#ffffff',focus:'#936530',soft:hex(h,50,32)}:{bg:hex(h,42,12),header:hex(h,45,16),card:hex(h,36,21),card2:hex(h,33,27),border:hex(h,23,43),text:'#f1f6ff',muted:hex(h,25,79),accent:hex(h,67,78),'accent-text':hex(h,42,13),focus:'#f0dba6',soft:hex(h,65,87)};Object.entries(v).forEach(([k,x])=>root.style.setProperty('--t-'+k,x))}\nfunction apply(id){choice=id;put('biology:color-theme',id);root.setAttribute('data-study-theme',id==='auto'?(m?.matches?'light':'blue'):id);['bg','header','card','card2','border','text','muted','accent','accent-text','focus','soft'].forEach(k=>root.style.removeProperty('--t-'+k));if(id==='custom')custom(Number(get('biology:custom-hue','210')),mode.value==='light');grid.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));document.querySelector('#status').textContent='Selected: '+options.find(x=>x[0]===id)?.[1]+'. Saved for all Biology pages.'}\nfor(const [id,name,colors,description] of options){let b=document.createElement('button');b.className='palette';b.dataset.id=id;b.type='button';b.innerHTML='\u003cspan class=\"swatches\">'+colors.map(color=>'\u003cspan style=\"background:'+color+'\">\u003c/span>').join('')+'\u003c/span>\u003cstrong>'+name+'\u003c/strong>\u003csmall>'+description+'\u003c/small>';b.onclick=()=>apply(id);grid.append(b)}\nwheel.value=hex(Number(get('biology:custom-hue','210')),65,52);\nfunction pick(){put('biology:custom-hue',String(Math.round(colorHue(wheel.value))));put('biology:custom-light',mode.value);apply('custom')}\nwheel.oninput=pick;mode.onchange=pick;document.querySelector('#applyCustom').onclick=pick;\nif(m)m.addEventListener?.('change',()=>{if(choice==='auto')apply('auto')});\napply(options.some(o=>o[0]===choice)?choice:'blue');\n})();\n\u003c/script>\u003cscript>document.addEventListener(\"click\",e=>{const a=e.target.closest(\"a[href]\");if(!a)return;let h=a.getAttribute(\"href\");if(h&&(h===\"./\"||/^(?:\\.\\/)?(?:index|chapter4|bioforge|themes|race)\\.html(?:[?#].*)?$/.test(h))){e.preventDefault();parent.BIO_NAV(h)}},true)\u003c/script>\u003c/body>\u003c/html>"};
PAGES.race="\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>Speed Battle · Biology\u003c/title>\n\u003cstyle>\n:root{--bg:#101830;--panel:#202f53;--panel2:#2a3d65;--line:#53668c;--text:#f5f8ff;--muted:#c5d0e7;--accent:#c6f36e;--pink:#ff90bf;--gold:#ffd278;--good:#79e3b8;--bad:#ffaaa9}\n*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 83% 0,#4b2c76 0,transparent 35%),radial-gradient(ellipse at 0 72%,#205f7c 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",sans-serif;min-height:100dvh}\nmain{max-width:1060px;margin:auto;padding:24px 18px 100px}.eyebrow{font-weight:900;font-size:.75rem;letter-spacing:.17em;color:var(--accent)}h1{font-size:clamp(2.2rem,7vw,4.1rem);line-height:1.08;margin:10px 0}h2{font-size:1.4rem;margin:0 0 12px}h3{font-size:1.14rem;margin:9px 0}p{color:var(--muted);margin:8px 0 15px}\n.hero{border:1px solid #6e7fac;border-radius:23px;background:#232d53b9;padding:24px;margin-bottom:20px;overflow:hidden}.hero strong{color:var(--gold)}\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#202f53ec;border:1px solid var(--line);border-radius:19px;padding:20px;margin:12px 0;min-width:0}\nlabel{display:grid;gap:6px;color:var(--muted);font-weight:700;margin:9px 0}input,select{width:100%;background:#162542;color:var(--text);border:1px solid #7080ad;padding:13px;border-radius:12px;min-height:50px;font:inherit}input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.46;cursor:not-allowed}\n.btn{background:var(--accent);color:#24301a;border:0;border-radius:12px;font-weight:900;min-height:49px;padding:12px 17px}\n.secondary{background:#33466f;color:#fff;border:1px solid #7890b9}.pink{background:var(--pink);color:#361b30}.actionbar{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.actionbar>*{flex:1}\n.status{background:#152444;padding:11px 13px;border-radius:11px;border:1px solid #536c96;color:var(--muted);margin:13px 0;min-height:46px}.status.good{border-color:var(--good);color:var(--good)}.status.bad{border-color:var(--bad);color:var(--bad)}\n.room-code{font-size:clamp(1.65rem,6vw,2.8rem);letter-spacing:.18em;font-weight:950;color:var(--accent);margin:12px 0}\n#lobby[hidden],#play[hidden],#welcome[hidden],#end[hidden]{display:none!important}\n#modeHeader{font-size:.76rem;color:var(--gold);letter-spacing:.12em;font-weight:900}\n#roster{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.player{border:1px solid var(--line);padding:7px 12px;background:var(--panel2);border-radius:40px;font-size:.9rem}\n#timer{font-size:2rem;font-weight:950;color:var(--gold);font-variant-numeric:tabular-nums}.battle-top{display:flex;gap:10px;align-items:center;justify-content:space-between}\n.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}\n.answers button{min-height:94px;padding:16px;border:2px solid #6479a5;border-radius:16px;background:#2a406f;color:#fff;font-weight:780;text-align:left;display:flex;gap:12px;align-items:center}\n.answers button:nth-child(2){background:#5d345e}.answers button:nth-child(3){background:#225c64}.answers button:nth-child(4){background:#61503a}\n.answers button.chosen{outline:3px solid var(--gold)}.answers button.reveal-correct{border:3px solid var(--good)}.answers button.reveal-wrong{opacity:.55}\n.answer-letter{background:#fff3;color:#fff;border-radius:9px;padding:8px 10px;font-weight:950;flex-shrink:0}\n.progress{height:10px;background:#0d203a;overflow:hidden;border-radius:30px;margin:9px 0}.progress>div{height:100%;width:100%;background:var(--accent);transition:width .1s linear}\ntable{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}td,th{padding:10px 7px;text-align:left;border-bottom:1px solid #526687}th{color:var(--muted)}td:last-child,th:last-child{text-align:right}tr:first-child td{color:var(--gold);font-weight:850}\n.tag{font-size:.76rem;background:#fff1;color:var(--gold);padding:5px 9px;border-radius:30px}.tiny{font-size:.78rem;color:var(--muted)}.notice{font-size:.83rem;color:var(--muted);line-height:1.55}\n#feedback{font-weight:800;min-height:28px;margin-top:12px}#questionText{font-size:clamp(1.15rem,3.2vw,1.6rem);line-height:1.4}\n.statline{display:flex;gap:16px;flex-wrap:wrap}.statline strong{font-size:1.4rem;color:var(--accent)}\nol{padding-left:20px}li{margin-bottom:6px}.hidden{display:none!important}\n@media(max-width:700px){main{padding:13px 12px 100px}.hero{padding:16px}.grid{grid-template-columns:1fr;gap:0}.card{padding:15px}.answers{gap:8px}.answers button{padding:11px 9px;min-height:108px;align-items:flex-start;flex-direction:column;font-size:.86rem}.answer-letter{padding:4px 7px}.actionbar{flex-direction:column}.room-code{letter-spacing:.14em}.battle-top{align-items:center}#timer{font-size:1.6rem}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cmain>\n\u003cdiv class=\"hero\">\u003cdiv class=\"eyebrow\">⚡ BIOLOGY · CLASSROOM ARENA\u003c/div>\u003ch1>SPEED \u003cstrong>BATTLE.\u003c/strong>\u003c/h1>\u003cp>Answer first, earn more points, build a streak, and beat the leaderboard. Play together across phones or laptops—no student accounts required.\u003c/p>\u003cdiv class=\"statline\">\u003cspan class=\"tag\">⚡ FAST ANSWERS\u003c/span>\u003cspan class=\"tag\">🏆 LIVE LEADERBOARD\u003c/span>\u003cspan class=\"tag\">🔥 STREAK BONUS\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv id=\"welcome\" class=\"grid\">\n\u003csection class=\"card\">\u003ch2>👑 Host a game\u003c/h2>\u003cp>Start a room and share its six-character code. You control when each question begins.\u003c/p>\u003clabel>Your nickname\u003cinput id=\"hostName\" maxlength=\"20\" autocomplete=\"nickname\" placeholder=\"Host\" value=\"Host\">\u003c/label>\u003clabel>Question pack\u003cselect id=\"topic\">\u003coption value=\"all\">All Chapter 4 topics\u003c/option>\u003coption value=\"4.1\">4.1 · Producers & Consumers\u003c/option>\u003coption value=\"4.2\">4.2 · Energy Flow\u003c/option>\u003coption value=\"4.3\">4.3 · Matter Cycles\u003c/option>\u003coption value=\"7.2\">7.2 · Human Impacts\u003c/option>\u003c/select>\u003c/label>\u003clabel>Seconds per question\u003cselect id=\"seconds\">\u003coption value=\"10\">10 seconds · intense\u003c/option>\u003coption value=\"15\" selected>15 seconds · balanced\u003c/option>\u003coption value=\"20\">20 seconds · relaxed\u003c/option>\u003c/select>\u003c/label>\u003clabel>Number of questions\u003cselect id=\"rounds\">\u003coption value=\"10\" selected>10 rounds\u003c/option>\u003coption value=\"15\">15 rounds\u003c/option>\u003coption value=\"20\">20 rounds\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"hostBtn\" class=\"btn\">Create room →\u003c/button>\u003c/section>\n\u003csection class=\"card\">\u003ch2>🎮 Join a game\u003c/h2>\u003cp>Enter the code from your friend's screen to join their leaderboard in real time.\u003c/p>\u003clabel>Your nickname\u003cinput id=\"joinName\" maxlength=\"20\" autocomplete=\"nickname\" placeholder=\"Your name\">\u003c/label>\u003clabel>Six-character room code\u003cinput id=\"joinCode\" maxlength=\"6\" spellcheck=\"false\" autocapitalize=\"characters\" placeholder=\"ABC123\">\u003c/label>\u003cbutton id=\"joinBtn\" class=\"btn pink\">Join room →\u003c/button>\u003cp class=\"notice\">Internet is needed for live rooms. Only your nickname, answers and game scores are shared with other players. Rooms end when the host leaves.\u003c/p>\u003c/section>\n\u003c/div>\n\u003cdiv class=\"status\" id=\"status\" role=\"status\" aria-live=\"polite\">Choose Host or Join to get started.\u003c/div>\n\u003csection class=\"card\" id=\"lobby\" hidden>\u003cdiv id=\"modeHeader\">\u003c/div>\u003ch2 id=\"lobbyTitle\">Game lobby\u003c/h2>\u003cdiv id=\"roomDisplay\" class=\"room-code\">\u003c/div>\u003cdiv class=\"actionbar\">\u003cbutton class=\"btn secondary\" id=\"copyInvite\">📋 Copy invite link\u003c/button>\u003cbutton class=\"btn secondary\" id=\"leaveBtn\">Leave room\u003c/button>\u003c/div>\u003ch3>Players in room\u003c/h3>\u003cdiv id=\"roster\">\u003c/div>\u003cp class=\"notice\">Only the host can start and advance rounds. Keep the host tab open. Share the code rather than personal information.\u003c/p>\u003cbutton class=\"btn\" id=\"startBtn\">▶ Start battle\u003c/button>\u003c/section>\n\u003csection id=\"play\" hidden>\n\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003cdiv class=\"battle-top\">\u003cspan id=\"questionCount\" class=\"tag\">ROUND 1\u003c/span>\u003cspan id=\"timer\">15.0\u003c/span>\u003c/div>\u003cdiv class=\"progress\">\u003cdiv id=\"timerBar\">\u003c/div>\u003c/div>\u003ch2 id=\"questionText\">\u003c/h2>\u003cdiv id=\"answers\" class=\"answers\">\u003c/div>\u003cdiv id=\"feedback\" aria-live=\"polite\">\u003c/div>\u003cdiv id=\"reason\" class=\"notice\">\u003c/div>\u003cdiv class=\"actionbar\">\u003cbutton class=\"btn\" id=\"nextBtn\" hidden>Next round →\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>🏆 Live leaderboard\u003c/h2>\u003ctable>\u003cthead>\u003ctr>\u003cth>Player\u003c/th>\u003cth>Speed\u003c/th>\u003cth>Points\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"board\">\u003c/tbody>\u003c/table>\u003cp class=\"tiny\">Correct answers earn points based on reaction time, with streak bonuses. The host verifies all responses.\u003c/p>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection id=\"end\" class=\"card\" hidden>\u003ch2>🏆 Final results\u003c/h2>\u003cdiv id=\"winner\">\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>Rank / player\u003c/th>\u003cth>Score\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"finalBoard\">\u003c/tbody>\u003c/table>\u003cdiv class=\"actionbar\">\u003cbutton class=\"btn\" id=\"againBtn\">Play again\u003c/button>\u003cbutton class=\"btn secondary\" id=\"endLeave\">Exit room\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"card\">\u003ch3>How it works\u003c/h3>\u003col>\u003cli>One student chooses \u003cb>Host\u003c/b> and shares their room code.\u003c/li>\u003cli>Everyone else chooses \u003cb>Join\u003c/b> and enters their nickname and code.\u003c/li>\u003cli>The host starts the game; all players receive the same questions.\u003c/li>\u003cli>Fast correct answers earn more points. The leaderboard updates after each answer.\u003c/li>\u003c/ol>\u003cp class=\"notice\">Rooms use free WebRTC signaling. Connection success depends on student networks and the signaling service. No persistent public accounts or class-wide database are used. This is a casual learning game, not a secure proctored competition.\u003c/p>\u003c/section>\n\u003c/main>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js\">\u003c/script>\n\u003cscript>\n(function(){\n'use strict';\nconst QUESTIONS=[{\"unit\":\"4.1\",\"q\":\"A bacterium lives near a deep-sea hydrothermal vent with no sunlight. It makes carbohydrates using energy released from inorganic chemicals. What BEST describes it?\",\"choices\":[\"A photosynthetic heterotroph\",\"A chemosynthetic autotroph\",\"A scavenger\",\"A decomposer\"],\"answer\":1,\"why\":\"It makes its own organic food using chemical energy, without sunlight.\"},{\"unit\":\"4.1\",\"q\":\"A forest mushroom releases enzymes onto a rotting log and absorbs the products. It is acting primarily as a…\",\"choices\":[\"detritivore\",\"herbivore\",\"decomposer\",\"scavenger\"],\"answer\":2,\"why\":\"Decomposers chemically break down dead organic matter externally.\"},{\"unit\":\"4.1\",\"q\":\"Which statement correctly compares photosynthesis and chemosynthesis?\",\"choices\":[\"Both require sunlight\",\"Both produce energy-rich organic compounds but use different energy sources\",\"Only chemosynthesis can be carried out by autotrophs\",\"Both require eating other organisms\"],\"answer\":1,\"why\":\"Light powers photosynthesis; chemical reactions power chemosynthesis.\"},{\"unit\":\"4.1\",\"q\":\"An earthworm swallows small pieces of decaying leaves. A nearby fungus releases digestive enzymes into the same material. What is the BEST classification?\",\"choices\":[\"Both are scavengers\",\"Worm is decomposer; fungus is detritivore\",\"Worm is detritivore; fungus is decomposer\",\"Both are primary producers\"],\"answer\":2,\"why\":\"Detritivores ingest detritus; decomposers chemically break it down.\"},{\"unit\":\"4.1\",\"q\":\"A raccoon eats berries, small fish, and insect larvae. How is it BEST classified?\",\"choices\":[\"Herbivore\",\"Omnivore\",\"Detritivore\",\"Autotroph\"],\"answer\":1,\"why\":\"An omnivore eats plant and animal material.\"},{\"unit\":\"4.2\",\"q\":\"In a food web, an arrow points from grass to a rabbit. What does that arrow indicate?\",\"choices\":[\"Grass eats the rabbit\",\"Energy moves from the grass to the rabbit\",\"The rabbit gives nutrients to living grass directly\",\"The rabbit is a primary producer\"],\"answer\":1,\"why\":\"Arrows show energy transfer from eaten organism to eater.\"},{\"unit\":\"4.2\",\"q\":\"Use this chain: algae → zooplankton → small fish → heron. Which organism is the SECONDARY consumer?\",\"choices\":[\"Algae\",\"Zooplankton\",\"Small fish\",\"Heron\"],\"answer\":2,\"why\":\"The small fish eats the primary consumer (zooplankton).\"},{\"unit\":\"4.2\",\"q\":\"A marsh loses most of its frogs. Frogs eat insects; snakes eat frogs. Assuming other factors stay the same, which change is MOST likely at first?\",\"choices\":[\"Insects decrease and snakes increase\",\"Insects increase and snakes may decrease\",\"Plants must immediately disappear\",\"Snakes become producers\"],\"answer\":1,\"why\":\"Fewer frogs can mean less predation on insects and less food for snakes.\"},{\"unit\":\"4.2\",\"q\":\"A food chain starts with 50,000 kJ in producers. Using the 10% rule, about how much reaches the SECONDARY consumers?\",\"choices\":[\"50,000 kJ\",\"5,000 kJ\",\"500 kJ\",\"50 kJ\"],\"answer\":2,\"why\":\"50,000 → 5,000 primary → 500 secondary.\"},{\"unit\":\"4.2\",\"q\":\"A single tree supports hundreds of insects. Which ecological pyramid could be inverted in this ecosystem?\",\"choices\":[\"Energy pyramid only\",\"Pyramid of numbers\",\"All energy pyramids\",\"None of the ecological pyramids\"],\"answer\":1,\"why\":\"One producer may support many consumers, inverting a pyramid of numbers.\"},{\"unit\":\"4.2\",\"q\":\"Which statement BEST describes a biomass pyramid?\",\"choices\":[\"It measures only how many organisms live at each level\",\"It shows relative mass of living organic matter at each trophic level\",\"It shows water volume at each trophic level\",\"It is always numerically identical to the energy pyramid\"],\"answer\":1,\"why\":\"Biomass represents living organic matter (often dry mass).\"},{\"unit\":\"4.2\",\"q\":\"Why is less energy available to tertiary consumers than to primary consumers?\",\"choices\":[\"Organisms destroy energy\",\"Most captured energy is used for life processes and much is released as heat\",\"The food web reverses energy flow\",\"Matter cannot move between trophic levels\"],\"answer\":1,\"why\":\"Energy transforms and disperses, including as heat; only a fraction reaches the next level.\"},{\"unit\":\"4.2\",\"q\":\"A lake food web includes algae → insects → fish, and algae → snails → fish. Which claim is supported?\",\"choices\":[\"The lake has two unrelated food chains\",\"Fish get energy only from snails\",\"The food web contains multiple linked food chains\",\"Arrows would point from fish to algae\"],\"answer\":2,\"why\":\"Several interconnected feeding paths make a food web.\"},{\"unit\":\"4.3\",\"q\":\"A drought kills many plants, greatly reducing photosynthesis. What is the most direct expected effect on atmospheric CO₂, all else equal?\",\"choices\":[\"CO₂ removal by photosynthesis decreases\",\"Denitrification automatically stops\",\"All carbon disappears\",\"Photosynthesis releases more CO₂\"],\"answer\":0,\"why\":\"Less photosynthesis means less CO₂ is removed from the atmosphere.\"},{\"unit\":\"4.3\",\"q\":\"Which process turns atmospheric nitrogen gas into forms that can enter biological food webs?\",\"choices\":[\"Denitrification\",\"Nitrogen fixation\",\"Transpiration\",\"Combustion\"],\"answer\":1,\"why\":\"Nitrogen fixation converts N₂ into usable compounds.\"},{\"unit\":\"4.3\",\"q\":\"A soil bacterium converts nitrates into nitrogen gas. Which process is occurring?\",\"choices\":[\"Nitrification\",\"Photosynthesis\",\"Denitrification\",\"Ammonification\"],\"answer\":2,\"why\":\"Denitrification returns nitrogen gas to the atmosphere.\"},{\"unit\":\"4.3\",\"q\":\"Why does the phosphorus cycle differ from the carbon and nitrogen cycles?\",\"choices\":[\"Phosphorus is not used by living organisms\",\"It has no major gaseous atmospheric phase\",\"It cannot be found in water\",\"It is created by producers\"],\"answer\":1,\"why\":\"Phosphates mainly cycle through rocks, water, soil, and organisms.\"},{\"unit\":\"4.3\",\"q\":\"Rain falls on a forest. Some water soaks into soil, enters roots, and later leaves through leaf openings. What process returns this water to the atmosphere?\",\"choices\":[\"Denitrification\",\"Transpiration\",\"Runoff\",\"Condensation\"],\"answer\":1,\"why\":\"Transpiration releases water vapor from plants.\"},{\"unit\":\"7.2\",\"q\":\"After fertilizer runoff enters a pond, algae grow rapidly, then many fish die. What BEST explains the fish deaths?\",\"choices\":[\"Photosynthesis removes all nitrogen\",\"Bacteria decomposing dead algae use up dissolved oxygen\",\"More algae always raise oxygen at every depth\",\"Phosphorus directly turns into toxins\"],\"answer\":1,\"why\":\"Decomposition can deplete dissolved oxygen, causing hypoxia.\"},{\"unit\":\"7.2\",\"q\":\"A predator contains a higher concentration of mercury than the fish it eats. Which term BEST describes increasing concentrations up the food chain?\",\"choices\":[\"Nitrogen fixation\",\"Bioaccumulation\",\"Biomagnification\",\"Transpiration\"],\"answer\":2,\"why\":\"Biomagnification is the increase in pollutant concentrations at higher trophic levels.\"},{\"unit\":\"7.2\",\"q\":\"As extra atmospheric CO₂ dissolves in seawater, which change MOST directly contributes to ocean acidification?\",\"choices\":[\"Hydrogen ion concentration increases\",\"All dissolved gases disappear\",\"Seawater becomes pure freshwater\",\"Nitrogen gas becomes phosphate\"],\"answer\":0,\"why\":\"Dissolved CO₂ forms carbonic acid chemistry that increases H⁺ and reduces pH.\"},{\"unit\":\"4.1\",\"q\":\"At an ocean vent without sunlight, bacteria use energy from hydrogen sulfide to produce sugars. These bacteria are best classified as…\",\"choices\":[\"Photoheterotrophs\",\"Chemosynthetic autotrophs\",\"Carnivores\",\"Scavengers\"],\"answer\":1,\"why\":\"Chemosynthetic autotrophs build organic molecules using inorganic chemical energy.\"},{\"unit\":\"4.1\",\"q\":\"A student says all autotrophs need sunlight. Which observation BEST disproves the claim?\",\"choices\":[\"Trees grow toward light\",\"Mushrooms decompose fallen logs\",\"Bacteria make organic food using vent chemicals in complete darkness\",\"Wolves eat deer\"],\"answer\":2,\"why\":\"Chemosynthesis permits autotrophic production without sunlight.\"},{\"unit\":\"4.1\",\"q\":\"An earthworm eats and physically breaks apart dead leaves. Fungi then chemically break down the remains. Which pairing is correct?\",\"choices\":[\"Worm decomposer; fungi scavenger\",\"Worm detritivore; fungi decomposer\",\"Worm herbivore; fungi producer\",\"Both are autotrophs\"],\"answer\":1,\"why\":\"Detritivores ingest dead matter; decomposers chemically break it into simpler substances.\"},{\"unit\":\"4.1\",\"q\":\"Which pair could BOTH supply producers with energy for building food?\",\"choices\":[\"Sunlight and inorganic chemical reactions\",\"Meat and sunlight\",\"Heat released during breathing and predation\",\"Dead animals and animal waste only\"],\"answer\":0,\"why\":\"Photosynthesis uses light and chemosynthesis uses chemical energy.\"},{\"unit\":\"4.1\",\"q\":\"A raccoon eats berries, beetles, and leftover meat. Which category BEST fits its diet?\",\"choices\":[\"Herbivore\",\"Carnivore\",\"Omnivore\",\"Decomposer\"],\"answer\":2,\"why\":\"Omnivores eat both producers and consumers.\"},{\"unit\":\"4.2\",\"q\":\"In a food web, an arrow runs from grass to mouse. What does that arrow tell you?\",\"choices\":[\"The mouse provides energy to grass\",\"Matter is destroyed in grass\",\"Energy and matter transfer from grass to the mouse\",\"The grass hunts mice\"],\"answer\":2,\"why\":\"Arrows show movement from food toward the organism eating it.\"},{\"unit\":\"4.2\",\"q\":\"A chain is algae → zooplankton → small fish → heron. Which organism occupies the third trophic level?\",\"choices\":[\"Algae\",\"Zooplankton\",\"Small fish\",\"Heron\"],\"answer\":2,\"why\":\"Small fish eat primary consumers, making them secondary consumers at trophic level 3.\"},{\"unit\":\"4.2\",\"q\":\"A grassland has 50,000 kJ stored by producers. About how much energy could reach SECONDARY consumers?\",\"choices\":[\"50,000 kJ\",\"5,000 kJ\",\"500 kJ\",\"50 kJ\"],\"answer\":2,\"why\":\"50,000 × 0.1 × 0.1 = 500 kJ.\"},{\"unit\":\"4.2\",\"q\":\"Which situation could produce an INVERTED pyramid of numbers?\",\"choices\":[\"Thousands of grasses feed one rabbit\",\"One large tree supports hundreds of caterpillars\",\"Energy increases at each trophic level\",\"Plants convert all sunlight to heat\"],\"answer\":1,\"why\":\"One producer (tree) can support many primary consumers (caterpillars).\"},{\"unit\":\"4.2\",\"q\":\"A fox population falls. Rabbits eat the same meadow plants as deer. Which result is most plausible, assuming no other changes?\",\"choices\":[\"Rabbits rise and pressure on meadow plants increases\",\"Rabbit population must fall\",\"All species gain energy\",\"The arrows reverse direction\"],\"answer\":0,\"why\":\"Less fox predation may increase rabbits and herbivory, changing other populations.\"},{\"unit\":\"4.2\",\"q\":\"Why can the energy pyramid never be inverted in a functioning ecosystem?\",\"choices\":[\"Top predators have the most mass\",\"Energy is lost as heat and life processes at each transfer\",\"Matter stops cycling at top consumers\",\"All ecosystems have fewer producers than consumers\"],\"answer\":1,\"why\":\"Useful energy declines between feeding levels.\"},{\"unit\":\"4.2\",\"q\":\"A deer eats only some of a plant and releases waste. What happens to the matter that is NOT built into the deer?\",\"choices\":[\"It vanishes\",\"It may enter waste, detritus, and decomposers\",\"It immediately turns into sunlight\",\"It becomes pure heat only\"],\"answer\":1,\"why\":\"Atoms remain in ecosystems and can move into waste, soil, and decomposer pathways.\"},{\"unit\":\"4.3\",\"q\":\"A forest regrows after logging. All else equal, what direct change would increased photosynthesis cause?\",\"choices\":[\"Increased CO₂ removal from air\",\"Greater nitrogen denitrification automatically\",\"Carbon atoms cease to exist\",\"Reduced organic carbon formation\"],\"answer\":0,\"why\":\"Growing plants incorporate atmospheric CO₂ into sugars and biomass.\"},{\"unit\":\"4.3\",\"q\":\"A farm bacterium converts atmospheric N₂ into ammonia/ammonium-containing compounds. What process is this?\",\"choices\":[\"Nitrification\",\"Nitrogen fixation\",\"Denitrification\",\"Transpiration\"],\"answer\":1,\"why\":\"Nitrogen fixation changes atmospheric N₂ into biologically usable nitrogen forms.\"},{\"unit\":\"4.3\",\"q\":\"A bacterium converts nitrate in wet soil to nitrogen gas. What is the most direct result?\",\"choices\":[\"More nitrogen gas enters the atmosphere\",\"More nitrate is created from ammonium\",\"Phosphorus enters the air as gas\",\"More sunlight is stored\"],\"answer\":0,\"why\":\"Denitrification returns nitrogen from nitrates to gaseous N₂.\"},{\"unit\":\"4.3\",\"q\":\"A researcher tracks phosphorus entering a pond after rocks erode. Which route BEST describes that entry?\",\"choices\":[\"Phosphate from weathered rock enters soil and runoff\",\"Phosphorus gas condenses from clouds\",\"Plants make new phosphorus atoms\",\"Animals convert sunlight into phosphate\"],\"answer\":0,\"why\":\"Rock weathering releases phosphate to soil and water.\"},{\"unit\":\"4.3\",\"q\":\"Which statement about cellular respiration and photosynthesis is most accurate?\",\"choices\":[\"Both destroy carbon atoms\",\"Photosynthesis takes in CO₂; respiration returns CO₂\",\"Respiration is only performed by animals\",\"Photosynthesis creates energy out of nothing\"],\"answer\":1,\"why\":\"They move carbon between inorganic CO₂ and organic molecules.\"},{\"unit\":\"7.2\",\"q\":\"Fertilizer runs into a lake. After an algal bloom dies, oxygen levels plunge. Which process causes the oxygen decrease?\",\"choices\":[\"Decomposers respire while breaking down dead algae\",\"Nitrogen gas permanently disappears\",\"Sunlight stops shining\",\"Fish begin photosynthesis\"],\"answer\":0,\"why\":\"Microbial decomposition consumes dissolved oxygen.\"},{\"unit\":\"7.2\",\"q\":\"An individual fish accumulates mercury during its lifetime. Which term describes this?\",\"choices\":[\"Biomagnification\",\"Bioaccumulation\",\"Nitrogen fixation\",\"Chemosynthesis\"],\"answer\":1,\"why\":\"Bioaccumulation is buildup in one organism over time.\"},{\"unit\":\"7.2\",\"q\":\"Seawater absorbs additional atmospheric CO₂. What chemical shift contributes to acidification?\",\"choices\":[\"Hydrogen ion concentration increases\",\"Hydrogen ions all disappear\",\"Seawater becomes neutral pure water\",\"Nitrogen fixation stops\"],\"answer\":0,\"why\":\"Dissolved carbon dioxide leads to more H⁺, lowering pH.\"},{\"unit\":\"7.2\",\"q\":\"An eagle eats many contaminated fish and has higher pollutant concentrations than those fish. Why?\",\"choices\":[\"Energy is created in the eagle\",\"Pollutants magnify across feeding levels\",\"All pollutants are broken down by the eagle\",\"Producers always contain the most pollutants\"],\"answer\":1,\"why\":\"Persistent pollutants can reach greater concentration at higher trophic levels.\"},{\"unit\":\"4.1\",\"q\":\"A mushroom releases enzymes outside its body to break down a fallen tree and absorbs dissolved nutrients. It is primarily a…\",\"choices\":[\"Detritivore\",\"Decomposer\",\"Primary producer\",\"Carnivore\"],\"answer\":1,\"why\":\"Fungi are decomposers that chemically break down organic matter.\"},{\"unit\":\"4.1\",\"q\":\"An eel eats only smaller fish. Which classification best describes the eel?\",\"choices\":[\"Herbivore\",\"Carnivore\",\"Autotroph\",\"Detritivore\"],\"answer\":1,\"why\":\"Carnivores feed on other animals.\"},{\"unit\":\"4.1\",\"q\":\"A plant and a chemosynthetic microbe share which important role?\",\"choices\":[\"Both consume animals\",\"Both build organic molecules from inorganic carbon\",\"Both rely on sunlight\",\"Both are scavengers\"],\"answer\":1,\"why\":\"Both are producers: one uses light, the other chemical energy.\"},{\"unit\":\"4.1\",\"q\":\"Which observation MOST directly identifies an animal as a scavenger?\",\"choices\":[\"It eats dead animals that it did not kill\",\"It converts sunlight into sugar\",\"It grows underground\",\"It breathes oxygen\"],\"answer\":0,\"why\":\"Scavengers eat carcasses.\"},{\"unit\":\"4.1\",\"q\":\"Why are decomposers essential even in ecosystems with many herbivores?\",\"choices\":[\"They recycle nutrients from organic remains\",\"They create extra solar energy\",\"They prevent cellular respiration\",\"They stop nitrogen from moving\"],\"answer\":0,\"why\":\"Decomposers make nutrients available again.\"},{\"unit\":\"4.2\",\"q\":\"A food web contains grass → cricket → lizard and grass → rabbit → hawk. Which organism is a primary consumer?\",\"choices\":[\"Lizard\",\"Hawk\",\"Rabbit\",\"Grass\"],\"answer\":2,\"why\":\"Rabbits eat producers and are primary consumers.\"},{\"unit\":\"4.2\",\"q\":\"A pond has 70,000 kJ at the producer level. Approximately how much reaches TERTIARY consumers?\",\"choices\":[\"70,000 kJ\",\"7,000 kJ\",\"700 kJ\",\"70 kJ\"],\"answer\":3,\"why\":\"70,000 → 7,000 → 700 → 70 kJ.\"},{\"unit\":\"4.2\",\"q\":\"A producer level supports 2,000 g dry mass of plant material. What does the unit describe in a biomass pyramid?\",\"choices\":[\"Amount of stored organic matter\",\"Number of organisms\",\"Percentage of absorbed sunshine\",\"Energy in kJ\"],\"answer\":0,\"why\":\"Biomass means mass of living organic matter, often dry mass.\"},{\"unit\":\"4.2\",\"q\":\"A seabird eats fish and squid, both of which eat smaller animals. Which model best shows several interconnected paths?\",\"choices\":[\"Single straight food chain\",\"Food web\",\"Water cycle\",\"Pyramid of numbers only\"],\"answer\":1,\"why\":\"Food webs combine multiple feeding pathways.\"},{\"unit\":\"4.2\",\"q\":\"A student says energy cycles because decomposers return nutrients to plants. Which correction is BEST?\",\"choices\":[\"Both energy and nutrients are destroyed\",\"Matter can be recycled, but energy flows and eventually disperses as heat\",\"Energy only travels from animals to plants\",\"Decomposers make new sunlight\"],\"answer\":1,\"why\":\"Matter cycles; energy is continually supplied and transformed and eventually dissipated.\"},{\"unit\":\"4.2\",\"q\":\"If all hawks are removed, which result is possible in the short term?\",\"choices\":[\"Prey populations increase\",\"Energy transfers become 100% efficient\",\"Producers become tertiary consumers\",\"Arrows point toward prey\"],\"answer\":0,\"why\":\"Predator removal can release prey from predation.\"},{\"unit\":\"4.2\",\"q\":\"Which pyramid can sometimes be upside down while the energy pyramid stays upright?\",\"choices\":[\"Pyramid of numbers\",\"Energy pyramid\",\"Neither numbers nor biomass\",\"All ecosystems lack pyramids\"],\"answer\":0,\"why\":\"Pyramids of numbers (and sometimes biomass) can be inverted.\"},{\"unit\":\"4.3\",\"q\":\"If cellular respiration increases while photosynthesis stays constant, what tends to happen to atmospheric CO₂?\",\"choices\":[\"It rises\",\"It must fall\",\"It vanishes\",\"It changes directly into nitrogen gas\"],\"answer\":0,\"why\":\"Cellular respiration releases CO₂.\"},{\"unit\":\"4.3\",\"q\":\"Which nitrogen-cycle process converts ammonium into nitrites and nitrates?\",\"choices\":[\"Nitrification\",\"Denitrification\",\"Nitrogen fixation\",\"Decomposition of phosphate\"],\"answer\":0,\"why\":\"Nitrifying bacteria oxidize ammonium to nitrites/nitrates.\"},{\"unit\":\"4.3\",\"q\":\"What is the most important difference between phosphorus cycling and nitrogen cycling?\",\"choices\":[\"Phosphorus lacks a significant atmospheric gas phase\",\"Phosphorus is not in DNA\",\"Nitrogen does not exist in air\",\"Phosphorus cannot dissolve in water\"],\"answer\":0,\"why\":\"Phosphorus principally moves among rock, soil, water and living things.\"},{\"unit\":\"4.3\",\"q\":\"Water evaporates from soil, condenses into clouds, and falls as rain. Which statement is correct?\",\"choices\":[\"Matter is recycled through physical changes\",\"The water molecules are destroyed\",\"Energy cannot affect the water cycle\",\"Rain makes new hydrogen atoms\"],\"answer\":0,\"why\":\"Water changes location and state, but its matter is conserved.\"},{\"unit\":\"4.3\",\"q\":\"Why is carbon transferred from a berry bush to a bird when the bird eats berries?\",\"choices\":[\"Organic carbon moves through consumption\",\"Carbon is created during digestion\",\"The bird becomes an autotroph\",\"CO₂ moves only through denitrification\"],\"answer\":0,\"why\":\"Carbon in organic molecules enters the consumer when it eats the producer.\"},{\"unit\":\"7.2\",\"q\":\"Fertilizer runoff causes rapid algae growth in a river. Which outcome is MOST likely after a large bloom dies?\",\"choices\":[\"Decreased dissolved oxygen from decomposition\",\"Permanent oxygen increases at every depth\",\"Phosphorus becomes sunlight\",\"All fish gain more oxygen\"],\"answer\":0,\"why\":\"Decomposers respiring over dead algae can deplete dissolved oxygen.\"},{\"unit\":\"7.2\",\"q\":\"Why might top predators have higher DDT concentrations than organisms lower in a food web?\",\"choices\":[\"They ingest pollutants from many prey items\",\"They are always older than producers\",\"They make DDT in their cells\",\"Their food webs reverse energy flow\"],\"answer\":0,\"why\":\"Persistent substances can magnify through repeated consumption.\"},{\"unit\":\"7.2\",\"q\":\"Ocean acidity increases as more CO₂ dissolves. Which marine organisms could be especially affected?\",\"choices\":[\"Organisms that build calcium-carbonate shells and skeletons\",\"All microbes become producers\",\"Only land mammals\",\"Organisms never exposed to seawater\"],\"answer\":0,\"why\":\"Lower carbonate availability and pH can interfere with shell/skeleton formation.\"},{\"unit\":\"7.2\",\"q\":\"Which human action directly increases nitrogen and phosphorus input into waterways?\",\"choices\":[\"Excess fertilizer runoff\",\"Plant transpiration\",\"Herbivory\",\"Nitrogen fixation in undisturbed soils\"],\"answer\":0,\"why\":\"Fertilizer runoff transports nutrients into aquatic ecosystems.\"},{\"unit\":\"4.1\",\"q\":\"Vultures feed on already-dead animals. They are primarily…\",\"choices\":[\"Decomposers\",\"Scavengers\",\"Autotrophs\",\"Herbivores\"],\"answer\":1,\"why\":\"Scavengers feed on carcasses.\"},{\"unit\":\"4.1\",\"q\":\"Which organism is the BEST example of an autotroph?\",\"choices\":[\"Seaweed\",\"Wolf\",\"Earthworm\",\"Fungus\"],\"answer\":0,\"why\":\"Seaweed captures light to produce organic matter.\"},{\"unit\":\"4.1\",\"q\":\"Which process is used by both autotrophs and heterotrophs to release energy from food molecules?\",\"choices\":[\"Chemosynthesis\",\"Nitrogen fixation\",\"Cellular respiration\",\"Condensation\"],\"answer\":2,\"why\":\"Both groups perform cellular respiration.\"},{\"unit\":\"4.2\",\"q\":\"If a food chain has 8,000 J at producers, about how much reaches tertiary consumers?\",\"choices\":[\"8 J\",\"80 J\",\"800 J\",\"8,000 J\"],\"answer\":0,\"why\":\"8,000 → 800 → 80 → 8 J.\"},{\"unit\":\"4.2\",\"q\":\"Why might removing a keystone predator cause large changes?\",\"choices\":[\"It is always the largest species\",\"Its ecological influence extends to many populations\",\"It stores all nutrients\",\"It prevents sunlight entering the ecosystem\"],\"answer\":1,\"why\":\"A keystone species has disproportionately large effects.\"},{\"unit\":\"4.2\",\"q\":\"A food web is more informative than one food chain because…\",\"choices\":[\"it includes several interacting feeding paths\",\"it proves energy cycles\",\"it never changes\",\"it contains only top predators\"],\"answer\":0,\"why\":\"Webs connect many food chains.\"},{\"unit\":\"4.2\",\"q\":\"Which ecological pyramid must remain upright?\",\"choices\":[\"Numbers\",\"Biomass\",\"Energy\",\"All three\"],\"answer\":2,\"why\":\"Energy declines as it is transferred up trophic levels.\"},{\"unit\":\"4.3\",\"q\":\"Which pair of processes moves carbon in opposite directions between organisms and air?\",\"choices\":[\"Photosynthesis and cellular respiration\",\"Nitrification and transpiration\",\"Runoff and erosion\",\"Nitrogen fixation and denitrification\"],\"answer\":0,\"why\":\"Photosynthesis absorbs CO₂; respiration releases CO₂.\"},{\"unit\":\"4.3\",\"q\":\"Which process forms clouds from water vapor?\",\"choices\":[\"Transpiration\",\"Condensation\",\"Runoff\",\"Percolation\"],\"answer\":1,\"why\":\"Condensation creates liquid droplets.\"},{\"unit\":\"4.3\",\"q\":\"Dead organisms and waste release ammonium into soil through…\",\"choices\":[\"Ammonification\",\"Photosynthesis\",\"Denitrification\",\"Chemosynthesis\"],\"answer\":0,\"why\":\"Ammonification converts organic nitrogen to ammonium.\"},{\"unit\":\"4.3\",\"q\":\"Bacteria convert ammonium into nitrites and nitrates. This is…\",\"choices\":[\"Fixation\",\"Nitrification\",\"Respiration\",\"Biomagnification\"],\"answer\":1,\"why\":\"Nitrification makes nitrites/nitrates.\"},{\"unit\":\"4.3\",\"q\":\"An ecosystem has sunlight and water, but algae grow poorly because phosphorus is scarce. Phosphorus is the…\",\"choices\":[\"Producer\",\"Limiting nutrient\",\"Primary consumer\",\"Gaseous reservoir\"],\"answer\":1,\"why\":\"The scarcest essential resource can limit growth.\"},{\"unit\":\"7.2\",\"q\":\"A fish slowly accumulates a persistent chemical in its tissues over its lifetime. This is…\",\"choices\":[\"Biomagnification\",\"Eutrophication\",\"Bioaccumulation\",\"Denitrification\"],\"answer\":2,\"why\":\"Bioaccumulation happens within one organism over time.\"},{\"unit\":\"7.2\",\"q\":\"Which action most directly increases nutrient runoff into lakes?\",\"choices\":[\"Reducing fertilizer near streams\",\"Planting riparian buffers\",\"Applying too much fertilizer before rain\",\"Removing wastewater nutrients\"],\"answer\":2,\"why\":\"Rain can carry excess fertilizer into waterways.\"},{\"unit\":\"7.2\",\"q\":\"Which change most directly raises atmospheric CO₂?\",\"choices\":[\"Fossil fuel combustion\",\"Reforestation\",\"Increased photosynthesis\",\"Phosphate weathering\"],\"answer\":0,\"why\":\"Burning fossil fuels releases stored carbon as CO₂.\"},{\"unit\":\"4.1\",\"q\":\"A student places algae in bright light, then in darkness. Which result best supports that photosynthesis stores light energy as chemical energy?\",\"choices\":[\"Sugar production is higher in light\",\"Algae stop performing respiration in darkness\",\"Algae become scavengers in darkness\",\"Algae consume other animals in light\"],\"answer\":0,\"why\":\"Photosynthesis requires light energy to build sugar; algae still respire in light and dark.\"},{\"unit\":\"4.1\",\"q\":\"An organism lives in a dark cave and uses energy from sulfur compounds to make organic molecules. What role could it occupy in a cave food web?\",\"choices\":[\"Primary producer\",\"Secondary consumer\",\"Scavenger only\",\"Detritivore only\"],\"answer\":0,\"why\":\"Chemosynthesis allows producers to support food webs without sunlight.\"},{\"unit\":\"4.1\",\"q\":\"In a forest, which action directly returns inorganic nutrients from dead wood to the soil?\",\"choices\":[\"A fungus secretes digestive enzymes\",\"A hawk eats a mouse\",\"A deer eats a leaf\",\"A tree absorbs sunlight\"],\"answer\":0,\"why\":\"Decomposers chemically release nutrients from dead organic matter.\"},{\"unit\":\"4.1\",\"q\":\"Two organisms both eat a dead deer. A vulture consumes meat; maggots feed on pieces of decomposing flesh. Which interpretation is best?\",\"choices\":[\"Both are producers\",\"The vulture is a scavenger; maggots consume detrital material\",\"Both perform photosynthesis\",\"The maggots are chemosynthetic\"],\"answer\":1,\"why\":\"Scavengers eat carcasses; detritivores eat fragments of dead organic material.\"},{\"unit\":\"4.1\",\"q\":\"A grassland loses its producers after a drought. Why would consumers eventually decline even if predators stop hunting?\",\"choices\":[\"The original source of chemical energy to the food web declines\",\"Energy is recycled by consumers\",\"Predators become autotrophs\",\"Nutrients cannot move through soil\"],\"answer\":0,\"why\":\"Most food webs depend on producers to convert external energy into food.\"},{\"unit\":\"4.1\",\"q\":\"A mushroom and an earthworm are found in leaf litter. What is the key difference in their feeding methods?\",\"choices\":[\"Fungus chemically digests externally; earthworm ingests fragments\",\"Earthworm fixes carbon; fungus makes oxygen\",\"Both eat living rabbits\",\"Fungus uses sunlight; earthworm uses chemicals\"],\"answer\":0,\"why\":\"External digestion by decomposers differs from physical ingestion by detritivores.\"},{\"unit\":\"4.2\",\"q\":\"A food web shows grass → cricket → lizard → hawk. If lizards sharply decline, what could happen initially?\",\"choices\":[\"Crickets increase and hawks lose a prey source\",\"Crickets decrease and hawks increase\",\"Grass must increase\",\"All organisms remain unchanged\"],\"answer\":0,\"why\":\"Fewer lizards mean reduced predation on crickets and less food for hawks.\"},{\"unit\":\"4.2\",\"q\":\"A pyramid of numbers has one large tree supporting 500 caterpillars. Why might its base appear narrower than the level above?\",\"choices\":[\"It counts organisms, not total energy\",\"Energy is created by caterpillars\",\"There are no producers\",\"Biomass and numbers always match\"],\"answer\":0,\"why\":\"A single large producer can support many consumers, causing an inverted numbers pyramid.\"},{\"unit\":\"4.2\",\"q\":\"If plants contain 90,000 kJ of energy, about how much is available at the tertiary-consumer level using the 10% rule?\",\"choices\":[\"90 kJ\",\"900 kJ\",\"9,000 kJ\",\"9 kJ\"],\"answer\":0,\"why\":\"Three transfers produce approximately 90,000 → 9,000 → 900 → 90 kJ.\"},{\"unit\":\"4.2\",\"q\":\"Why does an energy pyramid remain upright even when some biomass pyramids do not?\",\"choices\":[\"Energy decreases with each transfer\",\"Organisms at higher levels create sunlight\",\"Matter cannot be conserved\",\"Every organism has the same biomass\"],\"answer\":0,\"why\":\"Energy is lost from usable transfer at each trophic step.\"},{\"unit\":\"4.2\",\"q\":\"In a chain of plankton → shrimp → fish → seal, which pair represents primary and tertiary consumers?\",\"choices\":[\"Shrimp and seal\",\"Fish and shrimp\",\"Plankton and fish\",\"Seal and plankton\"],\"answer\":0,\"why\":\"Shrimp eat producers and seals eat secondary consumers.\"},{\"unit\":\"4.2\",\"q\":\"A fox eats both berries and rabbits. In two separate food chains, how might its trophic level change?\",\"choices\":[\"It can act as a primary or secondary consumer\",\"It is always level one\",\"It is always a decomposer\",\"It cannot belong to two chains\"],\"answer\":0,\"why\":\"Trophic levels depend on what the animal eats in a particular chain.\"},{\"unit\":\"4.3\",\"q\":\"After a heavy rain, water seeps below the soil surface into groundwater. Which water-cycle process explains this?\",\"choices\":[\"Percolation\",\"Condensation\",\"Transpiration\",\"Precipitation\"],\"answer\":0,\"why\":\"Percolation is downward movement of water through soil.\"},{\"unit\":\"4.3\",\"q\":\"A drought causes stomata on leaves to close. Which water-cycle flux would decrease most directly?\",\"choices\":[\"Transpiration\",\"Ocean evaporation\",\"Atmospheric precipitation\",\"Runoff from pavement\"],\"answer\":0,\"why\":\"Closed stomata limit water vapor leaving plant leaves.\"},{\"unit\":\"4.3\",\"q\":\"A forest stores carbon in wood for decades. If it burns, what happens to much of that stored carbon?\",\"choices\":[\"It is released to the atmosphere as CO₂\",\"It becomes atmospheric nitrogen\",\"It disappears from the carbon cycle\",\"It is converted directly to phosphate\"],\"answer\":0,\"why\":\"Combustion converts stored organic carbon into atmospheric carbon dioxide.\"},{\"unit\":\"4.3\",\"q\":\"Why is atmospheric N₂ not directly useful to most plants despite being abundant?\",\"choices\":[\"It first needs conversion into biologically usable nitrogen compounds\",\"It must become oxygen gas\",\"Plants cannot contain nitrogen\",\"It needs to become phosphorus\"],\"answer\":0,\"why\":\"Nitrogen fixation converts N₂ into forms that can enter biological nitrogen cycling.\"},{\"unit\":\"4.3\",\"q\":\"Soil microbes convert ammonium first to nitrite and then nitrate. What process is this?\",\"choices\":[\"Nitrification\",\"Denitrification\",\"Transpiration\",\"Photosynthesis\"],\"answer\":0,\"why\":\"Nitrifying bacteria oxidize ammonium to nitrate in two steps.\"},{\"unit\":\"4.3\",\"q\":\"After dead leaves decompose, organic nitrogen is converted to ammonium. Name the process.\",\"choices\":[\"Ammonification\",\"Nitrogen fixation\",\"Denitrification\",\"Condensation\"],\"answer\":0,\"why\":\"Ammonification converts organic nitrogen into ammonium.\"},{\"unit\":\"4.3\",\"q\":\"What would most directly reduce the supply of phosphate released from bedrock?\",\"choices\":[\"Slower weathering of phosphorus-containing rocks\",\"Greater atmospheric nitrogen\",\"More ocean evaporation\",\"More sunlight on leaves\"],\"answer\":0,\"why\":\"Weathering provides phosphorus from rocks because phosphorus has no major gas phase.\"},{\"unit\":\"4.3\",\"q\":\"Which comparison correctly identifies a carbon sink and a carbon source?\",\"choices\":[\"Growing forest is a sink; burning fossil fuels is a source\",\"Wildfire is a sink; growing trees are a source\",\"Both are only sinks\",\"Both are only sources\"],\"answer\":0,\"why\":\"A sink absorbs or stores carbon; a source releases carbon.\"},{\"unit\":\"7.2\",\"q\":\"A lake receives excess fertilizer; algae bloom and later die. What most directly causes fish suffocation?\",\"choices\":[\"Bacteria decomposing algae use dissolved oxygen\",\"More oxygen is created by bacterial respiration\",\"Phosphorus turns into CO₂\",\"Fish become primary producers\"],\"answer\":0,\"why\":\"Decomposition consumes dissolved oxygen, creating hypoxic conditions.\"},{\"unit\":\"7.2\",\"q\":\"Two fish of the same species differ in age. The older fish contains more mercury after long exposure. Which process is illustrated?\",\"choices\":[\"Bioaccumulation\",\"Biomagnification across trophic levels\",\"Nitrogen fixation\",\"Chemosynthesis\"],\"answer\":0,\"why\":\"Bioaccumulation occurs within an organism over time.\"},{\"unit\":\"7.2\",\"q\":\"A top predator has more PCB contamination than the small fish it eats. Which process explains the pattern?\",\"choices\":[\"Biomagnification\",\"Condensation\",\ :15px}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:25px;background:white;padding:28px;position:relative}.close{position:absolute;right:18px;top:15px;background:none;border:0;font-size:25px}.toast{position:fixed;bottom:20px;right:20px;background:var(--dark);color:white;border-radius:12px;padding:15px 20px;z-index:50}.fine{font-size:12px;color:var(--muted)}.hidden{display:none!important}@media(max-width:850px){.hero-grid,.layout{grid-template-columns:1fr}.hero-art{min-height:350px}.float{left:15px}.grid,.grid.four,.opgrid{grid-template-columns:repeat(2,1fr)}.links{gap:6px}.links button{font-size:11px}.side{flex-direction:row;flex-wrap:wrap}.side button{font-size:12px}.hero{padding:60px 0}}@media(max-width:560px){.grid,.grid.four,.opgrid,.form,.kpis{grid-template-columns:1fr}.links button:nth-child(2),.links button:nth-child(3){display:none}.hero h1{font-size:3.5rem}.container{width:calc(100% - 28px)}.hero-art{min-height:280px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv id=\"app\">\u003c/div>\u003cdiv id=\"dialog\">\u003c/div>\u003cdiv id=\"notifications\">\u003c/div>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js\">\u003c/script>\n\u003cscript>\n\"use strict\";\nconst CONFIG={url:\"\",anonKey:\"\"}; // Paste your Supabase project URL and PUBLISHABLE/anon key here after running schema.sql. NEVER use service_role or secret keys.\nconst live=Boolean(CONFIG.url&&CONFIG.anonKey&&window.supabase);\nconst db=live?window.supabase.createClient(CONFIG.url,CONFIG.anonKey):null;\nlet user=null,profile=null,view=\"home\",items=[],orgs=[],applications=[],sessions=[],saved=[],category=\"All\",search=\"\",tab=\"volunteer\",loading=false;\nconst E=s=>String(s??\"\").replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst $=s=>document.querySelector(s);\nfunction notify(msg){$(\"#notifications\").innerHTML='\u003cdiv class=\"toast\">'+E(msg)+'\u003c/div>';setTimeout(()=>$(\"#notifications\").innerHTML=\"\",3800)}\nfunction nav(to){view=to;render();scrollTo(0,0);if(live&&user)loadData()}\nfunction guard(){if(!live){notify(\"Live backend not configured yet. See README.\");return false}if(!user){openAuth();return false}return true}\nconst CATS=[[\"🌱\",\"Environment\"],[\"📚\",\"Education\"],[\"🐾\",\"Animals\"],[\"🩺\",\"Healthcare\"],[\"🤝\",\"Community\"],[\"🍽️\",\"Food Security\"]];\nfunction header(){return '\u003cdiv class=\"bar\">A better way to give back, together.\u003c/div>\u003cdiv class=\"nav\">\u003cdiv class=\"container navin\">\u003ca class=\"logo\" href=\"#\" onclick=\"nav(\\'home\\');return false\">✳ kindred\u003cem>.\u003c/em>\u003c/a>\u003cdiv class=\"links\">\u003cbutton onclick=\"nav(\\'discover\\')\">Explore\u003c/button>\u003cbutton onclick=\"nav(\\'dashboard\\')\">Dashboard\u003c/button>\u003cbutton onclick=\"nav(\\'organizations\\')\">Organizations\u003c/button>\u003c/div>\u003cbutton class=\"btn small\" onclick=\"'+(user?\"signout()\":\"openAuth()\")+'\">'+(user?\"Sign out\":\"Sign in / Join\")+'\u003c/button>\u003c/div>\u003c/div>'}\nfunction home(){return '\u003cdiv class=\"hero\">\u003cdiv class=\"container hero-grid\">\u003cdiv>\u003cspan class=\"pill\">✳ Good things happen when we show up\u003c/span>\u003ch1>Make your \u003cspan>time matter.\u003c/span>\u003c/h1>\u003cp class=\"lead\">Discover meaningful volunteer opportunities that fit your interests, schedule and goals. Spend less time searching and more time making a difference.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" onclick=\"nav(\\'discover\\')\">Find your perfect opportunity ↗\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"nav(\\'organizations\\')\">For organizations\u003c/button>\u003c/div>\u003cp class=\"fine\">Discover causes. Connect with people. Keep track of your impact.\u003c/p>\u003c/div>\u003cdiv class=\"hero-art\">\u003cdiv class=\"float\">\u003cstrong>🌿 Find your people. Find your purpose.\u003c/strong>\u003csmall>Volunteering, made simple.\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003csection class=\"muted-section\">\u003cdiv class=\"container\">\u003cdiv class=\"sectionhead\">\u003cspan class=\"eyebrow\">How Kindred works\u003c/span>\u003ch2>Four steps to a little more good.\u003c/h2>\u003c/div>\u003cdiv class=\"grid four\">'+[[\"01\",\"🔎\",\"Discover\",\"Explore causes that fit your interests and schedule.\"],[\"02\",\"💌\",\"Connect\",\"Apply to opportunities with community organizations.\"],[\"03\",\"🤝\",\"Volunteer\",\"Give your time to the causes that matter.\"],[\"04\",\"📈\",\"Track\",\"Record hours and celebrate verified milestones.\"]].map(x=>'\u003cdiv class=\"card\">\u003cspan class=\"stepnumber\">'+x[0]+'\u003c/span>\u003cdiv class=\"emoji\">'+x[1]+'\u003c/div>\u003ch3>'+x[2]+'\u003c/h3>\u003cp>'+x[3]+'\u003c/p>\u003c/div>').join(\"\")+'\u003c/div>\u003c/div>\u003c/section>\u003csection>\u003cdiv class=\"container\">\u003cdiv class=\"sectionhead\">\u003cspan class=\"eyebrow\">Your cause is out there\u003c/span>\u003ch2>Something meaningful for everyone.\u003c/h2>\u003c/div>\u003cdiv class=\"grid\">'+CATS.map(x=>'\u003cbutton class=\"card category\" onclick=\"category=\\''+x[1]+'\\';nav(\\'discover\\')\">'+x[0]+' '+x[1]+' \u003cspan>↗\u003c/span>\u003c/button>').join(\"\")+'\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"muted-section\">\u003cdiv class=\"container\">\u003cdiv class=\"sectionhead\">\u003cspan class=\"eyebrow\">Built for real impact\u003c/span>\u003ch2>Good for volunteers. Great for communities.\u003c/h2>\u003cp>One place for personalized discovery, applications, verified service hours, and nonprofit opportunity management.\u003c/p>\u003c/div>\u003cbutton class=\"btn\" onclick=\"nav(\\'discover\\')\">Explore opportunities →\u003c/button>\u003c/div>\u003c/section>'}\nfunction shell(inner){return '\u003cdiv class=\"app\">\u003cdiv class=\"container layout\">\u003cdiv class=\"side\">'+[[\"dashboard\",\"⌂ Dashboard\"],[\"discover\",\"⌕ Discover\"],[\"saved\",\"♡ Saved\"],[\"applications\",\"▤ Applications\"],[\"hours\",\"◷ Hours\"],[\"organizations\",\"♧ Organizations\"],[\"profile\",\"⚙ Profile\"]].map(x=>'\u003cbutton class=\"'+(view===x[0]?\"active\":\"\")+'\" onclick=\"nav(\\''+x[0]+'\\')\">'+x[1]+'\u003c/button>').join(\"\")+'\u003c/div>\u003cdiv>'+inner+'\u003c/div>\u003c/div>\u003c/div>'}\nfunction warning(){return !live?'\u003cdiv class=\"notice\">⚙ Live service is not connected yet. This site is published as a frontend. To activate shared accounts and data, configure Supabase using README.md and schema.sql. No sample opportunities are presented as real.\u003c/div>':\"\"}\nfunction eligible(o){return !profile?.age||profile.age>=o.min_age}\nfunction match(o){if(!profile||!eligible(o))return null;const a=profile;let n=0;n+=a.interests?.includes(o.category)?30:0;n+=a.availability?.includes(o.schedule)?25:0;n+=o.distance_miles!==null&&a.max_distance!==null&&o.distance_miles\u003c=a.max_distance?20:0;n+=a.commitment===o.commitment?10:0;n+=a.activities?.includes(o.activity)?15:0;return n}\nfunction opportunity(o){const s=match(o),isSaved=saved.some(x=>x.opportunity_id===o.id);return '\u003cdiv class=\"card op\">\u003cdiv class=\"op-art\">'+({Environment:\"🌱\",Education:\"📚\",Animals:\"🐾\",Healthcare:\"🩺\",Community:\"🤝\",\"Food Security\":\"🍽️\"}[o.category]||\"🤲\")+'\u003c/div>\u003cdiv class=\"op-body\">\u003cspan class=\"tag\">'+E(o.category)+'\u003c/span>'+(s!==null?'\u003cspan class=\"tag\">'+s+'% match\u003c/span>':\"\")+'\u003ch3>'+E(o.title)+'\u003c/h3>\u003cp>'+E(o.organizations?.name||\"Community organization\")+'\u003c/p>\u003cp>'+E(o.description)+'\u003c/p>\u003cdiv class=\"meta\">📍 '+E(o.city)+' · Ages '+o.min_age+'+\u003cbr>📅 '+E(o.schedule)+' · '+E(o.commitment)+' · '+o.estimated_hours+' hours\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn small\" onclick=\"apply(\\''+o.id+'\\')\">Apply ↗\u003c/button>\u003cbutton class=\"btn small alt\" onclick=\"toggleSaved(\\''+o.id+'\\')\">'+(isSaved?\"♥ Saved\":\"♡ Save\")+'\u003c/button>\u003c/div>\u003c/div>\u003c/div>'}\nfunction discover(){let visible=items.filter(o=>eligible(o)&&(!search||(o.title+\" \"+o.description+\" \"+o.city+\" \"+o.organizations?.name).toLowerCase().includes(search.toLowerCase()))&&(category===\"All\"||o.category===category)).sort((a,b)=>(match(b)??-1)-(match(a)??-1));return shell('\u003cdiv class=\"sectionhead\">\u003cspan class=\"eyebrow\">Discover\u003c/span>\u003ch2>Find your next opportunity.\u003c/h2>\u003cp>Browse real listings posted by participating organizations.\u003c/p>\u003c/div>'+warning()+'\u003cdiv class=\"toolbar\">\u003cinput class=\"field\" placeholder=\"Search causes, cities, organizations...\" value=\"'+E(search)+'\" oninput=\"search=this.value;refreshList()\">\u003cselect class=\"field\" onchange=\"category=this.value;refreshList()\">'+[\"All\",...CATS.map(x=>x[1])].map(c=>'\u003coption '+(category===c?\"selected\":\"\")+'>'+c+'\u003c/option>').join(\"\")+'\u003c/select>\u003c/div>\u003cdiv id=\"results\">\u003cdiv class=\"opgrid\">'+visible.map(opportunity).join(\"\")+'\u003c/div>'+(visible.length?\"\":'\u003cdiv class=\"empty\">No eligible listings match these filters yet. Try another category or check back later.\u003c/div>')+'\u003c/div>')}\nfunction refreshList(){let d=discover();$(\"#app\").innerHTML=header()+d+footer()}\nfunction dashboard(){let verified=sessions.filter(x=>x.status===\"verified\"),pending=applications.filter(x=>x.status===\"pending\"),hours=verified.reduce((n,x)=>n+Number(x.hours),0),monthly=verified.filter(x=>new Date(x.date).getMonth()===new Date().getMonth()).reduce((n,x)=>n+Number(x.hours),0);return shell('\u003cdiv class=\"sectionhead\">\u003cspan class=\"eyebrow\">Your space\u003c/span>\u003ch2>Welcome'+(profile?.full_name?\", \"+E(profile.full_name.split(\" \")[0]):\"\")+\" ✨\u003c/h2>\u003cp>A little progress makes a big difference.\u003c/p>\u003c/div>'+warning()+(!user?'\u003cdiv class=\"notice\">Sign in to access your personal dashboard.\u003c/div>\u003cbutton class=\"btn\" onclick=\"openAuth()\">Sign in / Join\u003c/button>':'\u003cdiv class=\"kpis\">\u003cdiv class=\"kpi\">\u003csmall>✓ Verified hours\u003c/small>\u003cstrong>'+hours.toFixed(1)+'\u003c/strong>\u003c/div>\u003cdiv class=\"kpi\">\u003csmall>↗ This month\u003c/small>\u003cstrong>'+monthly.toFixed(1)+'\u003c/strong>\u003c/div>\u003cdiv class=\"kpi\">\u003csmall>⌛ Pending applications\u003c/small>\u003cstrong>'+pending.length+'\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003ch3>Recommendations for you\u003c/h3>\u003cdiv class=\"opgrid\">'+items.filter(eligible).sort((a,b)=>(match(b)??-1)-(match(a)??-1)).slice(0,3).map(opportunity).join(\"\")+'\u003c/div>'+(!items.length?'\u003cdiv class=\"empty\">Organizations have not posted any opportunities yet.\u003c/div>':\"\")+'\u003c/div>'))}\nfunction savedPage(){let ids=new Set(saved.map(x=>x.opportunity_id));return shell('\u003cdiv class=\"sectionhead\">\u003ch2>Saved opportunities\u003c/h2>\u003c/div>'+warning()+'\u003cdiv class=\"opgrid\">'+items.filter(x=>ids.has(x.id)).map(opportunity).join(\"\")+'\u003c/div>'+(!saved.length?'\u003cdiv class=\"empty\">Your saved list is empty.\u003c/div>':\"\"))}\nfunction applicationsPage(){return shell('\u003ch2>My applications\u003c/h2>'+warning()+'\u003cdiv class=\"list\">'+applications.map(a=>'\u003cdiv class=\"listrow\">\u003cdiv>\u003cstrong>'+E(a.opportunities?.title||\"Opportunity\")+'\u003c/strong>\u003cp>Submitted '+E(a.created_at?.slice(0,10))+'\u003c/p>\u003c/div>\u003cspan class=\"badge\">'+E(a.status)+'\u003c/span>\u003c/div>').join(\"\")+'\u003c/div>'+(!applications.length?'\u003cdiv class=\"empty\">You have not applied to any opportunities.\u003c/div>':\"\"))}\nfunction hoursPage(){let total=sessions.filter(x=>x.status===\"verified\").reduce((s,x)=>s+Number(x.hours),0);return shell('\u003cdiv class=\"sectionhead\">\u003ch2>Community service hours\u003c/h2>\u003cp>Track your contribution with verified and unverified hours clearly separated.\u003c/p>\u003c/div>'+warning()+'\u003cdiv class=\"kpis\">\u003cdiv class=\"kpi\">\u003csmall>Verified hours\u003c/small>\u003cstrong>'+total.toFixed(1)+'\u003c/strong>\u003c/div>\u003cdiv class=\"kpi\">\u003csmall>Awaiting verification\u003c/small>\u003cstrong>'+sessions.filter(x=>x.status===\"pending\").reduce((s,x)=>s+Number(x.hours),0).toFixed(1)+'\u003c/strong>\u003c/div>\u003cdiv class=\"kpi\">\u003csmall>Sessions\u003c/small>\u003cstrong>'+sessions.length+'\u003c/strong>\u003c/div>\u003c/div>\u003cbutton class=\"btn\" onclick=\"openHours()\">+ Log a session\u003c/button>\u003cdiv class=\"list\" style=\"margin-top:18px\">'+sessions.map(s=>'\u003cdiv class=\"listrow\">\u003cdiv>\u003cstrong>'+E(s.organizations?.name||\"Organization\")+'\u003c/strong>\u003cp>'+E(s.date)+' · '+s.hours+' hours · '+E(s.notes)+'\u003c/p>\u003c/div>\u003cspan class=\"badge\">'+E(s.status)+'\u003c/span>\u003c/div>').join(\"\")+'\u003c/div>'+(!sessions.length?'\u003cdiv class=\"empty\">No volunteer sessions logged yet.\u003c/div>':\"\"))}\nfunction organizationsPage(){let mine=orgs.filter(x=>x.owner_id===user?.id);return shell('\u003cdiv class=\"sectionhead\">\u003cspan class=\"eyebrow\">For organizations\u003c/span>\u003ch2>Bring great people to your cause.\u003c/h2>\u003cp>Post real volunteering opportunities and review applications from interested volunteers.\u003c/p>\u003c/div>'+warning()+'\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" onclick=\"openOrg()\">+ Register organization\u003c/button>\u003cbutton class=\"btn alt\" onclick=\"openOpportunity()\">+ Post opportunity\u003c/button>\u003c/div>\u003cdiv class=\"list\">'+mine.map(o=>'\u003cdiv class=\"card\">\u003ch3>'+E(o.name)+' \u003cspan class=\"badge\">'+(o.verified?\"Verified\":\"Not verified\")+'\u003c/span>\u003c/h3>\u003cp>'+E(o.description)+'\u003c/p>\u003cp class=\"fine\">'+E(o.city)+'\u003c/p>\u003cbutton class=\"btn small alt\" onclick=\"manageOrg(\\''+o.id+'\\')\">Manage applications →\u003c/button>\u003c/div>').join(\"\")+'\u003c/div>'+(!mine.length?'\u003cdiv class=\"empty\">Create your organization profile to start posting opportunities.\u003c/div>':\"\"))}\nfunction profilePage(){return shell('\u003cdiv class=\"sectionhead\">\u003ch2>My volunteering profile\u003c/h2>\u003cp>Improve recommendations by sharing your interests and availability.\u003c/p>\u003c/div>'+warning()+(!user?'\u003cbutton class=\"btn\" onclick=\"openAuth()\">Sign in to set up profile\u003c/button>':'\u003cdiv class=\"panel\">\u003cform class=\"form\" onsubmit=\"saveProfile(event)\">\u003cdiv>\u003clabel>Name\u003c/label>\u003cinput required name=\"full_name\" class=\"field\" value=\"'+E(profile?.full_name||\"\")+'\">\u003c/div>\u003cdiv>\u003clabel>City\u003c/label>\u003cinput name=\"city\" class=\"field\" value=\"'+E(profile?.city||\"\")+'\">\u003c/div>\u003cdiv>\u003clabel>Age (required for eligibility)\u003c/label>\u003cinput type=\"number\" min=\"1\" max=\"120\" name=\"age\" class=\"field\" value=\"'+E(profile?.age||\"\")+'\">\u003c/div>\u003cdiv>\u003clabel>Maximum travel distance (miles)\u003c/label>\u003cinput type=\"number\" min=\"0\" max=\"500\" name=\"max_distance\" class=\"field\" value=\"'+E(profile?.max_distance??20)+'\">\u003c/div>\u003cdiv>\u003clabel>Available day\u003c/label>\u003cselect class=\"field\" name=\"availability\">'+[\"Saturday\",\"Sunday\",\"Weekday\",\"Flexible\"].map(x=>'\u003coption '+(profile?.availability?.includes(x)?\"selected\":\"\")+'>'+x+'\u003c/option>').join(\"\")+'\u003c/select>\u003c/div>\u003cdiv>\u003clabel>Commitment\u003c/label>\u003cselect class=\"field\" name=\"commitment\">'+[\"One-time\",\"Weekly\",\"Monthly\"].map(x=>'\u003coption '+(profile?.commitment===x?\"selected\":\"\")+'>'+x+'\u003c/option>').join(\"\")+'\u003c/select>\u003c/div>\u003cdiv>\u003clabel>Preferred activity\u003c/label>\u003cselect class=\"field\" name=\"activity\">'+[\"Hands-on\",\"Outdoor\",\"Teaching\",\"Social\"].map(x=>'\u003coption '+(profile?.activities?.includes(x)?\"selected\":\"\")+'>'+x+'\u003c/option>').join(\"\")+'\u003c/select>\u003c/div>\u003cdiv>\u003clabel>Favorite cause\u003c/label>\u003cselect class=\"field\" name=\"interest\">'+CATS.map(x=>'\u003coption '+(profile?.interests?.includes(x[1])?\"selected\":\"\")+'>'+x[1]+'\u003c/option>').join(\"\")+'\u003c/select>\u003c/div>\u003cdiv class=\"full\">\u003cbutton class=\"btn\">Save preferences\u003c/button>\u003c/div>\u003c/form>\u003c/div>'))}\nfunction footer(){return '\u003cdiv class=\"foot\">\u003cdiv class=\"container\">\u003ch2>Kindred ✳\u003c/h2>\u003cp>Make your time matter. Built to connect communities through meaningful service.\u003c/p>\u003csmall>© '+new Date().getFullYear()+' Kindred · New organizations are unverified until reviewed.\u003c/small>\u003c/div>\u003c/div>'}\nfunction render(){let page=view===\"home\"?home():view===\"discover\"?discover():view===\"dashboard\"?dashboard():view===\"saved\"?savedPage():view===\"applications\"?applicationsPage():view===\"hours\"?hoursPage():view===\"organizations\"?organizationsPage():profilePage();$(\"#app\").innerHTML=header()+page+footer()}\nfunction modal(title,body){$(\"#dialog\").innerHTML='\u003cdiv class=\"overlay\" onclick=\"if(event.target===this)closeModal()\">\u003cdiv class=\"modal\">\u003cbutton class=\"close\" onclick=\"closeModal()\">×\u003c/button>\u003ch2>'+E(title)+'\u003c/h2>'+body+'\u003c/div>\u003c/div>'}\nfunction closeModal(){$(\"#dialog\").innerHTML=\"\"}\nfunction openAuth(){if(!live)return notify(\"Connect Supabase to activate real accounts. See README.\");modal(\"Join Kindred\",'\u003cp>Sign in or create your free account.\u003c/p>\u003cform onsubmit=\"auth(event)\" class=\"form\">\u003cdiv class=\"full\">\u003clabel>Email\u003c/label>\u003cinput class=\"field\" name=\"email\" type=\"email\" required autocomplete=\"email\">\u003c/div>\u003cdiv class=\"full\">\u003clabel>Password\u003c/label>\u003cinput class=\"field\" name=\"password\" type=\"password\" required minlength=\"6\" autocomplete=\"current-password\">\u003c/div>\u003cbutton class=\"btn\" name=\"action\" value=\"login\">Sign in\u003c/button>\u003cbutton class=\"btn alt\" name=\"action\" value=\"signup\">Create account\u003c/button>\u003cbutton class=\"btn alt full\" name=\"action\" value=\"reset\" formnovalidate>Send password reset email\u003c/button>\u003c/form>\u003cp class=\"fine\">Account confirmation may be required depending on your Supabase settings.\u003c/p>')}\nasync function auth(ev){ev.preventDefault();let f=new FormData(ev.target),action=ev.submitter?.value||\"login\",email=f.get(\"email\"),password=f.get(\"password\"),result;if(action===\"reset\"){result=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});}else if(action===\"signup\"){result=await db.auth.signUp({email,password});}else{result=await db.auth.signInWithPassword({email,password})}if(result.error)return notify(result.error.message);closeModal();notify(action===\"signup\"?\"Account created. Check your email if confirmation is required.\":action===\"reset\"?\"Check your email for a reset link.\":\"Signed in.\");await bootstrap();nav(\"dashboard\")}\nasync function signout(){if(!db)return;const r=await db.auth.signOut();if(r.error)return notify(r.error.message);user=null;profile=null;items=[];orgs=[];applications=[];sessions=[];saved=[];nav(\"home\")}\nasync function fetchTable(table,query){const {data,error}=await query;if(error){console.warn(table,error);return []}return data||[]}\nasync function bootstrap(){if(!db){render();return}let result=await db.auth.getUser();user=result.data.user;if(!user){profile=null;applications=[];sessions=[];saved=[]}await loadData()}\nasync function loadData(){if(!db)return;let ops=await fetchTable(\"opportunities\",db.from(\"opportunities\").select(\"*,organizations(name)\").eq(\"active\",true).order(\"created_at\",{ascending:false}));items=ops; if(user){const results=await Promise.all([db.from(\"profiles\").select(\"*\").eq(\"id\",user.id).maybeSingle(),db.from(\"organizations\").select(\"*\").eq(\"owner_id\",user.id),db.from(\"applications\").select(\"*,opportunities(title)\").eq(\"user_id\",user.id).order(\"created_at\",{ascending:false}),db.from(\"volunteer_sessions\").select(\"*,organizations(name)\").eq(\"user_id\",user.id).order(\"date\",{ascending:false}),db.from(\"saved_opportunities\").select(\"*\").eq(\"user_id\",user.id)]);profile=results[0].data;orgs=results[1].data||[];applications=results[2].data||[];sessions=results[3].data||[];saved=results[4].data||[]}render()}\nasync function saveProfile(ev){ev.preventDefault();if(!guard())return;let f=new FormData(ev.target),v={id:user.id,full_name:f.get(\"full_name\"),city:f.get(\"city\"),age:Number(f.get(\"age\"))||null,max_distance:Number(f.get(\"max_distance\")),availability:[f.get(\"availability\")],commitment:f.get(\"commitment\"),activities:[f.get(\"activity\")],interests:[f.get(\"interest\")]};let r=await db.from(\"profiles\").upsert(v);if(r.error)return notify(r.error.message);profile=v;notify(\"Preferences saved\");render()}\nasync function toggleSaved(id){if(!guard())return;let existing=saved.find(x=>x.opportunity_id===id);let r=existing?await db.from(\"saved_opportunities\").delete().eq(\"user_id\",user.id).eq(\"opportunity_id\",id):await db.from(\"saved_opportunities\").insert({user_id:user.id,opportunity_id:id});if(r.error)return notify(r.error.message);await loadData();notify(existing?\"Removed from saved\":\"Opportunity saved\")}\nfunction apply(id){if(!guard())return;let o=items.find(x=>x.id===id);if(!o)return;if(!eligible(o))return notify(\"This opportunity has an age requirement.\");modal(\"Apply: \"+o.title,'\u003cp>Applications are sent to the organization for review. Applying does not mean you are accepted.\u003c/p>\u003cform onsubmit=\"submitApplication(event,\\''+id+'\\')\">\u003clabel>Why would you like to volunteer?\u003c/label>\
