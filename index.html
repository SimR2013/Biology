:normal;color:var(--t-accent,#a8d2ef);font-weight:800}\n.course-tip{padding:15px;border-left:4px solid var(--t-accent,#a8d2ef);background:var(--t-card2,#254362);border-radius:0 12px 12px 0;margin:17px 0;line-height:1.6}\n.course-check{border:1px solid var(--t-border,#50708e);border-radius:16px;padding:19px;margin:18px 0;background:var(--t-card2,#254362)}\n.course-check h3{margin:0 0 10px}.course-check button{display:block;width:100%;text-align:left;padding:12px 13px;margin:8px 0;background:var(--t-card,#1b3552);border:1px solid var(--t-border,#50708e);border-radius:11px;color:var(--t-text,#edf5ff);cursor:pointer;font:inherit}\n.course-check button:disabled{opacity:.9;cursor:default}.course-check button.correct{border-color:#83c9a9;background:#245544;color:#f1fff9}.course-check button.wrong{border-color:#e6a1a8;background:#593942;color:#fff}\n.course-feedback{min-height:24px;color:var(--t-text,#edf5ff);margin-top:8px;line-height:1.6}\n.course-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:17px 0}.course-nav button{flex:1;min-width:125px}\n.course-progress{height:9px;background:var(--t-card2,#254362);border-radius:12px;overflow:hidden}.course-progress>div{height:100%;background:var(--t-accent,#a8d2ef);transition:width .2s}\n.course-jump{margin-top:13px;display:flex;gap:9px;flex-wrap:wrap}\n@media(max-width:690px){.course-outline{grid-template-columns:1fr}.course-lesson,.course-intro{padding:16px}.course-nav button{min-width:0}.course-sequence i{display:none}}\n\n/* Teacher's Key Takeaways checklist inside each guided lesson */\n.course-teacher{margin:20px 0;border:1px solid var(--t-border,#50708e);border-radius:15px;background:var(--t-card2,#254362);padding:18px}\n.course-teacher h3{margin:0 0 10px!important;color:var(--t-text,#edf5ff)}\n.course-teacher li{padding:3px 0;color:var(--t-text,#edf5ff)}\n.course-teacher p{margin:12px 0 0;color:var(--t-muted,#c1d4e9)}\n\n.course-reread{padding:15px;margin:17px 0;border-radius:13px;border:1px solid var(--t-border);background:var(--t-card2)}.course-reread p{color:var(--t-text);margin:8px 0}.course-reread small{color:var(--t-muted)}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003cdiv class=\"inside\">\u003ca href=\"themes.html\" class=\"theme-direct-link\" style=\"display:inline-block;margin-right:13px;font-weight:850;color:var(--t-accent);text-decoration:none\">🎨 Themes & Color Wheel\u003c/a>\u003ca href=\"./\" style=\"color:var(--t-accent);display:inline-block;margin-bottom:9px;font-weight:800;text-decoration:none\">← Choose another test\u003c/a>\u003cdiv class=\"tag\">BIOLOGY • CHAPTER 4 + LESSON 7.2\u003c/div>\u003ch1>Learn it. Practice it. Ace the test.\u003c/h1>\u003cp>Teacher-style scenarios • Food-web diagrams • 10% rule • Cycles of matter • Human impacts • 23-question exam + brand-new test sets + written feedback\u003c/p>\u003cdiv class=\"chapter-forge-banner\" style=\"margin:17px 0;padding:17px 20px;background:var(--t-card);border:1px solid var(--t-border);border-radius:17px\">\u003cdiv style=\"font-weight:900;color:var(--t-accent);letter-spacing:.08em;font-size:.8rem\">NEW • BIOFORGE ECOSYSTEM COMMAND CENTER\u003c/div>\u003cdiv style=\"font-weight:850;font-size:1.25rem;margin:6px 0 10px\">Simulate food webs, control nutrient runoff, fight biology boss battles.\u003c/div>\u003ca href=\"bioforge.html\" style=\"display:inline-block;background:var(--t-accent);color:var(--t-accent-text);text-decoration:none;font-weight:900;padding:11px 16px;border-radius:11px\">🚀 Launch BioForge\u003c/a>\u003c/div>\u003cdiv class=\"nav\" id=\"nav\">\u003cbutton data-page=\"home\" class=\"active\">Dashboard\u003c/button>\u003cbutton data-page=\"path\">🧭 Choose Mode\u003c/button>\u003cbutton data-page=\"hardcore\">🔥 Hardcore Study\u003c/button>\u003cbutton data-page=\"ai-live\">🤖 Live AI Tutor\u003c/button>\u003cbutton data-page=\"lab\">🌿 Ecosystem Lab \u003cspan style=\"color:#ffd37a\">NEW\u003c/span>\u003c/button>\u003cbutton data-page=\"smart\">🚀 Smart Study Hub\u003c/button>\u003cbutton data-page=\"course\">📘 Learn Everything (Guided)\u003c/button>\u003cbutton data-page=\"learn\">Study Notes\u003c/button>\u003cbutton data-page=\"flash\">Flashcards\u003c/button>\u003cbutton data-page=\"everything\">All Concepts + Recall Quiz\u003c/button>\u003cbutton data-page=\"practice\">Practice\u003c/button>\u003cbutton data-page=\"exam\">Mock Exam\u003c/button>\u003cbutton data-page=\"tutor\">Tutor Studio ✨\u003c/button>\u003cbutton data-page=\"written\">Written Prep\u003c/button>\u003c/div>\u003c/div>\u003c/header>\u003cmain>\n\n\n\u003csection class=\"view\" id=\"path\">\u003cdiv class=\"card\">\u003cspan class=\"tag\">YOUR STUDY PATH\u003c/span>\u003ch2>Choose your training mode\u003c/h2>\u003cp>You can switch at any time. Both modes use the same Chapter 4 science content and save progress on this device.\u003c/p>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch2>🎮 Game Mode\u003c/h2>\u003cp>Run ecological experiments, earn XP, survive the four ecosystem missions and test hypotheses.\u003c/p>\u003cbutton class=\"btn\" onclick=\"document.querySelector('[data-page=lab]').click()\">Enter Ecosystem Lab →\u003c/button>\u003c/div>\u003cdiv class=\"card\">\u003ch2>🔥 Hardcore Study\u003c/h2>\u003cp>Fast questions with strict marking, no hints until you answer, and weak-topic practice. Train until your accuracy improves.\u003c/p>\u003cbutton class=\"btn\" onclick=\"document.querySelector('[data-page=hardcore]').click()\">Start Hardcore →\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"view\" id=\"hardcore\">\u003cspan class=\"tag\">FOCUSED TRAINING\u003c/span>\u003ch2>🔥 Hardcore Study Arena\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"controls\">\u003clabel>Lesson \u003cselect id=\"hardUnit\">\u003coption value=\"all\">All test topics\u003c/option>\u003coption>4.1\u003c/option>\u003coption>4.2\u003c/option>\u003coption>4.3\u003c/option>\u003coption>7.2\u003c/option>\u003c/select>\u003c/label>\u003cbutton class=\"btn\" onclick=\"hardStart()\">Start / New Round\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"hardStart(true)\">Retry missed\u003c/button>\u003c/div>\u003cp class=\"small\" id=\"hardScore\">Choose a topic to begin. Answers are checked after each response.\u003c/p>\u003cdiv id=\"hardQuestion\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"view\" id=\"ai-live\">\u003cspan class=\"tag\">LIVE AI • OPTIONAL ONLINE FEATURE\u003c/span>\u003ch2>🤖 Your real AI biology tutor\u003c/h2>\u003cdiv class=\"card\">\u003cp>Connect a Cloudflare Worker to enable conversational AI. If you haven't deployed the Worker, the rest of this website still works offline. Never paste an API key into this page.\u003c/p>\u003clabel class=\"small\" for=\"aiEndpoint\">Your deployed Cloudflare Worker URL\u003c/label>\u003cinput id=\"aiEndpoint\" placeholder=\"https://your-worker.your-subdomain.workers.dev\" autocomplete=\"off\" style=\"display:block;background:#243a56;color:white;border:1px solid #57728d;border-radius:9px;padding:12px;width:100%;margin:8px 0\">\u003cdiv class=\"controls\">\u003cbutton class=\"btn secondary\" onclick=\"saveAIEndpoint()\">Save URL on this device\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"document.querySelector('[data-page=tutor]').click()\">Use offline guided tutor instead\u003c/button>\u003c/div>\u003chr style=\"border:0;border-top:1px solid #344e65;margin:18px 0\">\u003clabel>How should the tutor help?\u003c/label>\u003cselect id=\"aiMode\">\u003coption value=\"hints\">Guide me with hints first\u003c/option>\u003coption value=\"explain\">Explain this concept\u003c/option>\u003coption value=\"grade\">Grade my written response\u003c/option>\u003c/select>\u003cp>\u003ctextarea id=\"aiText\" rows=\"5\" maxlength=\"3500\" placeholder=\"Example: Explain why energy flows but carbon cycles. Or paste your written answer here.\" style=\"width:100%;padding:12px;border-radius:10px;background:#1b3050;color:white;border:1px solid #57728d\">\u003c/textarea>\u003c/p>\u003cbutton class=\"btn\" id=\"aiSendBtn\" onclick=\"askLiveAI()\">Ask AI\u003c/button>\u003cdiv id=\"aiAnswer\" class=\"card\" aria-live=\"polite\">Your AI response appears here when connected.\u003c/div>\u003cp class=\"small\">Free-tier rate limits apply. An AI answer can be wrong: verify against your study guide and lectures.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"view\" id=\"lab\">\n\u003cdiv class=\"lab-hero\">\u003cdiv class=\"tag\">INTERACTIVE LEARNING ADVENTURE • CHAPTER 4\u003c/div>\u003ch2>🌿 Ecosystem Lab\u003c/h2>\u003cp>Don't just answer questions. \u003cb>Change an ecosystem, discover the consequences, and defend your scientific reasoning.\u003c/b> This is an educational model—not a forecast of real population sizes.\u003c/p>\u003cdiv class=\"lab-top\">\u003cspan id=\"labLevel\">Mission 1 / 4\u003c/span>\u003cspan id=\"labPoints\">0 XP\u003c/span>\u003cspan id=\"labBadge\">🌱 Apprentice\u003c/span>\u003c/div>\u003cdiv class=\"progress\">\u003cdiv id=\"labProgress\" style=\"width:0%\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"lab-tabs\">\u003cbutton type=\"button\" class=\"active\" data-mission=\"0\">1 · Food-web chaos\u003c/button>\u003cbutton type=\"button\" data-mission=\"1\">2 · Energy vault\u003c/button>\u003cbutton type=\"button\" data-mission=\"2\">3 · Cycle detective\u003c/button>\u003cbutton type=\"button\" data-mission=\"3\">4 · Science courtroom\u003c/button>\u003c/div>\n\u003cdiv id=\"labStage\">\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>🧠 Your mistake vault\u003c/h3>\u003cp>Practice the concepts you missed in the lab. Correctly answering them again clears them from your review queue.\u003c/p>\u003cdiv id=\"labVault\">\u003c/div>\u003cdiv class=\"controls\">\u003cbutton class=\"btn secondary\" onclick=\"labReview()\">Practice my weak spots\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"labResetProgress()\">Reset lab progress\u003c/button>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"view active\" id=\"home\">\u003ch2>Your study dashboard\u003c/h2>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003cdiv class=\"small\">Flashcards mastered\u003c/div>\u003cdiv class=\"stat\" id=\"sFlash\">0\u003c/div>\u003cp>Tap a flashcard to reveal the explanation. Mark it mastered when you know it.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"small\">Practice accuracy\u003c/div>\u003cdiv class=\"stat\" id=\"sPractice\">—\u003c/div>\u003cp>Get instant explanations after each answer.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"small\">Latest mock exam\u003c/div>\u003cdiv class=\"stat\" id=\"sExam\">Not taken\u003c/div>\u003cp>21 multiple-choice + 2 written response questions.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003ch3>Your actual test blueprint\u003c/h3>\u003cp>\u003cb>23 questions, including 2 written responses.\u003c/b> Coverage: 4.1 producers/consumers; 4.2 food webs/pyramids; 4.3 matter cycles; 7.2 human impacts. Practice emphasizes applications, diagrams, BEST-answer questions, prediction and CER explanations.\u003c/p>\u003cdiv class=\"controls\">\u003cbutton class=\"btn\" onclick=\"page('exam')\">Take mock test\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"page('learn')\">Study first\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003ch3>Diagram: where does the energy go?\u003c/h3>\u003cdiv id=\"pyramid\">\u003c/div>\u003cp class=\"small\">The model assumes ~10% transfer from each trophic level to the next. Energy not transferred is used or dispersed, often as heat; matter continues to cycle.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"view\" id=\"smart\">\u003cdiv id=\"smartHub\" class=\"smart-intro\">\u003cdiv class=\"tag\">BIOLOGY STUDY VAULT 3.0\u003c/div>\u003ch2>🚀 Smart Study Hub\u003c/h2>\u003cp>One place to see what you need to work on, practice your weakest topics, take a timed teacher-style exam, and solve diagrams. Your results stay on this device.\u003c/p>\u003c/div>\n\u003cnav class=\"smart-tabbar\" aria-label=\"Smart Study tools\">\u003cbutton type=\"button\" data-smart-tab=\"mastery\" aria-pressed=\"true\">📊 My Progress\u003c/button>\u003cbutton type=\"button\" data-smart-tab=\"trainer\" aria-pressed=\"false\">🎯 Weakness Trainer\u003c/button>\u003cbutton type=\"button\" data-smart-tab=\"exam\" aria-pressed=\"false\">⏱️ Timed Exam\u003c/button>\u003cbutton type=\"button\" data-smart-tab=\"diagram\" aria-pressed=\"false\">🧩 Diagrams\u003c/button>\u003c/nav>\n\u003cdiv class=\"smart-panel\" data-smart-panel=\"mastery\">\u003ch2>Topic mastery dashboard\u003c/h2>\u003cp>Accuracy is based on your latest 30 answers per lesson from this hub and connected study modes. Topics without attempts remain unscored.\u003c/p>\u003cdiv id=\"smartMastery\">\u003c/div>\u003cdiv class=\"smart-recommend\" id=\"smartRecommendation\">\u003c/div>\u003cp class=\"small\" id=\"smartHistory\">\u003c/p>\u003cp class=\"small\" id=\"smartDueCount\">\u003c/p>\u003cdiv class=\"smart-tools\">\u003cbutton id=\"smartReviewDue\" class=\"btn\">Review due flashcards →\u003c/button>\u003ca class=\"btn secondary\" href=\"chapter4.html?mode=course\">Learn everything →\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"smart-panel\" data-smart-panel=\"trainer\" hidden>\u003ch2>Targeted weakness training\u003c/h2>\u003cp>Choose a topic or let the site suggest your weakest one based on recent answers. Each question comes from your existing Chapter 4 teacher-style exam.\u003c/p>\u003cdiv class=\"smart-tools\">\u003clabel for=\"smartUnit\">Practice focus\u003c/label>\u003cselect id=\"smartUnit\">\u003coption value=\"weak\">My weakest topic\u003c/option>\u003coption value=\"all\">All topics\u003c/option>\u003coption value=\"4.1\">4.1 Producers & Consumers\u003c/option>\u003coption value=\"4.2\">4.2 Food Webs / Energy\u003c/option>\u003coption value=\"4.3\">4.3 Matter Cycles\u003c/option>\u003coption value=\"7.2\">7.2 Human Impacts\u003c/option>\u003c/select>\u003cbutton class=\"btn\" id=\"smartStartTrainer\">Start focused practice\u003c/button>\u003c/div>\u003cp class=\"small\" id=\"trainerMessage\">\u003c/p>\u003cdiv id=\"trainerBox\">\u003c/div>\u003c/div>\n\u003cdiv class=\"smart-panel\" data-smart-panel=\"exam\" hidden>\u003ch2>Timed exam simulator\u003c/h2>\u003cp>21 multiple-choice questions and 2 written responses. Answer or flag questions, jump between question numbers, and review explanations by topic when finished. Written responses are self-reviewed, not automatically AI-graded.\u003c/p>\u003cdiv class=\"smart-tools\">\u003clabel for=\"examMinutes\">Time limit\u003c/label>\u003cselect id=\"examMinutes\">\u003coption value=\"20\">20 minutes\u003c/option>\u003coption value=\"30\" selected>30 minutes\u003c/option>\u003coption value=\"45\">45 minutes\u003c/option>\u003coption value=\"60\">60 minutes\u003c/option>\u003c/select>\u003cbutton id=\"smartStartExam\" class=\"btn\">Start timed exam\u003c/button>\u003c/div>\u003cdiv id=\"smartExamBody\">\u003c/div>\u003cdiv id=\"smartExamResult\">\u003c/div>\u003c/div>\n\u003cdiv class=\"smart-panel\" data-smart-panel=\"diagram\" hidden>\u003ch2>Interactive visual challenges\u003c/h2>\u003cp>Follow the arrows and identify biological processes, step by step. Every diagram includes an explanation after you answer.\u003c/p>\u003cdiv id=\"smartDiagram\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"view\" id=\"course\">\n\u003cdiv class=\"course-intro\">\u003cdiv class=\"tag\">BIOLOGY · COMPLETE GUIDED COURSE\u003c/div>\u003ch1>📘 Learn Everything\u003c/h1>\u003cp>Start from the basics and work through all the Chapter 4 and Lesson 7.2 biology topics. Each lesson includes a visual diagram, easy-to-follow explanations, examples, and a short check question. Choose lessons in any order.\u003c/p>\u003cdiv class=\"course-progress\" role=\"progressbar\" aria-label=\"Lessons completed\">\u003cdiv id=\"courseProgressBar\" style=\"width:0\">\u003c/div>\u003c/div>\u003cp class=\"small\" id=\"courseCompleted\">0 of 8 lessons complete\u003c/p>\u003cdiv class=\"course-jump\">\u003ca class=\"btn secondary\" href=\"chapter4.html?mode=flash\">Review flashcards →\u003c/a>\u003ca class=\"btn secondary\" href=\"chapter4.html?mode=exam\">Take mock exam →\u003c/a>\u003c/div>\u003c/div>\n\u003ch2>Choose a lesson\u003c/h2>\u003cp>Tap any topic to open its illustrated lesson. A check mark appears after you correctly answer the lesson's review question.\u003c/p>\u003cdiv class=\"course-outline\" id=\"courseOutline\">\u003c/div>\n\u003cdiv class=\"course-lesson\" id=\"courseLesson\" aria-live=\"polite\">\u003c/div>\n\u003cdiv class=\"course-nav\">\u003cbutton id=\"courseBack\" type=\"button\" class=\"btn secondary\">← Previous lesson\u003c/button>\u003cbutton id=\"courseNext\" type=\"button\" class=\"btn\">Next lesson →\u003c/button>\u003c/div>\n\u003c/section>\n\u003csection class=\"view\" id=\"learn\">\u003ch2>Study notes from your textbook and teacher's slides\u003c/h2>\u003cp>Choose one of the tested units. Focus on the examples and common traps.\u003c/p>\u003cdiv class=\"controls\">\u003cselect id=\"unit\" onchange=\"renderNotes()\">\u003coption value=\"all\">All topics\u003c/option>\u003coption>4.1\u003c/option>\u003coption>4.2\u003c/option>\u003coption>4.3\u003c/option>\u003coption>7.2\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"notes\">\u003c/div>\u003c/section>\n\u003csection class=\"view\" id=\"flash\">\n\u003ch2>🧠 Flashcard Studio\u003c/h2>\u003cp>Study with definition cards, short-answer questions, exam-style scenarios, and process challenges. Choose a type below or mix everything together.\u003c/p>\n\u003cdiv class=\"card flash-options\">\n\u003cdiv class=\"flash-settings\">\n\u003clabel>Card type\u003cselect id=\"flashType\" onchange=\"resetFlash()\">\u003coption value=\"mixed\">🔀 Mixed: words + questions\u003c/option>\u003coption value=\"definitions\">📖 Definitions &amp; concepts\u003c/option>\u003coption value=\"questions\">❓ Question cards\u003c/option>\u003coption value=\"scenarios\">🎯 Teacher-style scenarios\u003c/option>\u003coption value=\"process\">🔄 Process &amp; order\u003c/option>\u003coption value=\"comparison\">⚖️ Compare concepts\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Lesson\u003cselect id=\"flashUnit\" onchange=\"resetFlash()\">\u003coption value=\"all\">All lessons\u003c/option>\u003coption value=\"4.1\">4.1 Producers &amp; Consumers\u003c/option>\u003coption value=\"4.2\">4.2 Energy Flow\u003c/option>\u003coption value=\"4.3\">4.3 Cycles of Matter\u003c/option>\u003coption value=\"7.2\">7.2 Human Impacts\u003c/option>\u003coption value=\"lecture43\">⭐ Lecture 4.3 slide highlights\u003c/option>\u003coption value=\"takeaways\">🎓 Teacher Key Takeaways\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Review mode\u003cselect id=\"flashMode\" onchange=\"resetFlash()\">\u003coption value=\"all\">📚 All cards\u003c/option>\u003coption value=\"unlearned\">🌱 Not yet mastered\u003c/option>\u003coption value=\"missed\">🔁 Need more practice\u003c/option>\u003coption value=\"due\">📅 Due for review\u003c/option>\u003coption value=\"mastered\">✅ Mastered cards\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>Card direction\u003cselect id=\"flashDirection\" onchange=\"renderFlash()\">\u003coption value=\"normal\">Term / question → answer\u003c/option>\u003coption value=\"reverse\">Answer → term / question\u003c/option>\u003c/select>\u003c/label>\n\u003c/div>\n\u003cdiv class=\"controls\">\u003cbutton class=\"btn secondary\" onclick=\"shuffleFlash()\">🔀 Shuffle cards\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"resetFlash()\">↻ Restart selection\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"location.assign('chapter4.html?mode=everything')\">📝 Flashcard quiz\u003c/button>\u003c/div>\n\u003cdiv class=\"flash-progress\">\u003cspan id=\"flashCounter\" class=\"chip\" aria-live=\"polite\">Loading cards\u003c/span>\u003cspan id=\"flashStats\" class=\"small\">\u003c/span>\u003c/div>\n\u003cdiv class=\"progress\" aria-label=\"Flashcard review progress\">\u003cdiv id=\"flashProgressBar\" style=\"width:0\">\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"flash\" id=\"flashCard\" onclick=\"this.classList.toggle('flipped')\" role=\"button\" tabindex=\"0\" aria-label=\"Tap to flip flashcard\">\u003cdiv class=\"question\" id=\"flashQuestion\">\u003c/div>\u003cdiv class=\"answer\" id=\"flashAnswer\">\u003c/div>\u003c/div>\n\u003cp class=\"small\" id=\"flashHelp\">Tap the card to reveal the answer. Then mark how well you remembered it.\u003c/p>\n\u003cdiv class=\"flash-actions\">\n\u003cbutton class=\"btn secondary\" onclick=\"changeFlash(-1)\">← Previous\u003c/button>\n\u003cbutton class=\"btn secondary\" onclick=\"rateFlash(false)\">↻ Practice again\u003c/button>\n\u003cbutton class=\"btn\" onclick=\"rateFlash(true)\">✓ Got it\u003c/button>\n\u003cbutton class=\"btn secondary\" onclick=\"changeFlash(1)\">Next →\u003c/button>\n\u003c/div>\n\u003cp class=\"small\" id=\"flashStatus\" aria-live=\"polite\">\u003c/p>\n\u003c/section>\n\u003csection class=\"view\" id=\"everything\">\u003ch2>Learn Everything — Full Chapter 4 + 7.2\u003c/h2>\u003cp>All concepts in the teacher's test outline, broken into recall flashcards. Tap to reveal each explanation, mark cards as learned, then take the matching concept quiz. The quiz draws only from this deck.\u003c/p>\u003cdiv class=\"card\">\u003cdiv class=\"controls\">\u003cselect id=\"allUnit\" onchange=\"allReset()\">\u003coption value=\"all\">All test sections\u003c/option>\u003coption>4.1\u003c/option>\u003coption>4.2\u003c/option>\u003coption>4.3\u003c/option>\u003coption>7.2\u003c/option>\u003c/select>\u003cspan class=\"chip\" id=\"allProgress\">\u003c/span>\u003c/div>\u003cdiv id=\"allCard\" class=\"flash\" onclick=\"allFlip()\" role=\"button\" tabindex=\"0\">\u003cdiv class=\"question\" id=\"allFront\">\u003c/div>\u003cdiv class=\"answer\" id=\"allBack\">\u003c/div>\u003c/div>\u003cp class=\"small\" id=\"allCardPos\">\u003c/p>\u003cdiv class=\"controls\">\u003cbutton class=\"btn secondary\" onclick=\"allMove(-1)\">← Previous\u003c/button>\u003cbutton class=\"btn\" onclick=\"allKnown()\">✓ Know it\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"allMove(1)\">Next →\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"allShuffle()\">Shuffle cards\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003ch3>Quiz yourself on these flashcards\u003c/h3>\u003cp>Each question asks about one card and shows four possible answers from the same chapter. You receive immediate feedback and explanations. You can quiz all cards or select one section above.\u003c/p>\u003cdiv class=\"controls\">\u003cselect id=\"allQuizLength\">\u003coption value=\"10\">10 questions\u003c/option>\u003coption value=\"20\">20 questions\u003c/option>\u003coption value=\"30\">30 questions\u003c/option>\u003coption value=\"all\">All available questions\u003c/option>\u003c/select>\u003cbutton class=\"btn\" onclick=\"allQuizStart()\">Start flashcard quiz\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"allQuizStart(true)\">Quiz missed cards\u003c/button>\u003c/div>\u003cdiv id=\"allQuizBox\">\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003ch3>Complete concept checklist\u003c/h3>\u003cp class=\"small\">Every card in the selected section is listed here. Click any concept to jump to its flashcard.\u003c/p>\u003cdiv id=\"allIndex\" class=\"all-index\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"view\" id=\"practice\">\u003ch2>Scenario practice\u003c/h2>\u003cp>Practice unlimited review using your teacher's real-world question style. Each question includes feedback and explanations.\u003c/p>\u003cdiv class=\"controls\">\u003cselect id=\"practiceUnit\" onchange=\"startPractice()\">\u003coption value=\"all\">All sections\u003c/option>\u003coption>4.1\u003c/option>\u003coption>4.2\u003c/option>\u003coption>4.3\u003c/option>\u003coption>7.2\u003c/option>\u003c/select>\u003cbutton class=\"btn secondary\" onclick=\"startPractice()\">Shuffle / restart\u003c/button>\u003c/div>\u003cdiv id=\"practiceBox\">\u003c/div>\u003c/section>\n\u003csection class=\"view\" id=\"exam\">\u003ch2>Mock exam\u003c/h2>\u003cdiv class=\"card\">\u003cb>23 questions total — 21 multiple choice and 2 written responses.\u003c/b>\u003cp>This is an original practice exam modeled on your teacher's prior quizzes and your current chapter test outline. Try it without your notes. Your objective score counts multiple-choice only; written responses use a self-check rubric.\u003c/p>\u003cdiv class=\"controls\">\u003cbutton class=\"btn\" onclick=\"startExam()\">Start a new varied 23-question test\u003c/button>\u003cspan class=\"chip\" id=\"examStatus\">Not started\u003c/span>\u003c/div>\u003c/div>\u003cdiv id=\"examBox\">\u003c/div>\u003cdiv class=\"card\" id=\"examNext\" style=\"display:none\">\u003ch3>Ready for new test questions?\u003c/h3>\u003cp>Choose a fresh 23-question teacher-style test: 21 multiple choice + 2 written responses. Questions are selected from an expanded bank; some concepts may recur in different scenarios.\u003c/p>\u003cdiv class=\"controls\">\u003cbutton class=\"btn\" onclick=\"startFreshExam()\">✨ New 23-question test\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"startOriginalExam()\">Original 23 again\u003c/button>\u003c/div>\u003cp class=\"small\" id=\"bankInfo\">\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"view\" id=\"written\">\u003ch2>Written-response practice\u003c/h2>\u003cp>Your real test includes 2 written responses. For each answer, make a claim, use details from the scenario, and connect the science using because/therefore reasoning.\u003c/p>\u003cdiv id=\"writtenBox\">\u003c/div>\u003c/section>\n\u003cfooter>Offline-friendly single-file website. Progress is saved in this browser when local storage is available. Written answers receive an offline concept-based review (not real AI); you can copy an answer into ChatGPT for genuine AI feedback. Sources: your Chapter 4 textbook photos, 4.1/4.2 lecture slides, and “What you should know… Chapter 4” presentation.\u003c/footer>\u003csection class=\"view\" id=\"tutor\">\u003cdiv class=\"tutor-hero\">\u003cspan class=\"tag\">CHAPTER 4 · PERSONALIZED GUIDED REVIEW\u003c/span>\u003ch2>✨ Tutor Studio\u003c/h2>\u003cp>Get coached instead of handed an answer. Choose a topic and switch between \u003cb>Guide Me\u003c/b>, \u003cb>Explain\u003c/b>, and \u003cb>Challenge\u003c/b>. Every lesson works offline—this is a structured tutor, not a live AI connection.\u003c/p>\u003c/div>\n\u003cdiv class=\"tutor-wrap\">\u003caside class=\"tutor-side\">\u003ch3 style=\"margin-top:0\">Your learning space\u003c/h3>\u003clabel>How should I help?\u003c/label>\u003cdiv class=\"tutor-modes\">\u003cbutton type=\"button\" id=\"tm-guide\" onclick=\"tutorSetMode('guide')\">Guide me\u003c/button>\u003cbutton type=\"button\" id=\"tm-explain\" onclick=\"tutorSetMode('explain')\">Explain\u003c/button>\u003cbutton type=\"button\" id=\"tm-challenge\" onclick=\"tutorSetMode('challenge')\">Challenge\u003c/button>\u003c/div>\u003clabel>Choose a concept\u003c/label>\u003cdiv class=\"tutor-topiclist\" id=\"tutorTopics\">\u003c/div>\u003cdiv class=\"tutor-instructions\">\u003cb>🔬 How it works\u003c/b>\u003cp class=\"small\">Write what you think. Get progressively clearer hints, feedback on key ideas, and a reference to review.\u003c/p>\u003c/div>\u003cp id=\"tutorStats\" class=\"tutor-streak\">0 guided concepts solved\u003c/p>\u003c/aside>\u003cdiv class=\"tutor-main\">\u003cdiv class=\"tutor-toolbar\">\u003cspan>\u003cb id=\"tutorTitle\">Guided science tutor\u003c/b>\u003cbr>\u003cspan class=\"small\" id=\"tutorSub\">Lesson 4\u003c/span>\u003c/span>\u003cbutton type=\"button\" class=\"btn secondary\" onclick=\"tutorReset()\">↻ New attempt\u003c/button>\u003c/div>\u003cdiv id=\"tutorChat\" class=\"tutor-chat\" role=\"log\" aria-live=\"polite\">\u003c/div>\u003cdiv id=\"tutorQuick\" class=\"tutor-hintrow\">\u003c/div>\u003cdiv class=\"tutor-inputbar\">\u003ctextarea id=\"tutorInput\" placeholder=\"Explain your reasoning or ask a biology question…\" aria-label=\"Your biology response\">\u003c/textarea>\u003cbutton type=\"button\" class=\"btn\" onclick=\"tutorSend()\">Send ↗\u003c/button>\u003c/div>\u003cdiv class=\"controls\">\u003cbutton type=\"button\" class=\"btn secondary\" onclick=\"tutorHint()\">💡 Give me a hint\u003c/button>\u003cbutton type=\"button\" class=\"btn secondary\" onclick=\"tutorExplain()\">📖 Reveal explanation\u003c/button>\u003cbutton type=\"button\" class=\"btn secondary\" onclick=\"tutorCopyForAI()\">🤖 Ask ChatGPT for live AI feedback\u003c/button>\u003c/div>\u003cp class=\"small\">Offline feedback checks scientific ideas and may miss valid alternative wording. The last button copies a detailed prompt; paste it into ChatGPT for flexible AI help.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\n\u003cscript>\nconst NOTES=[[\"4.1\", \"Energy, Producers & Consumers\", [[\"Autotrophs and heterotrophs\", \"Autotrophs capture energy from sunlight or inorganic chemical reactions and store it in energy-rich molecules. Heterotrophs obtain energy and matter by consuming organisms or their products. Both use cellular respiration.\"], [\"Photosynthesis vs chemosynthesis\", \"Photosynthesis uses sunlight to make carbohydrates from carbon dioxide and water, releasing oxygen. Chemosynthesis uses energy from reactions of inorganic substances, such as hydrogen sulfide at hydrothermal vents, to make carbohydrates without sunlight.\"], [\"Consumer types\", \"Herbivores eat plants/algae; carnivores eat animals; omnivores eat both. Scavengers eat animal carcasses. Detritivores ingest fragments of dead organic matter. Decomposers (such as bacteria and fungi) chemically break down dead organic matter, releasing nutrients.\"], [\"A common trap\", \"Decomposers and detritivores both help recycle matter, but decomposers chemically break down material while detritivores ingest and fragment it. Decomposers do not create new matter.\"]]], [\"4.2\", \"Energy Flow in Ecosystems\", [[\"Food chains, webs, and arrows\", \"A food chain shows one feeding pathway; a food web links several. An arrow points FROM the food TO the organism eating it (direction of energy transfer). A change in one population may cause cascading effects across a web.\"], [\"Trophic levels\", \"Primary producers = level 1; primary consumers = level 2; secondary consumers = level 3; tertiary consumers = level 4. A species may occupy different levels in different chains.\"], [\"Three ecological pyramids\", \"Energy pyramid shows energy available at each level and is always upright. Biomass pyramid shows dry organic mass; pyramid of numbers counts individuals. Biomass and numbers pyramids can be inverted.\"], [\"The 10% rule\", \"On average about 10% of energy transfers to the next level. Example: 20,000 kJ in producers → 2,000 kJ primary consumers → 200 kJ secondary consumers → 20 kJ tertiary consumers.\"], [\"Where does energy go?\", \"Much of the energy organisms obtain supports respiration, movement, maintenance, growth, digestion, and reproduction; much is eventually released as heat. Some energy remains in uneaten biomass or waste. Matter is recycled through organisms and the environment; energy flows through and needs continued input.\"], [\"Keystone species\", \"A keystone species has an outsized influence on its ecosystem relative to its abundance. Removing it can change many populations.\"]]], [\"4.3\", \"Cycles of Matter\", [[\"Matter versus energy\", \"Matter is conserved and recycled among living things and Earth systems; energy moves one way through food webs and is ultimately dispersed as heat.\"], [\"Water cycle\", \"Evaporation and plant transpiration send water into air; condensation forms clouds; precipitation returns water; runoff and groundwater move water through land and bodies of water.\"], [\"Carbon cycle\", \"Photosynthesis removes CO₂ and stores carbon in organic compounds. Consumption moves carbon along food webs. Cellular respiration and decomposition return carbon to the environment. Burning fossil fuels and deforestation can increase atmospheric CO₂.\"], [\"Nitrogen cycle\", \"Nitrogen fixation converts atmospheric N₂ to biologically usable nitrogen; ammonification returns ammonium from waste/dead matter; nitrification converts ammonium into nitrites/nitrates; denitrification returns N₂ gas to the air. Bacteria perform vital steps.\"], [\"Phosphorus cycle\", \"Phosphorus moves mainly among rocks, soil, water, and organisms. Weathering releases phosphates; producers absorb them; consumers obtain them by feeding. Unlike nitrogen and carbon, phosphorus has no major atmospheric/gaseous phase.\"], [\"Limiting nutrients\", \"When a nutrient is scarce, it can limit growth even when water and sunlight are plentiful. Nitrogen is often limiting in marine waters; phosphorus often limits freshwater growth. Runoff can introduce excess nutrients and cause blooms.\"]]], [\"7.2\", \"Human Impacts\", [[\"Eutrophication\", \"Fertilizer and wastewater can deliver extra nitrogen/phosphorus, causing fast algal growth. When algae die, decomposition consumes dissolved oxygen, which can produce hypoxic conditions and fish kills.\"], [\"Ocean acidification\", \"Additional atmospheric CO₂ dissolves in seawater and contributes to chemical reactions that increase H⁺ concentration, lowering pH and making shell/skeleton formation harder for many marine species.\"], [\"Bioaccumulation vs biomagnification\", \"Bioaccumulation = a persistent pollutant builds up inside one organism over time. Biomagnification = pollutant concentration increases at higher trophic levels because predators consume contaminated prey.\"], [\"Other human changes\", \"Deforestation can reduce carbon uptake; fossil-fuel burning can increase atmospheric carbon; excess nutrient inputs disturb aquatic ecosystems; toxic pollutants can affect top predators.\"], [\"Avoid misconceptions\", \"Energy is not recycled like nutrients. Arrows in a food web do not point toward food. Higher trophic levels do not receive 90% of the prior level’s energy. More fertilizer is not always better for an ecosystem.\"]]]], QUESTIONS=[[\"4.1\", \"A bacterium lives near a deep-sea hydrothermal vent with no sunlight. It makes carbohydrates using energy released from inorganic chemicals. What BEST describes it?\", [\"A photosynthetic heterotroph\", \"A chemosynthetic autotroph\", \"A scavenger\", \"A decomposer\"], 1, \"It makes its own organic food using chemical energy, without sunlight.\"], [\"4.1\", \"A forest mushroom releases enzymes onto a rotting log and absorbs the products. It is acting primarily as a…\", [\"detritivore\", \"herbivore\", \"decomposer\", \"scavenger\"], 2, \"Decomposers chemically break down dead organic matter externally.\"], [\"4.1\", \"Which statement correctly compares photosynthesis and chemosynthesis?\", [\"Both require sunlight\", \"Both produce energy-rich organic compounds but use different energy sources\", \"Only chemosynthesis can be carried out by autotrophs\", \"Both require eating other organisms\"], 1, \"Light powers photosynthesis; chemical reactions power chemosynthesis.\"], [\"4.1\", \"An earthworm swallows small pieces of decaying leaves. A nearby fungus releases digestive enzymes into the same material. What is the BEST classification?\", [\"Both are scavengers\", \"Worm is decomposer; fungus is detritivore\", \"Worm is detritivore; fungus is decomposer\", \"Both are primary producers\"], 2, \"Detritivores ingest detritus; decomposers chemically break it down.\"], [\"4.1\", \"A raccoon eats berries, small fish, and insect larvae. How is it BEST classified?\", [\"Herbivore\", \"Omnivore\", \"Detritivore\", \"Autotroph\"], 1, \"An omnivore eats plant and animal material.\"], [\"4.2\", \"In a food web, an arrow points from grass to a rabbit. What does that arrow indicate?\", [\"Grass eats the rabbit\", \"Energy moves from the grass to the rabbit\", \"The rabbit gives nutrients to living grass directly\", \"The rabbit is a primary producer\"], 1, \"Arrows show energy transfer from eaten organism to eater.\"], [\"4.2\", \"Use this chain: algae → zooplankton → small fish → heron. Which organism is the SECONDARY consumer?\", [\"Algae\", \"Zooplankton\", \"Small fish\", \"Heron\"], 2, \"The small fish eats the primary consumer (zooplankton).\"], [\"4.2\", \"A marsh loses most of its frogs. Frogs eat insects; snakes eat frogs. Assuming other factors stay the same, which change is MOST likely at first?\", [\"Insects decrease and snakes increase\", \"Insects increase and snakes may decrease\", \"Plants must immediately disappear\", \"Snakes become producers\"], 1, \"Fewer frogs can mean less predation on insects and less food for snakes.\"], [\"4.2\", \"A food chain starts with 50,000 kJ in producers. Using the 10% rule, about how much reaches the SECONDARY consumers?\", [\"50,000 kJ\", \"5,000 kJ\", \"500 kJ\", \"50 kJ\"], 2, \"50,000 → 5,000 primary → 500 secondary.\"], [\"4.2\", \"A single tree supports hundreds of insects. Which ecological pyramid could be inverted in this ecosystem?\", [\"Energy pyramid only\", \"Pyramid of numbers\", \"All energy pyramids\", \"None of the ecological pyramids\"], 1, \"One producer may support many consumers, inverting a pyramid of numbers.\"], [\"4.2\", \"Which statement BEST describes a biomass pyramid?\", [\"It measures only how many organisms live at each level\", \"It shows relative mass of living organic matter at each trophic level\", \"It shows water volume at each trophic level\", \"It is always numerically identical to the energy pyramid\"], 1, \"Biomass represents living organic matter (often dry mass).\"], [\"4.2\", \"Why is less energy available to tertiary consumers than to primary consumers?\", [\"Organisms destroy energy\", \"Most captured energy is used for life processes and much is released as heat\", \"The food web reverses energy flow\", \"Matter cannot move between trophic levels\"], 1, \"Energy transforms and disperses, including as heat; only a fraction reaches the next level.\"], [\"4.2\", \"A lake food web includes algae → insects → fish, and algae → snails → fish. Which claim is supported?\", [\"The lake has two unrelated food chains\", \"Fish get energy only from snails\", \"The food web contains multiple linked food chains\", \"Arrows would point from fish to algae\"], 2, \"Several interconnected feeding paths make a food web.\"], [\"4.3\", \"A drought kills many plants, greatly reducing photosynthesis. What is the most direct expected effect on atmospheric CO₂, all else equal?\", [\"CO₂ removal by photosynthesis decreases\", \"Denitrification automatically stops\", \"All carbon disappears\", \"Photosynthesis releases more CO₂\"], 0, \"Less photosynthesis means less CO₂ is removed from the atmosphere.\"], [\"4.3\", \"Which process turns atmospheric nitrogen gas into forms that can enter biological food webs?\", [\"Denitrification\", \"Nitrogen fixation\", \"Transpiration\", \"Combustion\"], 1, \"Nitrogen fixation converts N₂ into usable compounds.\"], [\"4.3\", \"A soil bacterium converts nitrates into nitrogen gas. Which process is occurring?\", [\"Nitrification\", \"Photosynthesis\", \"Denitrification\", \"Ammonification\"], 2, \"Denitrification returns nitrogen gas to the atmosphere.\"], [\"4.3\", \"Why does the phosphorus cycle differ from the carbon and nitrogen cycles?\", [\"Phosphorus is not used by living organisms\", \"It has no major gaseous atmospheric phase\", \"It cannot be found in water\", \"It is created by producers\"], 1, \"Phosphates mainly cycle through rocks, water, soil, and organisms.\"], [\"4.3\", \"Rain falls on a forest. Some water soaks into soil, enters roots, and later leaves through leaf openings. What process returns this water to the atmosphere?\", [\"Denitrification\", \"Transpiration\", \"Runoff\", \"Condensation\"], 1, \"Transpiration releases water vapor from plants.\"], [\"7.2\", \"After fertilizer runoff enters a pond, algae grow rapidly, then many fish die. What BEST explains the fish deaths?\", [\"Photosynthesis removes all nitrogen\", \"Bacteria decomposing dead algae use up dissolved oxygen\", \"More algae always raise oxygen at every depth\", \"Phosphorus directly turns into toxins\"], 1, \"Decomposition can deplete dissolved oxygen, causing hypoxia.\"], [\"7.2\", \"A predator contains a higher concentration of mercury than the fish it eats. Which term BEST describes increasing concentrations up the food chain?\", [\"Nitrogen fixation\", \"Bioaccumulation\", \"Biomagnification\", \"Transpiration\"], 2, \"Biomagnification is the increase in pollutant concentrations at higher trophic levels.\"], [\"7.2\", \"As extra atmospheric CO₂ dissolves in seawater, which change MOST directly contributes to ocean acidification?\", [\"Hydrogen ion concentration increases\", \"All dissolved gases disappear\", \"Seawater becomes pure freshwater\", \"Nitrogen gas becomes phosphate\"], 0, \"Dissolved CO₂ forms carbonic acid chemistry that increases H⁺ and reduces pH.\"], [\"4.2\", \"WRITTEN RESPONSE 1 — A coastal marsh has grass → grasshoppers → frogs → snakes. A disease kills half the frogs. Predict TWO changes in the food web, explain arrow directions, and explain why less energy reaches the snakes. Use scientific reasoning.\", null, null, \"Look for: grasshopper increase (less frog predation); snake decrease (less prey); arrows food → eater; only ~10% transfers at each step, with energy used and dispersed as heat.\"], [\"4.3\", \"WRITTEN RESPONSE 2 — Heavy rain washes fertilizer into a lake while nearby forests are cleared. Explain (1) how nutrient runoff can lead to fish deaths and (2) how deforestation can change atmospheric CO₂. Connect matter cycling and energy flow in your explanation.\", null, null, \"Look for: nutrient runoff → algal bloom → dead algae → decomposers use oxygen → fish die; fewer trees → less photosynthesis/CO₂ uptake (and burning releases CO₂); nutrients/carbon cycle, energy flows and dissipates.\"]], PRACTICE=[[\"4.1\", \"Vultures feed on already-dead animals. They are primarily…\", [\"Decomposers\", \"Scavengers\", \"Autotrophs\", \"Herbivores\"], 1, \"Scavengers feed on carcasses.\"], [\"4.1\", \"Which organism is the BEST example of an autotroph?\", [\"Seaweed\", \"Wolf\", \"Earthworm\", \"Fungus\"], 0, \"Seaweed captures light to produce organic matter.\"], [\"4.1\", \"Which process is used by both autotrophs and heterotrophs to release energy from food molecules?\", [\"Chemosynthesis\", \"Nitrogen fixation\", \"Cellular respiration\", \"Condensation\"], 2, \"Both groups perform cellular respiration.\"], [\"4.2\", \"If a food chain has 8,000 J at producers, about how much reaches tertiary consumers?\", [\"8 J\", \"80 J\", \"800 J\", \"8,000 J\"], 0, \"8,000 → 800 → 80 → 8 J.\"], [\"4.2\", \"Why might removing a keystone predator cause large changes?\", [\"It is always the largest species\", \"Its ecological influence extends to many populations\", \"It stores all nutrients\", \"It prevents sunlight entering the ecosystem\"], 1, \"A keystone species has disproportionately large effects.\"], [\"4.2\", \"A food web is more informative than one food chain because…\", [\"it includes several interacting feeding paths\", \"it proves energy cycles\", \"it never changes\", \"it contains only top predators\"], 0, \"Webs connect many food chains.\"], [\"4.2\", \"Which ecological pyramid must remain upright?\", [\"Numbers\", \"Biomass\", \"Energy\", \"All three\"], 2, \"Energy declines as it is transferred up trophic levels.\"], [\"4.3\", \"Which pair of processes moves carbon in opposite directions between organisms and air?\", [\"Photosynthesis and cellular respiration\", \"Nitrification and transpiration\", \"Runoff and erosion\", \"Nitrogen fixation and denitrification\"], 0, \"Photosynthesis absorbs CO₂; respiration releases CO₂.\"], [\"4.3\", \"Which process forms clouds from water vapor?\", [\"Transpiration\", \"Condensation\", \"Runoff\", \"Percolation\"], 1, \"Condensation creates liquid droplets.\"], [\"4.3\", \"Dead organisms and waste release ammonium into soil through…\", [\"Ammonification\", \"Photosynthesis\", \"Denitrification\", \"Chemosynthesis\"], 0, \"Ammonification converts organic nitrogen to ammonium.\"], [\"4.3\", \"Bacteria convert ammonium into nitrites and nitrates. This is…\", [\"Fixation\", \"Nitrification\", \"Respiration\", \"Biomagnification\"], 1, \"Nitrification makes nitrites/nitrates.\"], [\"4.3\", \"An ecosystem has sunlight and water, but algae grow poorly because phosphorus is scarce. Phosphorus is the…\", [\"Producer\", \"Limiting nutrient\", \"Primary consumer\", \"Gaseous reservoir\"], 1, \"The scarcest essential resource can limit growth.\"], [\"7.2\", \"A fish slowly accumulates a persistent chemical in its tissues over its lifetime. This is…\", [\"Biomagnification\", \"Eutrophication\", \"Bioaccumulation\", \"Denitrification\"], 2, \"Bioaccumulation happens within one organism over time.\"], [\"7.2\", \"Which action most directly increases nutrient runoff into lakes?\", [\"Reducing fertilizer near streams\", \"Planting riparian buffers\", \"Applying too much fertilizer before rain\", \"Removing wastewater nutrients\"], 2, \"Rain can carry excess fertilizer into waterways.\"], [\"7.2\", \"Which change most directly raises atmospheric CO₂?\", [\"Fossil fuel combustion\", \"Reforestation\", \"Increased photosynthesis\", \"Phosphate weathering\"], 0, \"Burning fossil fuels releases stored carbon as CO₂.\"]], FLASH=[[\"4.1\", \"Autotrophs and heterotrophs\", \"Autotrophs capture energy from sunlight or inorganic chemical reactions and store it in energy-rich molecules. Heterotrophs obtain energy and matter by consuming organisms or their products. Both use cellular respiration.\"], [\"4.1\", \"Photosynthesis vs chemosynthesis\", \"Photosynthesis uses sunlight to make carbohydrates from carbon dioxide and water, releasing oxygen. Chemosynthesis uses energy from reactions of inorganic substances, such as hydrogen sulfide at hydrothermal vents, to make carbohydrates without sunlight.\"], [\"4.1\", \"Consumer types\", \"Herbivores eat plants/algae; carnivores eat animals; omnivores eat both. Scavengers eat animal carcasses. Detritivores ingest fragments of dead organic matter. Decomposers (such as bacteria and fungi) chemically break down dead organic matter, releasing nutrients.\"], [\"4.1\", \"A common trap\", \"Decomposers and detritivores both help recycle matter, but decomposers chemically break down material while detritivores ingest and fragment it. Decomposers do not create new matter.\"], [\"4.2\", \"Food chains, webs, and arrows\", \"A food chain shows one feeding pathway; a food web links several. An arrow points FROM the food TO the organism eating it (direction of energy transfer). A change in one population may cause cascading effects across a web.\"], [\"4.2\", \"Trophic levels\", \"Primary producers = level 1; primary consumers = level 2; secondary consumers = level 3; tertiary consumers = level 4. A species may occupy different levels in different chains.\"], [\"4.2\", \"Three ecological pyramids\", \"Energy pyramid shows energy available at each level and is always upright. Biomass pyramid shows dry organic mass; pyramid of numbers counts individuals. Biomass and numbers pyramids can be inverted.\"], [\"4.2\", \"The 10% rule\", \"On average about 10% of energy transfers to the next level. Example: 20,000 kJ in producers → 2,000 kJ primary consumers → 200 kJ secondary consumers → 20 kJ tertiary consumers.\"], [\"4.2\", \"Where does energy go?\", \"Much of the energy organisms obtain supports respiration, movement, maintenance, growth, digestion, and reproduction; much is eventually released as heat. Some energy remains in uneaten biomass or waste. Matter is recycled through organisms and the environment; energy flows through and needs continued input.\"], [\"4.2\", \"Keystone species\", \"A keystone species has an outsized influence on its ecosystem relative to its abundance. Removing it can change many populations.\"], [\"4.3\", \"Matter versus energy\", \"Matter is conserved and recycled among living things and Earth systems; energy moves one way through food webs and is ultimately dispersed as heat.\"], [\"4.3\", \"Water cycle\", \"Evaporation and plant transpiration send water into air; condensation forms clouds; precipitation returns water; runoff and groundwater move water through land and bodies of water.\"], [\"4.3\", \"Carbon cycle\", \"Photosynthesis removes CO₂ and stores carbon in organic compounds. Consumption moves carbon along food webs. Cellular respiration and decomposition return carbon to the environment. Burning fossil fuels and deforestation can increase atmospheric CO₂.\"], [\"4.3\", \"Nitrogen cycle\", \"Nitrogen fixation converts atmospheric N₂ to biologically usable nitrogen; ammonification returns ammonium from waste/dead matter; nitrification converts ammonium into nitrites/nitrates; denitrification returns N₂ gas to the air. Bacteria perform vital steps.\"], [\"4.3\", \"Phosphorus cycle\", \"Phosphorus moves mainly among rocks, soil, water, and organisms. Weathering releases phosphates; producers absorb them; consumers obtain them by feeding. Unlike nitrogen and carbon, phosphorus has no major atmospheric/gaseous phase.\"], [\"4.3\", \"Limiting nutrients\", \"When a nutrient is scarce, it can limit growth even when water and sunlight are plentiful. Nitrogen is often limiting in marine waters; phosphorus often limits freshwater growth. Runoff can introduce excess nutrients and cause blooms.\"], [\"7.2\", \"Eutrophication\", \"Fertilizer and wastewater can deliver extra nitrogen/phosphorus, causing fast algal growth. When algae die, decomposition consumes dissolved oxygen, which can produce hypoxic conditions and fish kills.\"], [\"7.2\", \"Ocean acidification\", \"Additional atmospheric CO₂ dissolves in seawater and contributes to chemical reactions that increase H⁺ concentration, lowering pH and making shell/skeleton formation harder for many marine species.\"], [\"7.2\", \"Bioaccumulation vs biomagnification\", \"Bioaccumulation = a persistent pollutant builds up inside one organism over time. Biomagnification = pollutant concentration increases at higher trophic levels because predators consume contaminated prey.\"], [\"7.2\", \"Other human changes\", \"Deforestation can reduce carbon uptake; fossil-fuel burning can increase atmospheric carbon; excess nutrient inputs disturb aquatic ecosystems; toxic pollutants can affect top predators.\"], [\"7.2\", \"Avoid misconceptions\", \"Energy is not recycled like nutrients. Arrows in a food web do not point toward food. Higher trophic levels do not receive 90% of the prior level’s energy. More fertilizer is not always better for an ecosystem.\"], [\"4.2\", \"Arrows in food webs\", \"From the eaten organism to the eater.\"], [\"4.2\", \"10% rule\", \"About one tenth transfers to the next trophic level.\"], [\"4.3\", \"Denitrification\", \"Nitrates are converted into atmospheric nitrogen gas.\"], [\"7.2\", \"Biomagnification\", \"Persistent pollutant concentrations rise up trophic levels.\"], [\"4.3\",\"Water cycle: what is collection?\",\"Water gathers in oceans, lakes, rivers, or other reservoirs.\"], [\"4.3\",\"What is a drought?\",\"A prolonged period with little or no precipitation.\"], [\"4.3\",\"Where does plant transpiration occur?\",\"Water vapor leaves mainly through leaf stomata.\"], [\"4.3\",\"Nitrogen cycle: what follows ammonium in nitrification?\",\"Ammonium is converted into nitrite, then nitrate.\"], [\"4.3\",\"Nitrogen cycle: what is assimilation?\",\"Plants take up usable nitrogen compounds and build organic molecules.\"], [\"4.3\",\"How does nitrogen reach animal proteins and DNA?\",\"Plants assimilate nitrogen compounds; animals get nitrogen by eating organisms.\"], [\"4.3\",\"How do nutrients move through the phosphorus cycle?\",\"Weathering releases phosphates; plants absorb them; animals obtain them by feeding.\"], [\"7.2\",\"What atmospheric pollutants cause acid rain?\",\"Sulfur dioxide (SO₂) and nitrogen oxides (NOₓ).\"], [\"7.2\",\"Which two main acids form in acid rain?\",\"Sulfuric acid and nitric acid.\"], [\"7.2\",\"How can nutrient pollution create aquatic dead zones?\",\"Algal blooms die; decomposition uses oxygen, leaving too little for aquatic life.\"], [\"7.2\",\"What is bioremediation?\",\"Using organisms such as bacteria or fungi to help remove or break down pollution.\"], [\"7.2\",\"What is marine plastic pollution?\",\"Plastic debris accumulating in oceans, including floating debris and microplastics.\"], [\"7.2\",\"Which process raises pollutants across trophic levels?\",\"Biomagnification: concentration increases at higher trophic levels.\"],[\"4.3\",\"What is a carbon sink?\",\"A reservoir that absorbs more carbon than it releases.\"],[\"4.3\",\"What is a carbon source?\",\"A reservoir or process that releases more carbon than it absorbs.\"],[\"4.3\",\"Can an organism be both a carbon sink and source?\",\"Yes. It stores carbon in biomass and releases CO₂ through respiration.\"],[\"4.3\",\"Why is unburned oil a carbon store?\",\"Carbon remains stored underground until it is extracted or released.\"],[\"4.3\",\"What makes fossil fuel burning a carbon source?\",\"Combustion releases stored carbon as atmospheric CO₂.\"],[\"4.3\",\"How do forests remove atmospheric carbon?\",\"Photosynthesis takes up CO₂ and stores carbon in organic matter.\"],[\"4.3\",\"How does decomposition recycle nutrients?\",\"Decomposers break down remains and return nutrients to soil and water.\"],[\"4.3\",\"How do photosynthesis and respiration move carbon?\",\"Photosynthesis takes up CO₂; respiration releases CO₂.\"],[\"4.3\",\"How does phosphorus return to soil?\",\"Decomposition of waste and dead organisms releases phosphorus.\"],[\"4.3\",\"How can phosphorus move into groundwater?\",\"Dissolved phosphate can leach from soil into groundwater.\"],[\"4.3\",\"How do humans add phosphorus to ecosystems?\",\"Mining and agricultural fertilizers increase phosphate inputs.\"],[\"7.2\",\"What causes ocean acidification?\",\"Absorbed CO₂ changes seawater chemistry, increasing H⁺ and lowering pH.\"],[\"7.2\",\"Why does ocean acidification affect shell builders?\",\"Less carbonate is available for calcium carbonate shells and skeletons.\"],[\"7.2\",\"What is coral bleaching?\",\"Heat or other stress causes corals to lose symbiotic algae, turning pale.\"],[\"4.3\",\"How is matter different from energy in ecosystems?\",\"Matter cycles and is reused; energy flows through and dissipates as heat.\"],[\"4.3\",\"Why do water molecules travel up from roots to leaves?\",\"Transpiration creates a pull through xylem that helps move water upward.\"],[\"7.2\",\"Bioaccumulation: individual or food web?\",\"An individual organism accumulates a pollutant over time.\"],[\"7.2\",\"Biomagnification: individual or food web?\",\"Pollutant concentration increases across higher trophic levels in a food web.\"]];\nconst TEACHER_TAKEAWAY_CARDS=[[\"4.1\",\"How does energy enter a food web through photosynthesis?\",\"Producers capture sunlight and store its energy in carbohydrates.\",\"question\"],[\"4.1\",\"How does chemosynthesis differ from photosynthesis?\",\"Chemosynthesis uses chemical energy rather than sunlight.\",\"comparison\"],[\"4.1\",\"Why is a plant an autotroph but a rabbit a heterotroph?\",\"The plant makes its own organic food; the rabbit eats organisms.\",\"comparison\"],[\"4.1\",\"Which consumer eats both plants and animals?\",\"An omnivore.\",\"question\"],[\"4.1\",\"How do a detritivore and a decomposer differ?\",\"A detritivore ingests debris; a decomposer chemically breaks it down.\",\"comparison\"],[\"4.2\",\"Name the three ecological pyramid types.\",\"Energy, biomass and numbers pyramids.\",\"question\"],[\"4.2\",\"Which pyramid shows counts rather than mass or energy?\",\"A pyramid of numbers.\",\"comparison\"],[\"4.2\",\"An energy pyramid starts with 80,000 J. What reaches tertiary consumers?\",\"About 80 J after three 10% transfers.\",\"scenario\"],[\"4.2\",\"Why do upper trophic levels have less available energy?\",\"Only a fraction of energy transfers upward; much dissipates as heat.\",\"question\"],[\"4.2\",\"Can matter be recycled while energy is lost as heat?\",\"Yes. Matter cycles while energy flows through ecosystems.\",\"comparison\"],[\"4.3\",\"What are six water-cycle processes on the teacher's checklist?\",\"Transpiration, precipitation, condensation, runoff, percolation, collection.\",\"question\"],[\"4.3\",\"What are stomata, and why do they matter in transpiration?\",\"Leaf openings that allow water vapor to leave the plant.\",\"question\"],[\"4.3\",\"Which process moves water down through soil?\",\"Percolation.\",\"question\"],[\"4.3\",\"What is the difference between precipitation and collection?\",\"Precipitation falls from clouds; collection stores water in bodies of water.\",\"comparison\"],[\"4.3\",\"Which four nitrogen cycle steps does the teacher emphasize?\",\"Fixation, ammonification, nitrification and denitrification.\",\"question\"],[\"4.3\",\"How does nitrogen move through soil, plants and animals?\",\"Plants absorb usable nitrogen; animals get it by eating organisms.\",\"process\"],[\"4.3\",\"What substance is formed by ammonification?\",\"Ammonium (NH₄⁺).\",\"question\"],[\"4.3\",\"What is the overall route of phosphorus through an ecosystem?\",\"Rock → soil → plants → animals → soil → rock.\",\"process\"],[\"4.3\",\"Why is phosphorus necessary for vertebrates?\",\"It is part of DNA and important for bones and teeth.\",\"question\"],[\"7.2\",\"Is toxic buildup within one fish bioaccumulation or biomagnification?\",\"Bioaccumulation.\",\"scenario\"],[\"7.2\",\"Is an increase in toxins from prey to top predators bioaccumulation or biomagnification?\",\"Biomagnification.\",\"scenario\"],[\"7.2\",\"What happens when CO₂ dissolves in seawater?\",\"Chemical reactions increase H⁺, lowering pH: ocean acidification.\",\"question\"],[\"7.2\",\"How do photosynthesis and cellular respiration affect atmospheric CO₂?\",\"Photosynthesis removes CO₂; respiration returns it.\",\"comparison\"],[\"7.2\",\"How does acid rain relate to air pollution?\",\"SO₂ and nitrogen oxides form acids that can fall with precipitation.\",\"question\"]];\nFLASH.push(...TEACHER_TAKEAWAY_CARDS);\nconst EXTRA_QUESTION_FLASHCARDS=[[\"4.1\",\"A plant grows using sunlight and CO₂. Why is it a producer?\",\"It makes energy-rich organic molecules using sunlight.\",\"question\"],[\"4.1\",\"A deep-sea vent has no sunlight. How can its food web begin?\",\"Chemosynthetic microbes use chemical energy to make organic food.\",\"scenario\"],[\"4.1\",\"A hawk eats a mouse that ate seeds. What is the hawk?\",\"A secondary consumer in this food chain.\",\"scenario\"],[\"4.1\",\"Why are decomposers important if matter is conserved?\",\"They break down organic waste and return usable nutrients.\",\"question\"],[\"4.1\",\"A mushroom grows on a rotting log. What role does it play?\",\"Decomposer: it chemically breaks down organic material.\",\"scenario\"],[\"4.1\",\"How do scavengers differ from decomposers?\",\"Scavengers eat carcasses; decomposers chemically break down organic matter.\",\"comparison\"],[\"4.1\",\"What do photosynthesis and chemosynthesis have in common?\",\"Both produce organic food molecules using energy.\",\"comparison\"],[\"4.1\",\"What would happen if producers disappeared from a food web?\",\"Consumers would lose their main source of energy-rich food.\",\"scenario\"],[\"4.2\",\"Grass → grasshopper → frog → snake: which is the secondary consumer?\",\"The frog, because it eats the primary consumer.\",\"scenario\"],[\"4.2\",\"Why does an arrow point from rabbit to fox?\",\"Energy and matter move from the eaten rabbit to the fox.\",\"question\"],[\"4.2\",\"If rabbits increase, how might grass change initially?\",\"Grass may decrease because more rabbits eat it.\",\"scenario\"],[\"4.2\",\"What might happen when a keystone predator is removed?\",\"Prey populations may change and trigger a trophic cascade.\",\"scenario\"],[\"4.2\",\"Why is a food web better than a single chain for predictions?\",\"It shows multiple feeding links and indirect effects.\",\"question\"],[\"4.2\",\"10,000 kJ in grass: about how much reaches secondary consumers?\",\"About 100 kJ after two 10% transfers.\",\"scenario\"],[\"4.2\",\"50,000 J in producers: how much reaches primary consumers?\",\"Approximately 5,000 J.\",\"scenario\"],[\"4.2\",\"How does an energy pyramid differ from a numbers pyramid?\",\"Energy measures available energy; numbers count organisms.\",\"comparison\"],[\"4.2\",\"Why must an energy pyramid remain upright?\",\"Less usable energy is available at each successive trophic level.\",\"question\"],[\"4.2\",\"Can a biomass pyramid be inverted? Explain.\",\"Yes. Some aquatic producers have low standing biomass but high turnover.\",\"question\"],[\"4.2\",\"Put these in order: secondary consumer, producer, primary consumer.\",\"Producer → primary consumer → secondary consumer.\",\"process\"],[\"4.2\",\"Where does energy go if it is not transferred to the next level?\",\"It supports life processes, enters waste, or dissipates as heat.\",\"question\"],[\"4.3\",\"Put water movement in order: precipitation, evaporation, condensation.\",\"Evaporation → condensation → precipitation.\",\"process\"],[\"4.3\",\"How does transpiration help water rise inside a tree?\",\"Evaporation from leaves helps pull water upward through xylem.\",\"question\"],[\"4.3\",\"What is the difference between runoff and infiltration?\",\"Runoff flows over land; infiltration moves water into soil.\",\"comparison\"],[\"4.3\",\"A region has unusually little rain for months. What is occurring?\",\"A drought.\",\"scenario\"],[\"4.3\",\"A growing forest stores more carbon than it releases. Sink or source?\",\"A net carbon sink.\",\"scenario\"],[\"4.3\",\"A factory burns fossil fuels. Sink or source of atmospheric carbon?\",\"A source, because burning fuels releases CO₂.\",\"scenario\"],[\"4.3\",\"How can an animal be both a carbon store and CO₂ source?\",\"Its tissues store carbon while respiration releases CO₂.\",\"question\"],[\"4.3\",\"Put carbon transfers in order: rabbit eats grass, grass fixes CO₂, rabbit respires.\",\"Grass fixes CO₂ → rabbit eats grass → rabbit respires CO₂.\",\"process\"],[\"4.3\",\"Which process returns organic carbon to the atmosphere as CO₂?\",\"Cellular respiration or decomposition.\",\"question\"],[\"4.3\",\"What is the difference between energy flow and matter cycling?\",\"Energy flows through ecosystems; matter is reused through cycles.\",\"comparison\"],[\"4.3\",\"Order nitrogen steps: nitrate, atmospheric N₂, ammonium, nitrite.\",\"N₂ fixation → ammonium → nitrite → nitrate (via nitrification).\",\"process\"],[\"4.3\",\"Where does ammonium come from during ammonification?\",\"Decomposers convert nitrogen in remains and wastes to ammonium.\",\"question\"],[\"4.3\",\"How do plants get nitrogen for their DNA?\",\"They assimilate nitrate or ammonium from soil.\",\"question\"],[\"4.3\",\"What process returns nitrate nitrogen to atmospheric N₂?\",\"Denitrification by microbes.\",\"question\"],[\"4.3\",\"Why can't most organisms use atmospheric nitrogen directly?\",\"They lack the ability to fix N₂ into usable nitrogen compounds.\",\"question\"],[\"4.3\",\"How does phosphorus enter soil from rocks?\",\"Weathering releases phosphate.\",\"question\"],[\"4.3\",\"Why is the phosphorus cycle unlike the nitrogen cycle?\",\"Phosphorus has no major atmospheric gas phase.\",\"comparison\"],[\"4.3\",\"What does a limiting nutrient do to population growth?\",\"Its scarcity restricts growth even if other resources are plentiful.\",\"question\"],[\"4.3\",\"A lake gets excess phosphate fertilizer. What may happen first?\",\"Increased algal growth or an algal bloom.\",\"scenario\"],[\"7.2\",\"A lake has an algal bloom followed by dying fish. Why?\",\"Decomposers consumed oxygen as dead algae broke down.\",\"scenario\"],[\"7.2\",\"Put eutrophication events in the right order.\",\"Runoff → algal bloom → algae die → decomposition → oxygen loss.\",\"process\"],[\"7.2\",\"Acid rain forms from which air pollutants?\",\"Sulfur dioxide and nitrogen oxides.\",\"question\"],[\"7.2\",\"How does ocean acidification affect carbonate availability?\",\"Extra dissolved CO₂ lowers pH and reduces carbonate ions.\",\"question\"],[\"7.2\",\"Coral turns white during heat stress. What happened?\",\"Coral bleaching: symbiotic algae were lost or expelled.\",\"scenario\"],[\"7.2\",\"How is coral bleaching different from ocean acidification?\",\"Bleaching involves lost algae; acidification changes seawater chemistry.\",\"comparison\"],[\"7.2\",\"A tuna accumulates mercury over years. What is this called?\",\"Bioaccumulation in an individual.\",\"scenario\"],[\"7.2\",\"Mercury rises from plankton to fish to seabirds. What is this?\",\"Biomagnification across trophic levels.\",\"scenario\"],[\"7.2\",\"What is the key distinction: bioaccumulation vs biomagnification?\",\"Within an organism over time vs increasing up a food web.\",\"comparison\"],[\"7.2\",\"Why can microplastics remain a long-term ocean issue?\",\"Many persist, move through water, and may be eaten by organisms.\",\"question\"],[\"7.2\",\"How can certain microbes assist pollution cleanup?\",\"Bioremediation: they break down or transform suitable pollutants.\",\"question\"],[\"7.2\",\"Which intervention can reduce eutrophication in a watershed?\",\"Reduce nutrient runoff with buffer strips or better fertilizer use.\",\"scenario\"]];\nFLAS
