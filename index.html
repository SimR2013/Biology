ree) can support many primary consumers (caterpillars).\"], [\"4.2\", \"A fox population falls. Rabbits eat the same meadow plants as deer. Which result is most plausible, assuming no other changes?\", [\"Rabbits rise and pressure on meadow plants increases\", \"Rabbit population must fall\", \"All species gain energy\", \"The arrows reverse direction\"], 0, \"Less fox predation may increase rabbits and herbivory, changing other populations.\"], [\"4.2\", \"Why can the energy pyramid never be inverted in a functioning ecosystem?\", [\"Top predators have the most mass\", \"Energy is lost as heat and life processes at each transfer\", \"Matter stops cycling at top consumers\", \"All ecosystems have fewer producers than consumers\"], 1, \"Useful energy declines between feeding levels.\"], [\"4.2\", \"A deer eats only some of a plant and releases waste. What happens to the matter that is NOT built into the deer?\", [\"It vanishes\", \"It may enter waste, detritus, and decomposers\", \"It immediately turns into sunlight\", \"It becomes pure heat only\"], 1, \"Atoms remain in ecosystems and can move into waste, soil, and decomposer pathways.\"], [\"4.3\", \"A forest regrows after logging. All else equal, what direct change would increased photosynthesis cause?\", [\"Increased CO₂ removal from air\", \"Greater nitrogen denitrification automatically\", \"Carbon atoms cease to exist\", \"Reduced organic carbon formation\"], 0, \"Growing plants incorporate atmospheric CO₂ into sugars and biomass.\"], [\"4.3\", \"A farm bacterium converts atmospheric N₂ into ammonia/ammonium-containing compounds. What process is this?\", [\"Nitrification\", \"Nitrogen fixation\", \"Denitrification\", \"Transpiration\"], 1, \"Nitrogen fixation changes atmospheric N₂ into biologically usable nitrogen forms.\"], [\"4.3\", \"A bacterium converts nitrate in wet soil to nitrogen gas. What is the most direct result?\", [\"More nitrogen gas enters the atmosphere\", \"More nitrate is created from ammonium\", \"Phosphorus enters the air as gas\", \"More sunlight is stored\"], 0, \"Denitrification returns nitrogen from nitrates to gaseous N₂.\"], [\"4.3\", \"A researcher tracks phosphorus entering a pond after rocks erode. Which route BEST describes that entry?\", [\"Phosphate from weathered rock enters soil and runoff\", \"Phosphorus gas condenses from clouds\", \"Plants make new phosphorus atoms\", \"Animals convert sunlight into phosphate\"], 0, \"Rock weathering releases phosphate to soil and water.\"], [\"4.3\", \"Which statement about cellular respiration and photosynthesis is most accurate?\", [\"Both destroy carbon atoms\", \"Photosynthesis takes in CO₂; respiration returns CO₂\", \"Respiration is only performed by animals\", \"Photosynthesis creates energy out of nothing\"], 1, \"They move carbon between inorganic CO₂ and organic molecules.\"], [\"7.2\", \"Fertilizer runs into a lake. After an algal bloom dies, oxygen levels plunge. Which process causes the oxygen decrease?\", [\"Decomposers respire while breaking down dead algae\", \"Nitrogen gas permanently disappears\", \"Sunlight stops shining\", \"Fish begin photosynthesis\"], 0, \"Microbial decomposition consumes dissolved oxygen.\"], [\"7.2\", \"An individual fish accumulates mercury during its lifetime. Which term describes this?\", [\"Biomagnification\", \"Bioaccumulation\", \"Nitrogen fixation\", \"Chemosynthesis\"], 1, \"Bioaccumulation is buildup in one organism over time.\"], [\"7.2\", \"Seawater absorbs additional atmospheric CO₂. What chemical shift contributes to acidification?\", [\"Hydrogen ion concentration increases\", \"Hydrogen ions all disappear\", \"Seawater becomes neutral pure water\", \"Nitrogen fixation stops\"], 0, \"Dissolved carbon dioxide leads to more H⁺, lowering pH.\"], [\"7.2\", \"An eagle eats many contaminated fish and has higher pollutant concentrations than those fish. Why?\", [\"Energy is created in the eagle\", \"Pollutants magnify across feeding levels\", \"All pollutants are broken down by the eagle\", \"Producers always contain the most pollutants\"], 1, \"Persistent pollutants can reach greater concentration at higher trophic levels.\"], [\"4.2\", \"WRITTEN RESPONSE — In a wetland, reeds feed snails and insects; both are eaten by fish; herons eat fish. A pesticide reduces the insect population. Predict two possible food-web effects and explain arrow directions and why less usable energy reaches the herons.\", null, null, \"Include: insect decline; less insect prey for fish (possible fish decline or increased snail feeding); heron impact; arrows food → eater; energy declines each level as organisms use energy and dissipate heat.\"], [\"4.3\", \"WRITTEN RESPONSE — A town cuts down a forest and uses phosphorus-rich fertilizer near a lake. Explain how BOTH activities alter cycles of matter and predict one effect on atmospheric CO₂ and one effect on the lake’s food web.\", null, null, \"Include: fewer trees → reduced CO₂ uptake through photosynthesis; phosphorus runoff → algal bloom → death/decomposition → oxygen depletion → fish stress/death; carbon and phosphorus matter cycle, whereas energy flows.\"]], [[\"4.1\", \"A mushroom releases enzymes outside its body to break down a fallen tree and absorbs dissolved nutrients. It is primarily a…\", [\"Detritivore\", \"Decomposer\", \"Primary producer\", \"Carnivore\"], 1, \"Fungi are decomposers that chemically break down organic matter.\"], [\"4.1\", \"An eel eats only smaller fish. Which classification best describes the eel?\", [\"Herbivore\", \"Carnivore\", \"Autotroph\", \"Detritivore\"], 1, \"Carnivores feed on other animals.\"], [\"4.1\", \"A plant and a chemosynthetic microbe share which important role?\", [\"Both consume animals\", \"Both build organic molecules from inorganic carbon\", \"Both rely on sunlight\", \"Both are scavengers\"], 1, \"Both are producers: one uses light, the other chemical energy.\"], [\"4.1\", \"Which observation MOST directly identifies an animal as a scavenger?\", [\"It eats dead animals that it did not kill\", \"It converts sunlight into sugar\", \"It grows underground\", \"It breathes oxygen\"], 0, \"Scavengers eat carcasses.\"], [\"4.1\", \"Why are decomposers essential even in ecosystems with many herbivores?\", [\"They recycle nutrients from organic remains\", \"They create extra solar energy\", \"They prevent cellular respiration\", \"They stop nitrogen from moving\"], 0, \"Decomposers make nutrients available again.\"], [\"4.2\", \"A food web contains grass → cricket → lizard and grass → rabbit → hawk. Which organism is a primary consumer?\", [\"Lizard\", \"Hawk\", \"Rabbit\", \"Grass\"], 2, \"Rabbits eat producers and are primary consumers.\"], [\"4.2\", \"A pond has 70,000 kJ at the producer level. Approximately how much reaches TERTIARY consumers?\", [\"70,000 kJ\", \"7,000 kJ\", \"700 kJ\", \"70 kJ\"], 3, \"70,000 → 7,000 → 700 → 70 kJ.\"], [\"4.2\", \"A producer level supports 2,000 g dry mass of plant material. What does the unit describe in a biomass pyramid?\", [\"Amount of stored organic matter\", \"Number of organisms\", \"Percentage of absorbed sunshine\", \"Energy in kJ\"], 0, \"Biomass means mass of living organic matter, often dry mass.\"], [\"4.2\", \"A seabird eats fish and squid, both of which eat smaller animals. Which model best shows several interconnected paths?\", [\"Single straight food chain\", \"Food web\", \"Water cycle\", \"Pyramid of numbers only\"], 1, \"Food webs combine multiple feeding pathways.\"], [\"4.2\", \"A student says energy cycles because decomposers return nutrients to plants. Which correction is BEST?\", [\"Both energy and nutrients are destroyed\", \"Matter can be recycled, but energy flows and eventually disperses as heat\", \"Energy only travels from animals to plants\", \"Decomposers make new sunlight\"], 1, \"Matter cycles; energy is continually supplied and transformed and eventually dissipated.\"], [\"4.2\", \"If all hawks are removed, which result is possible in the short term?\", [\"Prey populations increase\", \"Energy transfers become 100% efficient\", \"Producers become tertiary consumers\", \"Arrows point toward prey\"], 0, \"Predator removal can release prey from predation.\"], [\"4.2\", \"Which pyramid can sometimes be upside down while the energy pyramid stays upright?\", [\"Pyramid of numbers\", \"Energy pyramid\", \"Neither numbers nor biomass\", \"All ecosystems lack pyramids\"], 0, \"Pyramids of numbers (and sometimes biomass) can be inverted.\"], [\"4.3\", \"If cellular respiration increases while photosynthesis stays constant, what tends to happen to atmospheric CO₂?\", [\"It rises\", \"It must fall\", \"It vanishes\", \"It changes directly into nitrogen gas\"], 0, \"Cellular respiration releases CO₂.\"], [\"4.3\", \"Which nitrogen-cycle process converts ammonium into nitrites and nitrates?\", [\"Nitrification\", \"Denitrification\", \"Nitrogen fixation\", \"Decomposition of phosphate\"], 0, \"Nitrifying bacteria oxidize ammonium to nitrites/nitrates.\"], [\"4.3\", \"What is the most important difference between phosphorus cycling and nitrogen cycling?\", [\"Phosphorus lacks a significant atmospheric gas phase\", \"Phosphorus is not in DNA\", \"Nitrogen does not exist in air\", \"Phosphorus cannot dissolve in water\"], 0, \"Phosphorus principally moves among rock, soil, water and living things.\"], [\"4.3\", \"Water evaporates from soil, condenses into clouds, and falls as rain. Which statement is correct?\", [\"Matter is recycled through physical changes\", \"The water molecules are destroyed\", \"Energy cannot affect the water cycle\", \"Rain makes new hydrogen atoms\"], 0, \"Water changes location and state, but its matter is conserved.\"], [\"4.3\", \"Why is carbon transferred from a berry bush to a bird when the bird eats berries?\", [\"Organic carbon moves through consumption\", \"Carbon is created during digestion\", \"The bird becomes an autotroph\", \"CO₂ moves only through denitrification\"], 0, \"Carbon in organic molecules enters the consumer when it eats the producer.\"], [\"7.2\", \"Fertilizer runoff causes rapid algae growth in a river. Which outcome is MOST likely after a large bloom dies?\", [\"Decreased dissolved oxygen from decomposition\", \"Permanent oxygen increases at every depth\", \"Phosphorus becomes sunlight\", \"All fish gain more oxygen\"], 0, \"Decomposers respiring over dead algae can deplete dissolved oxygen.\"], [\"7.2\", \"Why might top predators have higher DDT concentrations than organisms lower in a food web?\", [\"They ingest pollutants from many prey items\", \"They are always older than producers\", \"They make DDT in their cells\", \"Their food webs reverse energy flow\"], 0, \"Persistent substances can magnify through repeated consumption.\"], [\"7.2\", \"Ocean acidity increases as more CO₂ dissolves. Which marine organisms could be especially affected?\", [\"Organisms that build calcium-carbonate shells and skeletons\", \"All microbes become producers\", \"Only land mammals\", \"Organisms never exposed to seawater\"], 0, \"Lower carbonate availability and pH can interfere with shell/skeleton formation.\"], [\"7.2\", \"Which human action directly increases nitrogen and phosphorus input into waterways?\", [\"Excess fertilizer runoff\", \"Plant transpiration\", \"Herbivory\", \"Nitrogen fixation in undisturbed soils\"], 0, \"Fertilizer runoff transports nutrients into aquatic ecosystems.\"], [\"4.2\", \"WRITTEN RESPONSE — A grassland food web has grasses → mice → snakes → hawks. A disease sharply reduces the mouse population. Predict effects on two other organisms and calculate how much of 20,000 kJ at producers could reach hawks using the 10% rule.\", null, null, \"Include: mice decrease; snakes likely decrease (less food), hawks may decrease (less snakes), grasses may increase (less grazing); 20,000 → 2,000 → 200 → 20 kJ reaching hawks; link each change logically.\"], [\"7.2\", \"WRITTEN RESPONSE — Small plankton take up a persistent pollutant. Minnows eat plankton, larger fish eat minnows, and an osprey eats larger fish. Explain bioaccumulation versus biomagnification and predict which animal has the highest pollutant concentration and why.\", null, null, \"Include: bioaccumulation = pollutant increases within one organism over time; biomagnification = higher concentration at higher trophic levels; osprey highest because it eats many contaminated prey; persistent pollutant is not easily removed.\"]]];\nlet currentExam=QUESTIONS,examRound=0;\nlet examStarted=false,exIdx=0,exAnswers={},examOrder=[];function startExam(){startFreshExam()}function startOriginalExam(){currentExam=QUESTIONS;examRound=0;$('examNext').style.display='none';if(examStarted&&!confirm('Restart your current attempt?'))return;examStarted=true;exIdx=0;exAnswers={};examOrder=currentExam.map((q,i)=>i);$('examStatus').textContent='In progress';showExam()}function captureExam(){if(!examStarted)return;let qi=examOrder[exIdx],q=currentExam[qi];if(q[2]){let c=document.querySelector(`input[name=\"e${qi}\"]:checked`);if(c)exAnswers[qi]=+c.value}else{let t=$('ewrite'+qi);if(t)exAnswers[qi]=t.value}}function showExam(){if(!examStarted)return;let qi=examOrder[exIdx],q=currentExam[qi];$('examBox').innerHTML=`\u003cdiv class=\"progress\">\u003cdiv style=\"width:${(exIdx+1)/23*100}%\">\u003c/div>\u003c/div>\u003cp class=\"small\">Question ${exIdx+1} of 23 ${exIdx>20?'• written response':'• multiple choice'}\u003c/p>${qHtml(q,qi,'e')}\u003cdiv class=\"controls\">\u003cbutton class=\"btn secondary\" onclick=\"moveExam(-1)\" ${exIdx===0?'disabled':''}>← Back\u003c/button>\u003cbutton class=\"btn\" onclick=\"moveExam(1)\">${exIdx===22?'Submit exam':'Next →'}\u003c/button>\u003c/div>`;if(exAnswers[qi]!==undefined){if(q[2]){let c=document.querySelector(`input[name=\"e${qi}\"][value=\"${exAnswers[qi]}\"]`);if(c)c.checked=true}else $('ewrite'+qi).value=exAnswers[qi]}}function moveExam(n){captureExam();if(n>0&&exAnswers[examOrder[exIdx]]===undefined){if(!confirm('This question is unanswered. Continue?'))return}exIdx+=n;if(exIdx>=23){finishExam();return}showExam()}\nfunction finishExam(){examStarted=false;let correct=0;for(let i=0;i\u003c21;i++){if(exAnswers[i]===currentExam[i][3])correct++}state.examScore=correct;save();for(let i=0;i\u003c21;i++)window.BiologySmart?.track(currentExam[i][0],exAnswers[i]===currentExam[i][3],'original-exam');$('examStatus').textContent=examRound?'Varied exam #'+examRound+' completed':'Original completed';$('examNext').style.display='block';$('bankInfo').textContent='Fresh exams draw from the expanded question pool and prioritize questions you have not seen recently.';let detail=currentExam.slice(0,21).map((q,i)=>`\u003cdetails class=\"card\" ${exAnswers[i]!==q[3]?'open':''}>\u003csummary>${i+1}. ${exAnswers[i]===q[3]?'✅':'❌'} ${safeReview(q[1])}\u003c/summary>${explainChoice(q,exAnswers[i])}\u003c/details>`).join('');$('examBox').innerHTML=`\u003cdiv class=\"card\">\u003cdiv class=\"tag\">Your scored multiple-choice results\u003c/div>\u003cdiv class=\"score\">${correct} / 21 (${Math.round(correct/21*100)}%)\u003c/div>\u003cp>Written questions are reviewed separately. Use the checkers below to assess your response; they are not included in this multiple-choice score.\u003c/p>\u003ch3>Written response 1\u003c/h3>\u003cp>${(exAnswers[21]||'(no response)').replaceAll('\u003c','&lt;')}\u003c/p>\u003cdiv class=\"rubric\">${currentExam[21][4]}\u003cp>\u003cb>Review:\u003c/b> ${safeReview(reviewLocation(currentExam[21]))}\u003c/p>\u003c/div>\u003cbutton class=\"btn secondary\" onclick=\"gradeExamWriting(21)\">Check written answer 1\u003c/button>\u003cdiv id=\"examGrade21\">\u003c/div>\u003ch3>Written response 2\u003c/h3>\u003cp>${(exAnswers[22]||'(no response)').replaceAll('\u003c','&lt;')}\u003c/p>\u003cdiv class=\"rubric\">${currentExam[22][4]}\u003cp>\u003cb>Review:\u003c/b> ${safeReview(reviewLocation(currentExam[22]))}\u003c/p>\u003c/div>\u003cbutton class=\"btn secondary\" onclick=\"gradeExamWriting(22)\">Check written answer 2\u003c/button>\u003cdiv id=\"examGrade22\">\u003c/div>\u003cdiv class=\"controls\">\u003cbutton class=\"btn\" onclick=\"startFreshExam()\">✨ New questions (23)\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"startOriginalExam()\">Retake original 23\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"page('written')\">Practice written responses\u003c/button>\u003c/div>\u003c/div>\u003ch2>Review every answer\u003c/h2>${detail}`;window.scrollTo(0,0)}\nconst VARIED_QUESTIONS=[[\"4.1\",\"A student places algae in bright light, then in darkness. Which result best supports that photosynthesis stores light energy as chemical energy?\",[\"Sugar production is higher in light\",\"Algae stop performing respiration in darkness\",\"Algae become scavengers in darkness\",\"Algae consume other animals in light\"],0,\"Photosynthesis requires light energy to build sugar; algae still respire in light and dark.\"],[\"4.1\",\"An organism lives in a dark cave and uses energy from sulfur compounds to make organic molecules. What role could it occupy in a cave food web?\",[\"Primary producer\",\"Secondary consumer\",\"Scavenger only\",\"Detritivore only\"],0,\"Chemosynthesis allows producers to support food webs without sunlight.\"],[\"4.1\",\"In a forest, which action directly returns inorganic nutrients from dead wood to the soil?\",[\"A fungus secretes digestive enzymes\",\"A hawk eats a mouse\",\"A deer eats a leaf\",\"A tree absorbs sunlight\"],0,\"Decomposers chemically release nutrients from dead organic matter.\"],[\"4.1\",\"Two organisms both eat a dead deer. A vulture consumes meat; maggots feed on pieces of decomposing flesh. Which interpretation is best?\",[\"Both are producers\",\"The vulture is a scavenger; maggots consume detrital material\",\"Both perform photosynthesis\",\"The maggots are chemosynthetic\"],1,\"Scavengers eat carcasses; detritivores eat fragments of dead organic material.\"],[\"4.1\",\"A grassland loses its producers after a drought. Why would consumers eventually decline even if predators stop hunting?\",[\"The original source of chemical energy to the food web declines\",\"Energy is recycled by consumers\",\"Predators become autotrophs\",\"Nutrients cannot move through soil\"],0,\"Most food webs depend on producers to convert external energy into food.\"],[\"4.1\",\"A mushroom and an earthworm are found in leaf litter. What is the key difference in their feeding methods?\",[\"Fungus chemically digests externally; earthworm ingests fragments\",\"Earthworm fixes carbon; fungus makes oxygen\",\"Both eat living rabbits\",\"Fungus uses sunlight; earthworm uses chemicals\"],0,\"External digestion by decomposers differs from physical ingestion by detritivores.\"],[\"4.2\",\"A food web shows grass → cricket → lizard → hawk. If lizards sharply decline, what could happen initially?\",[\"Crickets increase and hawks lose a prey source\",\"Crickets decrease and hawks increase\",\"Grass must increase\",\"All organisms remain unchanged\"],0,\"Fewer lizards mean reduced predation on crickets and less food for hawks.\"],[\"4.2\",\"A pyramid of numbers has one large tree supporting 500 caterpillars. Why might its base appear narrower than the level above?\",[\"It counts organisms, not total energy\",\"Energy is created by caterpillars\",\"There are no producers\",\"Biomass and numbers always match\"],0,\"A single large producer can support many consumers, causing an inverted numbers pyramid.\"],[\"4.2\",\"If plants contain 90,000 kJ of energy, about how much is available at the tertiary-consumer level using the 10% rule?\",[\"90 kJ\",\"900 kJ\",\"9,000 kJ\",\"9 kJ\"],0,\"Three transfers produce approximately 90,000 → 9,000 → 900 → 90 kJ.\"],[\"4.2\",\"Why does an energy pyramid remain upright even when some biomass pyramids do not?\",[\"Energy decreases with each transfer\",\"Organisms at higher levels create sunlight\",\"Matter cannot be conserved\",\"Every organism has the same biomass\"],0,\"Energy is lost from usable transfer at each trophic step.\"],[\"4.2\",\"In a chain of plankton → shrimp → fish → seal, which pair represents primary and tertiary consumers?\",[\"Shrimp and seal\",\"Fish and shrimp\",\"Plankton and fish\",\"Seal and plankton\"],0,\"Shrimp eat producers and seals eat secondary consumers.\"],[\"4.2\",\"A fox eats both berries and rabbits. In two separate food chains, how might its trophic level change?\",[\"It can act as a primary or secondary consumer\",\"It is always level one\",\"It is always a decomposer\",\"It cannot belong to two chains\"],0,\"Trophic levels depend on what the animal eats in a particular chain.\"],[\"4.3\",\"After a heavy rain, water seeps below the soil surface into groundwater. Which water-cycle process explains this?\",[\"Percolation\",\"Condensation\",\"Transpiration\",\"Precipitation\"],0,\"Percolation is downward movement of water through soil.\"],[\"4.3\",\"A drought causes stomata on leaves to close. Which water-cycle flux would decrease most directly?\",[\"Transpiration\",\"Ocean evaporation\",\"Atmospheric precipitation\",\"Runoff from pavement\"],0,\"Closed stomata limit water vapor leaving plant leaves.\"],[\"4.3\",\"A forest stores carbon in wood for decades. If it burns, what happens to much of that stored carbon?\",[\"It is released to the atmosphere as CO₂\",\"It becomes atmospheric nitrogen\",\"It disappears from the carbon cycle\",\"It is converted directly to phosphate\"],0,\"Combustion converts stored organic carbon into atmospheric carbon dioxide.\"],[\"4.3\",\"Why is atmospheric N₂ not directly useful to most plants despite being abundant?\",[\"It first needs conversion into biologically usable nitrogen compounds\",\"It must become oxygen gas\",\"Plants cannot contain nitrogen\",\"It needs to become phosphorus\"],0,\"Nitrogen fixation converts N₂ into forms that can enter biological nitrogen cycling.\"],[\"4.3\",\"Soil microbes convert ammonium first to nitrite and then nitrate. What process is this?\",[\"Nitrification\",\"Denitrification\",\"Transpiration\",\"Photosynthesis\"],0,\"Nitrifying bacteria oxidize ammonium to nitrate in two steps.\"],[\"4.3\",\"After dead leaves decompose, organic nitrogen is converted to ammonium. Name the process.\",[\"Ammonification\",\"Nitrogen fixation\",\"Denitrification\",\"Condensation\"],0,\"Ammonification converts organic nitrogen into ammonium.\"],[\"4.3\",\"What would most directly reduce the supply of phosphate released from bedrock?\",[\"Slower weathering of phosphorus-containing rocks\",\"Greater atmospheric nitrogen\",\"More ocean evaporation\",\"More sunlight on leaves\"],0,\"Weathering provides phosphorus from rocks because phosphorus has no major gas phase.\"],[\"4.3\",\"Which comparison correctly identifies a carbon sink and a carbon source?\",[\"Growing forest is a sink; burning fossil fuels is a source\",\"Wildfire is a sink; growing trees are a source\",\"Both are only sinks\",\"Both are only sources\"],0,\"A sink absorbs or stores carbon; a source releases carbon.\"],[\"7.2\",\"A lake receives excess fertilizer; algae bloom and later die. What most directly causes fish suffocation?\",[\"Bacteria decomposing algae use dissolved oxygen\",\"More oxygen is created by bacterial respiration\",\"Phosphorus turns into CO₂\",\"Fish become primary producers\"],0,\"Decomposition consumes dissolved oxygen, creating hypoxic conditions.\"],[\"7.2\",\"Two fish of the same species differ in age. The older fish contains more mercury after long exposure. Which process is illustrated?\",[\"Bioaccumulation\",\"Biomagnification across trophic levels\",\"Nitrogen fixation\",\"Chemosynthesis\"],0,\"Bioaccumulation occurs within an organism over time.\"],[\"7.2\",\"A top predator has more PCB contamination than the small fish it eats. Which process explains the pattern?\",[\"Biomagnification\",\"Condensation\",\"Ammonification\",\"Transpiration\"],0,\"Persistent toxins may increase in concentration at higher trophic levels.\"],[\"7.2\",\"More atmospheric CO₂ dissolves into seawater. Which chemical outcome is associated with ocean acidification?\",[\"Lower pH due to added hydrogen ions\",\"Higher pH because all carbon becomes oxygen\",\"No change in carbonate chemistry\",\"Nitrogen gas becomes phosphate\"],0,\"Dissolved CO₂ shifts carbonate chemistry and lowers pH.\"],[\"7.2\",\"A coral reef experiences unusually warm water and corals lose their symbiotic algae. What is this called?\",[\"Coral bleaching\",\"Biomagnification\",\"Denitrification\",\"Nitrogen fixation\"],0,\"Heat stress can cause corals to expel symbiotic algae and appear white.\"],[\"7.2\",\"Rain becomes more acidic after sulfur dioxide and nitrogen oxides react in the air. What human impact is occurring?\",[\"Acid deposition\",\"Ocean transpiration\",\"Chemical photosynthesis\",\"Phosphorus fixation\"],0,\"SO₂ and nitrogen oxides form acids that can fall with rain.\"],[\"7.2\",\"A wetland near farms is restored and absorbs nutrient-rich runoff before it reaches a lake. What outcome is most likely?\",[\"Lower risk of eutrophication\",\"Higher mandatory biomagnification\",\"More direct nitrogen fixation by fish\",\"All lake bacteria disappear\"],0,\"Wetlands can retain nutrients, reducing the fuel for algal blooms.\"],[\"7.2\",\"After a predator population crashes, an herbivore population expands and overgrazes vegetation. This is an example of what?\",[\"A trophic cascade\",\"Chemosynthesis\",\"Nitrification\",\"Condensation\"],0,\"Predator changes can indirectly alter lower levels of a food web.\"]];\nconst VARIED_WRITTEN=[[\"4.2\",\"WRITTEN RESPONSE — A grassland food web includes grass, grasshoppers, mice, snakes and hawks. A pesticide reduces grasshoppers. Predict two likely consequences and explain the direction of the food-web arrows.\",null,null,\"Explain arrows from food to eater; possible changes in grass, predators, substitute food sources; note that predictions depend on connected feeding relationships.\"],[\"4.3\",\"WRITTEN RESPONSE — Fertilizer reaches a pond during a heat wave. Explain how nitrogen/phosphorus changes can produce an algal bloom, low oxygen and fish deaths.\",null,null,\"Excess nutrients → algal growth → algae die → decomposers respire and consume dissolved oxygen → fish stress/death.\"],[\"4.2\",\"WRITTEN RESPONSE — Compare a pyramid of energy with a pyramid of numbers using one tree and many caterpillars. Explain why one might invert and the other cannot.\",null,null,\"Energy decreases at each transfer; a numbers pyramid can invert when a single tree supports many caterpillars.\"],[\"4.3\",\"WRITTEN RESPONSE — Compare carbon cycling in a growing forest and after a wildfire, explaining sinks, sources and energy flow.\",null,null,\"Photosynthesis takes up atmospheric CO₂ and stores carbon; combustion releases CO₂; energy flows and eventually dissipates.\"],[\"4.3\",\"WRITTEN RESPONSE — Trace one nitrogen atom from atmospheric nitrogen into a rabbit and back to the atmosphere using named cycle processes.\",null,null,\"Fixation → plant uptake/assimilation → eating → waste/death and ammonification → nitrification → denitrification, with correct locations.\"],[\"7.2\",\"WRITTEN RESPONSE — A large predatory fish has high mercury, but a small fish has lower levels. Differentiate bioaccumulation from biomagnification.\",null,null,\"Bioaccumulation builds toxins within one organism over time; biomagnification rises across feeding levels in the food chain.\"],[\"4.3\",\"WRITTEN RESPONSE — Explain the complete movement of water from ocean to cloud to land to groundwater and through a tree, using six vocabulary terms.\",null,null,\"Evaporation, condensation, precipitation, runoff, percolation, collection and transpiration correctly connected.\"],[\"7.2\",\"WRITTEN RESPONSE — Atmospheric CO₂ increases and ocean water warms. Explain two different consequences for coral reefs and distinguish the mechanisms.\",null,null,\"Acidification changes carbonate chemistry and hinders calcification; warming may trigger coral bleaching by loss of symbiotic algae.\"]];\nfunction buildVariedExam(){\nconst grouped={};const all=[...QUESTIONS.slice(0,21),...FRESH_BANKS.flatMap(b=>b.slice(0,21)),...PRACTICE,...VARIED_QUESTIONS];const seen=new Set();for(const q of all){if(!q[2]||seen.has(q[1].trim().toLowerCase()))continue;seen.add(q[1].trim().toLowerCase());(grouped[q[0]]??=[]).push(q)}\nlet used=[];try{used=JSON.parse(localStorage.getItem('biology:used-questions:v2')||'[]')}catch(e){}if(!Array.isArray(used))used=[];\nconst selected=[];const target={'4.1':5,'4.2':5,'4.3':7,'7.2':4};const rand=a=>[...a].sort(()=>Math.random()-.5);for(const [unit,count] of Object.entries(target)){let available=rand(grouped[unit]||[]).sort((a,b)=>(used.includes(a[1])?1:0)-(used.includes(b[1])?1:0));selected.push(...available.slice(0,count))}\nconst nextUsed=[...used,...selected.map(q=>q[1])].slice(-Math.max(21,all.length-21));try{localStorage.setItem('biology:used-questions:v2',JSON.stringify(nextUsed))}catch(e){}\nconst wPool=[...QUESTIONS.slice(21),...FRESH_BANKS.flatMap(b=>b.slice(21)),...VARIED_WRITTEN];let attempts=0;try{attempts=Number(localStorage.getItem('biology:exam-attempts:v2')||0)}catch(e){}const w1=wPool[(attempts*2)%wPool.length],w2=wPool[(attempts*2+1)%wPool.length];try{localStorage.setItem('biology:exam-attempts:v2',String(attempts+1))}catch(e){}return [...selected,...[w1,w2]];\n}\nwindow.buildVariedExam=buildVariedExam;\nfunction startFreshExam(){if(examStarted&&!confirm(\"Restart current exam with fresh questions?\"))return;examRound++;currentExam=buildVariedExam();examStarted=true;exIdx=0;exAnswers={};examOrder=currentExam.map((q,i)=>i);$(\"examNext\").style.display=\"none\";$(\"examStatus\").textContent=\"Fresh test #\"+examRound+\" in progress\";page(\"exam\");showExam();}\nfunction renderWritten(){$('writtenBox').innerHTML=QUESTIONS.slice(21).map((q,i)=>`\u003cdiv class=\"card\">\u003cspan class=\"c ','oxygen|hypoxi']}, {label:'Fish die because of oxygen depletion',terms:['fish','die|death|kill|suffocat|low oxygen|less oxygen']}, {label:'Deforestation reduces uptake of atmospheric CO₂',terms:['tree|forest|deforest','photosynth|absorb|uptake','co2|carbon dioxide|carbon']}, {label:'Matter cycles but energy flows',terms:['matter|carbon|nutrient','cycl|recycl|flow|energy']}]\n];\nconst FRESH_CRITERIA=[\n [\n [{label:'Predict fish response to insect loss',terms:['fish','insect','less|fewer|decrease|decline|food|prey']},{label:'Predict impacts on herons or snails',terms:['heron|snail','less|fewer|decrease|more|increase|feed|prey']},{label:'Explain arrow direction',terms:['arrow','energy|food|eaten|consumer']},{label:'Describe energy losses',terms:['energy','heat|10%|respiration|use']}],\n [{label:'Deforestation and CO₂ uptake',terms:['tree|forest|deforest','photosynth|uptake|absorb','co2|carbon dioxide|carbon']},{label:'Fertilizer adds phosphorus nutrients to water',terms:['fertiliz|phosph|nutrient','lake|runoff|water']},{label:'Bloom and decomposition consume oxygen',terms:['alga|bloom','decompos|bacter|microb','oxygen|hypoxi']},{label:'Fish populations respond',terms:['fish','die|declin|decrease|less|kill']}]\n ],\n [\n [{label:'Fewer mice can reduce snake food',terms:['mice|mouse','snake','less|fewer|declin|decreas|food']},{label:'Second food-web effect',terms:['hawk|grass','declin|decreas|increase|more|less|fewer']},{label:'Correct 10% calculation gives 20 kJ',terms:['20','kj|kilojoule|energy']},{label:'Explain energy transfer across levels',terms:['10%|ten percent|energy','level|producer|consumer|transfer']}],\n [{label:'Define bioaccumulation within one organism',terms:['bioaccumul','organism|individual|within|over time|lifetime']},{label:'Define biomagnification across trophic levels',terms:['biomagnif','trophic|food chain|level|higher']},{label:'Identify osprey as highest concentration',terms:['osprey','highest|most|concentrat|greater']},{label:'Explain eating contaminated prey',terms:['prey|fish|eat|consum','pollut|contamin|persist']}]\n ]\n];\nfunction testTerm(text,alternatives){return alternatives.split('|').some(x=>text.includes(x.toLowerCase()))}\nfunction offlineReview(answer,criteria){let a=(answer||'').toLowerCase().replace(/co₂/g,'co2'),hits=criteria.filter(c=>c.terms.every(t=>testTerm(a,t))),miss=criteria.filter(c=>!c.terms.every(t=>testTerm(a,t)));let reason=/(because|therefore|as a result|which causes|leading to|so that|due to|since|consequently|results in)/i.test(answer);let score=hits.length;let safe=x=>x.replaceAll('&','&amp;').replaceAll('\u003c','&lt;').replaceAll('>','&gt;');return `\u003cdiv class=\"card\">\u003ch3>Instant answer review: ${score}/${criteria.length} key ideas detected\u003c/h3>\u003cp class=\"small\">This is an offline rubric-based checker, NOT a real AI grader. It recognizes several ways of phrasing concepts but may miss correct explanations or reward keywords without full understanding.\u003c/p>\u003cp>${reason?'✅':'⚠️'} ${reason?'You used cause-and-effect language.':'Add clear reasoning using “because,” “therefore,” or “as a result.”'}\u003c/p>\u003cp>\u003cb>Concepts detected:\u003c/b> ${hits.length?hits.map(x=>'✅ '+safe(x.label)).join('\u003cbr>'):'None confidently detected yet.'}\u003c/p>\u003cp>\u003cb>Check or add:\u003c/b> ${miss.length?miss.map(x=>'• '+safe(x.label)).join('\u003cbr>'):'All listed concepts were detected — double-check scientific accuracy!'}\u003c/p>\u003c/div>`}\nfunction criteriaForExam(i){return examRound?currentExam[i][4]:CRITERIA[i-21]}\nfunction gradeExamWriting(i){let target=$('examGrade'+i);if(!exAnswers[i]||!exAnswers[i].trim()){target.innerHTML='\u003cp>Please write an answer before checking it.\u003c/p>';return}target.innerHTML=offlineReview(exAnswers[i],criteriaForExam(i))+`\u003cbutton class=\"btn secondary\" onclick=\"askExamAI(${i})\">Get fuller AI feedback in ChatGPT\u003c/button>`}\nfunction checkWritten(i){$('writtenGrade'+i).innerHTML=offlineReview($('written'+i).value,CRITERIA[i])}\nfunction aiPrompt(q,a,rubric){return 'Please grade this biology written response as a high-school teacher would. Do not give points for keywords alone. Check scientific accuracy, whether each requested idea is explained, and cause-and-effect reasoning. Give an estimated score out of 5, specific missing ideas, and a concise improved student-style answer.\\n\\nQUESTION:\\n'+q+'\\n\\nEXPECTED CONCEPTS:\\n'+rubric+'\\n\\nMY ANSWER:\\n'+a}\nfunction useChatGPT(prompt){navigator.clipboard?.writeText(prompt).then(()=>alert('Question, rubric, and answer copied! Paste into ChatGPT for genuine AI grading.')).catch(()=>alert('Clipboard unavailable. Copy your answer manually.'));window.open('https://chatgpt.com/','_blank','noopener,noreferrer')}\nfunction askRealAI(i){let q=QUESTIONS[21+i],a=$('written'+i).value;if(!a.trim()){alert('Write your answer first.');return}useChatGPT(aiPrompt(q[1],a,q[4]))}\nfunction askExamAI(i){let q=currentExam[i],a=exAnswers[i]||'';if(!a.trim()){alert('Write your answer first.');return}useChatGPT(aiPrompt(q[1],a,q[4]))}\n\n$('pyramid').innerHTML=`\u003csvg class=\"diagram\" viewBox=\"0 0 570 285\" role=\"img\" aria-label=\"Energy pyramid showing 10000 kJ producers, 1000 kJ primary consumers, 100 kJ secondary consumers, 10 kJ tertiary consumers\">\u003cpolygon points=\"285,20 255,75 315,75\" fill=\"#dc6d61\"/>\u003cpolygon points=\"255,81 215,137 355,137 315,81\" fill=\"#edb66e\"/>\u003cpolygon points=\"215,143 175,204 395,204 355,143\" fill=\"#7eb4c5\"/>\u003cpolygon points=\"175,210 130,270 440,270 395,210\" fill=\"#67b68e\"/>\u003cg fill=\"#15213a\" font-size=\"14\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"700\">\u003ctext x=\"285\" y=\"63\">10 kJ\u003c/text>\u003ctext x=\"285\" y=\"115\">100 kJ\u003c/text>\u003ctext x=\"285\" y=\"176\">1,000 kJ\u003c/text>\u003ctext x=\"285\" y=\"247\">10,000 kJ\u003c/text>\u003c/g>\u003cg fill=\"#142334\" font-size=\"12\" font-family=\"system-ui\">\u003ctext x=\"325\" y=\"43\">Tertiary\u003c/text>\u003ctext x=\"366\" y=\"106\">Secondary\u003c/text>\u003ctext x=\"405\" y=\"170\">Primary\u003c/text>\u003ctext x=\"445\" y=\"243\">Producers\u003c/text>\u003c/g>\u003c/svg>`;renderNotes();resetFlash();startPractice();renderWritten();updateDashboard();\n\n// Ecosystem Lab is a scenario learning model; its numeric population changes are illustrative.\nconst LAB_Q=[\n {id:'web',topic:'4.2',q:'In a food web, what does the arrow grass → rabbit tell you?',opts:['Grass eats the rabbit','Energy and matter pass from grass to rabbit','The rabbit produces energy','The arrow measures population size'],a:1,why:'Food-web arrows point from the organism being eaten to the consumer, showing transfer of matter and energy.',where:'11 - Lecture 4.2.pptx — food webs section; Chapter 4 review presentation — 4.2'},\n {id:'energy',topic:'4.2',q:'If producers contain 80,000 kJ, how much energy reaches secondary consumers using the 10% rule?',opts:['8,000 kJ','80 kJ','800 kJ','80,000 kJ'],a:2,why:'Two transfers occur: 80,000 → 8,000 (primary) → 800 kJ (secondary).',where:'11 - Lecture 4.2.pptx — energy pyramids; Chapter 4 review presentation — 4.2'},\n {id:'cycles',topic:'4.3',q:'Which statement BEST explains why matter cycles but energy does not?',opts:['Both matter and energy are repeatedly recycled without loss','Atoms are reused while usable energy ultimately dissipates as heat','Energy is created by decomposers','Matter disappears when organisms respire'],a:1,why:'Matter moves between organisms and their environment, but usable energy decreases through successive transfers and is ultimately dissipated as heat.',where:'Chapter 4 review presentation — 4.3; 11 - Lecture 4.2.pptx — energy loss'},\n {id:'human',topic:'7.2',q:'A lake receives excess fertilizer. What chain of events BEST explains fish deaths?',opts:['Runoff → algal bloom → decomposition → oxygen drops','Runoff → higher oxygen forever → fish die','Runoff → less algae → fish die','Runoff → algae convert oxygen to nitrogen gas'],a:0,why:'Nutrient pollution fuels blooms. When algae die, decomposers consume dissolved oxygen, potentially causing hypoxia.',where:'Chapter 4 test topics — 7.2 eutrophication; textbook Lesson 7.2'},\n {id:'carbon',topic:'4.3',q:'If plant photosynthesis increases while other processes stay constant, what happens to atmospheric CO₂?',opts:['It generally increases','It generally decreases','It cannot change','It becomes atmospheric nitrogen'],a:1,why:'Photosynthesis takes carbon dioxide from the air and incorporates carbon into organic molecules.',where:'Chapter 4 review presentation — 4.3 carbon cycle'},\n {id:'bio',topic:'7.2',q:'A hawk has more mercury per kilogram than the fish it eats. This pattern across trophic levels is…',opts:['Nitrogen fixation','Biomagnification','Chemosynthesis','Biomass production'],a:1,why:'Biomagnification is higher pollutant concentration at higher trophic levels; bioaccumulation is buildup within an organism over time.',where:'Chapter 4 review presentation — 7.2 biomagnification'}\n];\nlet labProgress={xp:0,done:[],missed:[],mission:0};try{labProgress={...labProgress,...JSON.parse(localStorage.getItem('biology-lab-v1')||'{}')}}catch(e){}\nlet labChoiceLocked=false,labReviewMode=false;\nfunction labSave(){try{localStorage.setItem('biology-lab-v1',JSON.stringify(labProgress))}catch(e){}labHeader();labVault()}\nfunction labAward(key,xp=35){if(!labProgress.done.includes(key)){labProgress.done.push(key);labProgress.xp+=xp;labSave()}}\nfunction labMiss(id){if(!labProgress.missed.includes(id)){labProgress.missed.push(id);labSave()}}\nfunction labClear(id){labProgress.missed=labProgress.missed.filter(x=>x!==id);labSave()}\nfunction labHeader(){let n=labProgress.done.length;$('labLevel').textContent='Mission '+(labProgress.mission+1)+' / 4';$('labPoints').textContent=labProgress.xp+' XP';$('labBadge').textContent=n>=8?'🏆 Ecosystem Architect':n>=4?'🔬 Field Scientist':'🌱 Apprentice';$('labProgress').style.width=Math.min(100,n/9*100)+'%';document.querySelectorAll('.lab-tabs button').forEach(x=>x.classList.toggle('active',Number(x.dataset.mission)===labProgress.mission))}\nfunction labGo(n){labProgress.mission=n;labChoiceLocked=false;labSave();labRender();$('labStage').scrollIntoView({block:'start',behavior:'smooth'})}\ndocument.querySelectorAll('.lab-tabs button').forEach(b=>b.onclick=()=>labGo(Number(b.dataset.mission)));\nfunction labRender(){labHeader();if(labProgress.mission===0)labFood();if(labProgress.mission===1)labEnergy();if(labProgress.mission===2)labCarbon();if(labProgress.mission===3)labCourt();}\nfunction labFood(){let h=`\u003cdiv class=\"card\">\u003cspan class=\"chip\">MISSION 1 · 4.2 ENERGY FLOW\u003c/span>\u003ch2>🌾 Food-web chaos\u003c/h2>\u003cp>You are the ecosystem manager. Remove some frogs and predict how the rest of the habitat responds. First, study the arrows: they always point \u003cb>from food to consumer\u003c/b>.\u003c/p>\u003cdiv class=\"mission-grid\">\u003cdiv class=\"eco-panel\">\u003csvg class=\"eco-visual\" viewBox=\"0 0 420 270\" role=\"img\" aria-label=\"Food web: grass to insect and rabbit; insect to frog; frog and rabbit to snake; snake to hawk\">\u003cdefs>\u003cmarker id=\"ecoArrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\">\u003cpath d=\"M0,0 L0,6 L8,3 z\" fill=\"#245c61\"/>\u003c/marker>\u003c/defs>\u003cg stroke=\"#245c61\" stroke-width=\"3\" marker-end=\"url(#ecoArrow)\">\u003cpath d=\"M75 225 L155 155\"/>\u003cpath d=\"M75 225 L275 150\"/>\u003cpath d=\"M155 140 L215 77\"/>\u003cpath d=\"M215 77 L340 80\"/>\u003cpath d=\"M275 135 L340 80\"/>\u003cpath d=\"M340 65 L362 30\"/>\u003c/g>\u003cg font-size=\"15\" fill=\"#17383d\" font-family=\"system-ui\" font-weight=\"700\" text-anchor=\"middle\">\u003ctext x=\"76\" y=\"246\">🌿 Grass\u003c/text>\u003ctext x=\"155\" y=\"146\">🦗 Insect\u003c/text>\u003ctext x=\"215\" y=\"69\">🐸 Frog\u003c/text>\u003ctext x=\"275\" y=\"157\">🐇 Rabbit\u003c/text>\u003ctext x=\"341\" y=\"64\">🐍 Snake\u003c/text>\u003ctext x=\"366\" y=\"22\">🦅 Hawk\u003c/text>\u003c/g>\u003c/svg>\u003cp class=\"lab-science-note\">Illustrative web: grass → insects → frogs → snakes → hawks; grass → rabbits → snakes.\u003c/p>\u003clabel for=\"frogSlide\">\u003cb>Frog population remaining: \u003cspan id=\"frogValue\">100\u003c/span>%\u003c/b>\u003c/label>\u003cinput aria-label=\"Percent of frog population remaining\" class=\"eco-range\" id=\"frogSlide\" type=\"range\" min=\"0\" max=\"100\" value=\"100\" step=\"10\" oninput=\"labChangeFrog(this.value)\"/>\u003cdiv id=\"foodNumbers\">\u003c/div>\u003c/div>\u003cdiv class=\"eco-panel\">\u003ch3>Make a scientific prediction\u003c/h3>\u003cp>If frogs drop sharply, which two populations are most likely to be affected first, assuming other conditions stay the same?\u003c/p>\u003cdiv id=\"foodChoices\">\u003cbutton class=\"lab-choice\" onclick=\"labFoodAnswer(0)\">Insects increase; snakes may decrease\u003c/button>\u003cbutton class=\"lab-choice\" onclick=\"labFoodAnswer(1)\">Insects decrease; snakes increase\u003c/button>\u003cbutton class=\"lab-choice\" onclick=\"labFoodAnswer(2)\">Plants become carnivores\u003c/button>\u003c/div>\u003cdiv id=\"foodFeedback\">\u003c/div>\u003cdiv class=\"lab-story\">🔎 \u003cb>Scientists think in chains:\u003c/b> fewer predators → less predation on prey; fewer prey → less food for their predators.\u003c/div>\u003cbutton class=\"btn secondary\" onclick=\"labGo(1)\">Next mission →\u003c/button>\u003c/div>\u003c/div>\u003c/div>`;$('labStage').innerHTML=h;labChangeFrog(100)}\nfunction labChangeFrog(v){let d=100-Number(v);$('frogValue').textContent=v;const insects=Math.round(100+d*.5),snakes=Math.round(100-d*.35),grass=Math.max(20,Math.round(100-(insects-100)*.25));$('foodNumbers').innerHTML=`\u003cdiv class=\"eco-nodes\">\u003cdiv class=\"eco-node\">🦗\u003cb>${insects}\u003c/b>\u003csmall>Insects index\u003c/small>\u003c/div>\u003cdiv class=\"eco-node\">🐍\u003cb>${snakes}\u003c/b>\u003csmall>Snakes index\u003c/small>\u003c/div>\u003cdiv class=\"eco-node\">🌿\u003cb>${grass}\u003c/b>\u003csmall>Grass index\u003c/small>\u003c/div>\u003c/div>\u003cp class=\"lab-science-note\">Hypothetical directional indices, not measured or predicted populations. Real food webs involve additional species and feedback.\u003c/p>`}\nfunction labFoodAnswer(i){if(labChoiceLocked)return;labChoiceLocked=true;document.querySelectorAll('#foodChoices button').forEach(b=>b.disabled=true);let ok=i===0;$('foodFeedback').innerHTML=`\u003cdiv class=\"${ok?'lab-success':'lab-error'}\">\u003cb>${ok?'Exactly!':'Good attempt — examine who eats whom.'}\u003c/b>\u003cp>With fewer frogs, insects face less predation and may increase. Snakes may have less food and decline. Other effects depend on alternatives in the food web.\u003c/p>\u003cp>\u003cb>Review:\u003c/b> 11 - Lecture 4.2.pptx — food web slides.\u003c/p>\u003c/div>`;if(ok){labAward('food',50);labClear('web')}else{labMiss('web');labAward('food-attempt',10)}}\nfunction labEnergy(){let v=50000;let h=`\u003cdiv class=\"card\">\u003cspan class=\"chip\">MISSION 2 · 4.2 ECOLOGICAL PYRAMIDS\u003c/span>\u003ch2>⚡ The energy vault\u003c/h2>\u003cp>Design an energy pyramid. Choose the producer energy, then calculate what reaches a higher trophic level. Only about 10% is transferred at each step.\u003c/p>\u003cdiv class=\"mission-grid\">\u003cdiv class=\"eco-panel\">\u003clabel>\u003cb>Energy in producers\u003c/b> \u003cselect id=\"baseEnergy\" onchange=\"labEnergyDraw()\">\u003coption value=\"50000\">50,000 kJ\u003c/option>\u003coption value=\"120000\">120,000 kJ\u003c/option>\u003coption value=\"8000\">8,000 kJ\u003c/option>\u003c/select>\u003c/label>\u003cdiv id=\"energyStack\">\u003c/div>\u003cp class=\"lab-science-note\">The 10% rule is an approximation; real efficiency varies.\u003c/p>\u003c/div>\u003cdiv class=\"eco-panel\">\u003ch3>Unlock the vault\u003c/h3>\u003cp>What is the energy available to \u003cb>secondary consumers\u003c/b>?\u003c/p>\u003cinput id=\"energyInput\" type=\"number\" min=\"0\" placeholder=\"Enter energy in kJ\" style=\"padding:13px;background:#203750;color:white;border:1px solid #608090;border-radius:10px;width:100%;font:inherit\"/>\u003cdiv class=\"controls\">\u003cbutton class=\"btn\" onclick=\"labCheckEnergy()\">Check my calculation\u003c/button>\u003cbutton class=\"btn secondary\" onclick=\"labEnergyHint()\">Hint\u003c/button>\u003c/div>\u003cdiv id=\"energyFeedback\">\u003c/div>\u003cbutton class=\"btn secondary\" onclick=\"labGo(2)\">Next mission →\u003c/button>\u003c/div>\u003c/div>\u003c/div>`;$('labStage').innerHTML=h;labEnergyDraw()}\nfunction labEnergyDraw(){let v=Number($('baseEnergy').value),n=['Tertiary consumers','Secondary consumers','Primary consumers','Producers'],vals=[v/1000,v/100,v/10,v];$('energyStack').innerHTML='\u003cdiv style=\"display:grid;gap:5px;margin-top:18px\">'+n.map((x,i)=>`\u003cdiv style=\"margin:auto;width:${30+i*23}%;min-width:170px;max-width:100%;padding:12px 7px;text-align:center;background:${['#c56b6b','#d8a45c','#4f97ae','#4d9c75'][i]};color:#081f26;font-weight:800;border-radius:6px\">${x}\u003cbr>${vals[i].toLocaleString()} kJ\u003c/div>`).join('')+'\u003c/div>';$('energyFeedback').innerHTML=''}\nfunction labCheckEnergy(){let expected=Number($('baseEnergy').value)/100,got=Number($('energyInput').value);if(!$('energyInput').value){$('energyFeedback').innerHTML='\u003cdiv class=\"lab-error\">Enter a number first.\u003c/div>';return}let ok=Math.abs(got-expected)\u003c.01;$('energyFeedback').innerHTML=`\u003cdiv class=\"${ok?'lab-success':'lab-error'}\">\u003cb>${ok?'Vault unlocked! 🔓':'Not quite — track each transfer.'}\u003c/b>\u003cp>Producers: ${Number($('baseEnergy').value).toLocaleString()} kJ → primary: ${(expected*10).toLocaleString()} kJ → secondary: ${expected.toLocaleString()} kJ. ${ok?'You correctly applied the 10% rule twice.':'You may have stopped at primary consumers or counted one transfer too many.'}\u003c/p>\u003cp>Review: 11 - Lecture 4.2.pptx — energy pyramid and 10% rule.\u003c/p>\u003c/div>`;if(ok){labAward('energy',50);labClear('energy')}else labMiss('energy')}\nfunction labEnergyHint(){$('energyFeedback').innerHTML='\u003cdiv class=\"feedback\">Multiply by 0.1 once to reach primary consumers, then multiply by 0.1 again to reach secondary consumers.\u003c/div>'}\nfunction labCarbon(){let s=`\u003cdiv class=\"card\">\u003cspan class=\"chip\">MISSION 3 · 4.3 CYCLES OF MATTER + 7.2 HUMAN IMPACTS\u003c/span>\u003ch2>🌎 Cycle detective\u003c/h2>\u003cp>Move the sliders to explore how photosynthesis, respiration, and fossil-fuel emissions affect the \u003ci>direction\u003c/i> of atmospheric carbon change. This is a simplified balance-of-flows model.\u003c/p>\u003cdiv class=\"mission-grid\">\u003cdiv class=\"eco-panel\">\u003cdiv class=\"lab-co2\">\u003cdiv>\u003cdiv id=\"co2bar\" class=\"bar\" style=\"height:95px\">CO₂\u003c/div>\u003csmall>Relative level\u003c/small>\u003c/div>\u003c/div>\u003clabel>🌿 Photosynthesis uptake: \u003cb id=\"uptakeVal\">50\u003c/b>\u003cinput class=\"eco-range\" id=\"coUptake\" type=\"range\" value=\"50\" min=\"0\" max=\"100\" oninput=\"labCarbonDraw()\"/>\u003c/label>\u003clabel>🫁 Respiration + decomposition release: \u003cb id=\"respVal\">50\u003c/b>\u003cinput class=\"eco-range\" id=\"coResp\" type=\"range\" value=\"50\" min=\"0\" max=\"100\" oninput=\"labCarbonDraw()\"/>\u003c/label>\u003clabel>🏭 Fossil fuel release: \u003cb id=\"fuelVal\">20\u003c/b>\u003cinput class=\"eco-range\" id=\"coFuel\" type=\"range\" value=\"20\" min=\"0\" max=\"100\" oninput=\"labCarbonDraw()\"/>\u003c/label>\u003cp id=\"carbonTrend\" class=\"lab-eq\">\u003c/p>\u003cp class=\"lab-science-note\">Not an actual carbon-cycle simulation; units are relative, with omitted processes such as ocean exchange.\u003c/p>\u003c/div>\u003cdiv class=\"eco-panel\">\u003ch3>Follow one carbon atom\u003c/h3>\u003cp>Choose the correct next step: An atmospheric CO₂ molecule is taken up by a plant.\u003c/p>\u003cdiv id=\"carbonChoices\">\u003cbutton class=\"lab-choice\" onclick=\"labCarbonAnswer(0)\">It becomes part of sugar through photosynthesis\u003c/button>\u003cbutton class=\"lab-choice\" onclick=\"labCarbonAnswer(1)\">It instantly becomes nitrogen gas\u003c/button>\u003cbutton class=\"lab-choice\" onclick=\"labCarbonAnswer(2)\">It permanently disappears from the ecosystem\u003c/button>\u003c/div>\u003cdiv id=\"carbonFeedback\">\u003c/div>\u003cdiv class=\"lab-trail\">\u003cspan class=\"lab-chip\">Atmosphere CO₂\u003c/span>→\u003cspan class=\"lab-chip\">Plant sugar\u003c/span>→\u003cspan class=\"lab-chip\">Animal\u003c/span>→\u003cspan class=\"lab-chip\">Respiration / decomposition\u003c/span>→\u003cspan class=\"lab-chip\">Atmosphere CO₂\u003c/span>\u003c/div>\u003cp class=\"lab-science-note\">Matter cycles through these processes; energy transfers and eventually dissipates as heat.\u003c/p>\u003cbutton class=\"btn secondary\" onclick=\"labGo(3)\">Next mission →\u003c/button>\u003c/div>\u003c/div>\u003c/div>`;$('labStage').innerHTML=s;labCarbonDraw()}\nfunction labCarbonDraw(){let p=Number($('coUptake').value),r=Number($('coResp').value),f=Number($('coFuel').value),net=r+f-p;['uptakeVal','respVal','fuelVal'].forEach((id,i)=>$(id).textContent=[p,r,f][i]);$('co2bar').style.height=(80+Math.min(65,Math.max(-50,net))*0.8)+'px';$('carbonTrend').textContent='Net atmospheric CO₂ trend: '+(net>0?'↑ Increase':net\u003c0?'↓ Decrease':'→ Roughly balanced');}\nfunction labCarbonAnswer(i){if(labChoiceLocked)return;labChoiceLocked=true;document.querySelectorAll('#carbonChoices button').forEach(x=>x.disabled=true);let ok=i===0;$('carbonFeedback').innerHTML=`\u003cdiv class=\"${ok?'lab-success':'lab-error'}\">\u003cb>${ok?'Carbon traced!':'Carbon is conserved.'}\u003c/b>\u003cp>Photosynthesis incorporates CO₂ carbon into sugars. Consumption moves carbon through food webs, while respiration and decomposition return carbon to the environment.\u003c/p>\u003cp>Review: Chapter 4 review presentation — carbon cycle.\u003c/p>\u003c/div>`;if(ok){labAward('carbon',50);labClear('carbon')}else labMiss('carbon')}\nconst COURT=[{id:'cycles',claim:'“Energy is recycled through a food web, just like matter.”',valid:false,why:'Matter cycles because atoms are reused; energy moves through trophic levels, and much eventually becomes heat.',where:'Chapter 4 review — matter versus energy'}, {id:'bio',claim:'“A bird can have a higher concentration of a persistent pollutant than the fish it eats because of biomagnification.”',valid:true,why:'Persistent pollutants may become more concentrated at successive higher trophic levels.',where:'Chapter 4 review — 7.2 human impacts'}, {id:'human',claim:'“A fertilizer-driven algal bloom may reduce dissolved oxygen when dead algae are decomposed.”',valid:true,why:'Bacteria consume dissolved oxygen while breaking down dead algae, causing hypoxia in severe eutrophication.',where:'Chapter 4 test guide — 7.2 eutrophication'}, {id:'carbon',claim:'“When photosynthesis removes CO₂ from air, the carbon atoms vanish from the ecosystem.”',valid:false,why:'Photosynthesis rearranges atoms into organic compounds. Carbon is transferred, not destroyed.',where:'Chapter 4 review — 4.3 carbon cycle'}];let courtAt=0;\nfunction labCourt(){courtAt=0;labCourtDraw()}\nfunction labCourtDraw(){let item=COURT[courtAt];$('labStage').innerHTML=`\u003cdiv class=\"card\">\u003cspan class=\"chip\">MISSION 4 · SCIENTIFIC REASONING\u003c/span>\u003ch2>⚖️ Science courtroom\u003c/h2>\u003cp>Decide whether each claim is scientifically defensible, then read the evidence. This mission practices correcting misconceptions just like your teacher's assessments.\u003c/p>\u003cdiv class=\"lab-story\">\u003cb>Claim ${courtAt+1} of ${COURT.length}\u003c/b>\u003ch3>${item.claim}\u003c/h3>\u003c/div>\u003cdiv class=\"controls\">\u003cbutton id=\"courtY\" class=\"btn\" onclick=\"labCourtAnswer(true)\">✅ Defensible\u003c/button>\u003c utotrophs vs. heterotrophs\", \"lesson\": \"4.1\", \"q\": \"A deep-sea bacterium makes its own sugars using chemical energy instead of sunlight. Is it an autotroph or heterotroph, and why?\", \"hint\": [\"Does the organism make its own organic food or eat another organism?\", \"Which type of producer uses chemical reactions rather than sunlight?\"], \"groups\": [[\"autotroph\", \"producer\", \"makes its own\", \"own food\"], [\"chemosynth\", \"chemical\", \"inorganic\"]], \"answer\": \"It is a chemosynthetic autotroph. It builds organic molecules using energy from chemical reactions rather than sunlight.\", \"review\": \"10 - 4.1 Lecture Energy, Consumers, Producers and QL.pptx — producers and chemosynthesis.\"}, {\"id\": \"consumers\", \"title\": \"Detritivores vs. decomposers\", \"lesson\": \"4.1\", \"q\": \"Earthworms eat dead leaf fragments, while fungi release enzymes that chemically break them down. How are their roles different?\", \"hint\": [\"Which organism ingests pieces of detritus?\", \"Which organism chemically breaks matter into simpler substances outside its body?\"], \"groups\": [[\"earthworm\", \"worm\", \"detritivore\", \"ingest\", \"eats\"], [\"fung\", \"decompos\", \"enzym\", \"chemical\", \"break down\"]], \"answer\": \"Earthworms are detritivores that ingest dead organic matter. Fungi are decomposers that chemically break matter down with enzymes; both help recycle matter.\", \"review\": \"10 - 4.1 Lecture — consumers; Chapter 4 review presentation — decomposers and detritivores.\"}, {\"id\": \"web\", \"title\": \"Food-web arrows & ripple effects\", \"lesson\": \"4.2\", \"q\": \"In a chain grass → grasshopper → frog → snake, frogs become scarce. Predict two likely population effects and explain why.\", \"hint\": [\"Which organism has fewer predators when frogs decline?\", \"Which organism loses frogs as food?\"], \"groups\": [[\"grasshopper\", \"insect\", \"prey\"], [\"snake\", \"predator\", \"food\"]], \"answer\": \"Grasshoppers may increase because fewer frogs eat them. Snakes may decline because frogs are one of their food sources. Food-web arrows point from food toward its consumer.\", \"review\": \"11 - Lecture 4.2.pptx — food webs and population predictions.\"}, {\"id\": \"ten\", \"title\": \"The 10% energy rule\", \"lesson\": \"4.2\", \"q\": \"Producers store 80,000 kJ. How much energy is available to secondary consumers, and why?\", \"hint\": [\"First calculate 10% for primary consumers.\", \"Now take 10% again for secondary consumers.\"], \"groups\": [[\"800\", \"eight hundred\"], [\"10%\", \"ten percent\", \"0.1\", \"10 percent\", \"two transfers\", \"each level\"]], \"answer\": \"About 800 kJ: 80,000 kJ in producers → 8,000 kJ in primary consumers → 800 kJ in secondary consumers. Roughly 10% transfers at each step.\", \"review\": \"11 - Lecture 4.2.pptx — energy pyramid and 10% rule.\"}, {\"id\": \"pyramids\", \"title\": \"The three ecological pyramids\", \"lesson\": \"4.2\", \"q\": \"Why must an energy pyramid decrease upward, while a pyramid of numbers can be inverted?\", \"hint\": [\"Energy is used and lost as heat between trophic levels.\", \"Can one very large tree support many small insects?\"], \"groups\": [[\"energy\", \"heat\", \"loss\", \"transfer\", \"10%\"], [\"tree\", \"inverted\", \"number\", \"many insects\", \"organisms\"]], \"answer\": \"Energy decreases at each transfer, so energy pyramids are always upright. A single tree can support many insects, allowing a pyramid of numbers to be inverted.\", \"review\": \"11 - Lecture 4.2.pptx — pyramids of energy, biomass, and numbers.\"}, {\"id\": \"matter\", \"title\": \"Matter cycles, energy flows\", \"lesson\": \"4.2 / 4.3\", \"q\": \"A student says: “Energy and matter are both recycled through the ecosystem.” What part is incorrect?\", \"hint\": [\"Are carbon atoms destroyed when a plant is eaten?\", \"What ultimately happens to usable energy during metabolism?\"], \"groups\": [[\"matter\", \"atom\", \"cycle\", \"recycl\"], [\"energy\", \"heat\", \"flow\", \"one direction\", \"not recycl\"]], \"answer\": \"Matter cycles because atoms are rearranged and reused. Energy flows through food webs, and much is dispersed as heat rather than recycled into usable energy.\", \"review\": \"11 - Lecture 4.2.pptx — where energy goes; Chapter 4 review — matter vs. energy.\"}, {\"id\": \"carbon\", \"title\": \"Carbon cycle and CO₂ changes\", \"lesson\": \"4.3\", \"q\": \"A forest is cleared and burned. Explain two reasons this can increase atmospheric CO₂.\", \"hint\": [\"What gas does burning plant biomass release?\", \"What process removes CO₂ from the air when trees are growing?\"], \"groups\": [[\"burn\", \"combust\", \"fire\", \"respiration\", \"release\"], [\"photosynth\", \"fewer tree\", \"less uptake\", \"absorb\"]], \"answer\": \"Burning releases carbon stored in plants as CO₂. Removing trees also reduces photosynthetic uptake of atmospheric CO₂.\", \"review\": \"What you should know... Chapter 4.pptx — carbon cycle; textbook Lesson 4.3.\"}, {\"id\": \"nitrogen\", \"title\": \"Nitrogen fixation vs. denitrification\", \"lesson\": \"4.3\", \"q\": \"How do nitrogen-fixing bacteria and denitrifying bacteria move nitrogen in opposite directions?\", \"hint\": [\"What form of nitrogen gas is present in the atmosphere?\", \"Which process sends nitrogen back into the atmosphere?\"], \"groups\": [[\"fix\", \"air\", \"n2\", \"nitrogen gas\", \"ammonia\", \"ammonium\"], [\"denitrif\", \"nitrate\", \"atmosphere\", \"back\"]], \"answer\": \"Nitrogen fixation converts atmospheric N₂ into biologically available nitrogen compounds. Denitrification converts nitrates into N₂ gas and returns it to the atmosphere.\", \"review\": \"What you should know... Chapter 4.pptx — nitrogen cycle steps.\"}, {\"id\": \"phosphorus\", \"title\": \"Why phosphorus is different\", \"lesson\": \"4.3\", \"q\": \"Why does phosphorus usually move through ecosystems more slowly than carbon and nitrogen?\", \"hint\": [\"Where does much phosphorus enter soil from?\", \"Does its main cycle involve a significant gaseous atmospheric phase?\"], \"groups\": [[\"rock\", \"weather\", \"sediment\"], [\"no atmos\", \"no gas\", \"no gaseous\", \"not atmosphere\", \"slow\"]], \"answer\": \"Phosphorus is released mainly by weathering of rocks and moves through soil, water, and organisms. It lacks a major gaseous atmospheric phase, making the cycle relatively slow.\", \"review\": \"What you should know... Chapter 4.pptx — phosphorus cycle.\"}, {\"id\": \"eutro\", \"title\": \"Eutrophication\", \"lesson\": \"7.2\", \"q\": \"Fertilizer runoff causes a huge algal bloom; later fish die. Explain the steps linking these events.\", \"hint\": [\"What do nitrogen and phosphorus from fertilizer do to algal growth?\", \"When the algae die, what do decomposer bacteria use while breaking them down?\"], \"groups\": [[\"fertiliz\", \"nutrient\", \"nitrogen\", \"phosphor\", \"algal bloom\", \"algae\"], [\"oxygen\", \"decompos\", \"bacteria\", \"hypoxi\"]], \"answer\": \"Excess nutrients cause an algal bloom. When the algae die, decomposers use dissolved oxygen, potentially causing hypoxia that kills fish.\", \"review\": \"What you should know... Chapter 4.pptx — 7.2 test objectives, eutrophication.\"}, {\"id\": \"acid\", \"title\": \"Ocean acidification\", \"lesson\": \"7.2\", \"q\": \"How can increasing atmospheric CO₂ make it harder for marine organisms to build calcium carbonate shells?\", \"hint\": [\"What happens when seawater absorbs extra CO₂?\", \"What happens to pH and carbonate ion availability?\"], \"groups\": [[\"co2\", \"carbon dioxide\", \"carbonic acid\"], [\"ph\", \"acid\", \"hydrogen\", \"carbonate\", \"shell\"]], \"answer\": \"Absorbed CO₂ reacts in seawater, increasing hydrogen ions and decreasing pH; it also reduces carbonate ion availability, making calcium carbonate shells harder to build.\", \"review\": \"What you should know... Chapter 4.pptx — ocean acidification; Lesson 7.2.\"}, {\"id\": \"bio\", \"title\": (endpoint)){$('aiAnswer').textContent='Enter your deployed Worker URL first.';return}if(!question){$('aiAnswer').textContent='Type a question or written response first.';return}const btn=$('aiSendBtn');btn.disabled=true;$('aiAnswer').textContent='Getting a response…';try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:$('aiMode').value,text:question})});const data=await response.json();if(!response.ok)throw Error(data.error||'AI service unavailable');$('aiAnswer').textContent=data.answer||'No reply returned.'}catch(e){$('aiAnswer').textContent='Could not reach AI: '+e.message+' (Your offline study tools still work.)'}finally{btn.disabled=false}}\ntry{$('aiEndpoint').value=localStorage.getItem('ch4_worker_url')||''}catch(e){}\n\u003c/script>\u003cscript>(()=>{\n'use strict';\nconst by=id=>document.getElementById(id), R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choose=a=>a[R(0,a.length-1)],mix=a=>[...a].sort(()=>Math.random()-.5);\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst source={'4.1':'10 - 4.1 Lecture Energy, Consumers, Producers and QL.pptx','4.2':'11 - Lecture 4.2.pptx','4.3':'What you should know... Chapter 4.pptx (matter cycles)','7.2':'What you should know... Chapter 4.pptx (human impacts)'};\nconst cases=[\n['4.1',()=>{let x=choose(['algae in a pond','a maple tree','grass','cyanobacteria']);return ['Why is '+x+' classified as a producer?',['It builds its own organic food using external energy.','It consumes animals to obtain food.','It can never perform cellular respiration.','It breaks down carcasses to obtain food.'],0,'Autotrophs use external energy to build organic compounds.'];}],\n['4.1',()=>{let x=choose(['deep-sea vent','dark sulfur-rich cave','sunlight-free hydrothermal spring']);return ['Bacteria at a '+x+' make sugars using inorganic chemical reactions. Which process is occurring?',['Photosynthesis','Chemosynthesis','Biomagnification','Denitrification'],1,'Chemosynthetic autotrophs use chemical energy rather than sunlight.'];}],\n['4.1',()=>{let a=choose([['rabbit eats grass','herbivore'],['fox eats a rabbit','carnivore'],['bear eats berries and fish','omnivore'],['vulture eats a carcass','scavenger'],['earthworm ingests dead leaves','detritivore'],['fungus releases enzymes onto a log','decomposer']]);return ['An organism '+a[0]+'. What BEST describes it?',[a[1],...mix(['producer','carnivore','herbivore','scavenger','detritivore','decomposer','omnivore'].filter(z=>z!==a[1])).slice(0,3)],0,'Food source and how it is consumed identify each consumer group. Decomposers use enzymes; detritivores ingest particles.'];}],\n['4.2',()=>{let n=choose([10000,20000,40000,50000,80000,100000]),level=R(1,3),x=n/10**level;return ['A food chain starts with '+n.toLocaleString()+' kJ in producers. Using the 10% rule, how much reaches '+['primary','secondary','tertiary'][level-1]+' consumers?',[x.toLocaleString()+' kJ',(x*10).toLocaleString()+' kJ',(x/10).toLocaleString()+' kJ',(n*.9).toLocaleString()+' kJ'],0,'Transfer about 10% per trophic step: '+n.toLocaleString()+' / 10^'+level+' = '+x.toLocaleString()+' kJ.'];}],\n['4.2',()=>{let [a,b]=choose([['grass','grasshopper'],['algae','snail'],['insect','frog'],['mouse','snake'],['rabbit','fox']]);return ['In a food web, the arrow '+a+' → '+b+' means what?',['Energy flows from '+b+' to '+a+'.','Energy flows from '+a+' to '+b+'.','The '+b+' makes food for '+a+'.','Neither matter nor energy moves.'],1,'Arrows point from food to the organism that eats it, showing energy transfer.'];}],\n['4.2',()=>{let [a,b,c]=choose([['grass','grasshoppers','frogs'],['algae','snails','fish'],['plants','rabbits','foxes']]),down=R(0,1)===1;return ['In a simplified chain '+a+' → '+b+' → '+c+', the '+c+' population '+(down?'decreases':'increases')+'. All else equal, what might happen to '+b+'?',['It immediately becomes a producer.','It must stay exactly the same.','It may '+(down?'increase':'decrease')+'.','The '+a+' population must disappear.'],2,'Fewer predators may allow prey to increase; more predators may reduce prey. Real food webs are more complicated.'];}],\n['4.2',()=>{let t=choose(['energy','biomass','numbers']),d={energy:'Energy available at each trophic level',biomass:'Dry organic mass at each trophic level',numbers:'Number of organisms at each trophic level'};return ['What does a pyramid of '+t+' show?',[d[t],...Object.entries(d).filter(x=>x[0]!==t).map(x=>x[1]),'The number of habitats in a region'],0,'Energy pyramids always decrease upward; biomass and number pyramids can be inverted.'];}],\n['4.2',()=>['Which statement about matter and energy in an ecosystem is correct?',['Energy and matter both vanish after feeding.','Matter cycles while energy flows through the system and is dispersed as heat.','Energy cycles but nitrogen never does.','The 90% energy not transferred is created into new matter.'],1,'Matter is conserved and recycled, while energy flows and much is released as heat.']],\n['4.3',()=>{let a=choose([['photosynthesis','Plants take CO₂ from air and store carbon in sugars.'],['cellular respiration','Cells use sugars and release CO₂.'],['consumption','An herbivore eats a plant, transferring carbon.'],['decomposition','Microbes break down dead organic material.']]);return [a[1]+' Which process is described?',[a[0],...mix(['photosynthesis','cellular respiration','consumption','decomposition'].filter(x=>x!==a[0]))],0,'Carbon moves through food webs by photosynthesis, feeding, respiration and decomposition.'];}],\n['4.3',()=>{let d=choose([['Nitrogen gas becomes biologically usable nitrogen.','nitrogen fixation'],['Nitrates become nitrogen gas.','denitrification'],['Ammonium becomes nitrite/nitrate.','nitrification'],['Dead matter becomes ammonium.','ammonification']]);return [d[0]+' Which nitrogen-cycle step is this?',[d[1],...mix(['nitrogen fixation','denitrification','nitrification','ammonification'].filter(x=>x!==d[1]))],0,'Bacteria carry out key conversions in the nitrogen cycle.'];}],\n['4.3',()=>['What makes the phosphorus cycle different from the nitrogen cycle?',['Phosphorus cycles only through animals.','Phosphorus has no major atmospheric phase and originates largely from rocks.','Phosphorus is created from sunlight.','Phosphorus cannot be reused.'],1,'Weathering releases phosphate from rocks, followed by uptake and transfer through food webs.']],\n['7.2',()=>{let x=choose(['pond','lake','coastal bay','river estuary']);return ['Fertilizer runs into a '+x+'. An algal bloom is followed by fish deaths. What is the MOST likely cause?',['Algae become carnivores.','Decomposers consume dissolved oxygen as algae die.','Carbon stops cycling.','Fish become producers.'],1,'Extra nutrients lead to blooms; decomposition can deplete dissolved oxygen and cause hypoxia.'];}],\n['7.2',()=>{let x=choose(['corals','clams','oysters','shell-forming plankton']);return ['As atmospheric CO₂ rises, why might '+x+' have trouble making calcium-carbonate structures?',['More CO₂ raises seawater H⁺, lowering pH and affecting carbonate chemistry.','CO₂ transforms all ocean nitrogen into rocks.','Seawater becomes pure freshwater.','Photosynthesis stops in every marine organism.'],0,'Ocean acidification comes from dissolved CO₂ reactions that increase H⁺ and change carbonate chemistry.'];}],\n['7.2',()=>{let x=choose(['eagle','shark','large predatory fish','osprey']);return ['A persistent pollutant is more concentrated in a '+x+' than in the prey it consumes. This is…',['nitrogen fixation','eutrophication','biomagnification','chemosynthesis'],2,'Pollutant concentration can increase at higher trophic levels as predators consume many contaminated prey.'];}],\n['7.2',()=>{let x=choose(['mercury','PCBs','a persistent pesticide']);return ['A single fish stores increasing quantities of '+x+' over several years. This is…',['bioaccumulation','biomagnification','nitrification','denitrification'],0,'Bioaccumulation refers to buildup within one individual over time.']}]];\nlet xp=0,round=[],at=0,results=[],deck=[],deckAt=0,flipped=false;const KEY='biology4:infinite:progress';let known={};try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');xp=saved.xp||0;known=saved.known||{}}catch(e){}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify({xp,known}))}catch(e){}};\nfunction generated(){const [lesson,fn]=choose(cases.filter(x=>by('genUnit').value==='all'||x[0]===by('genUnit').value));const [q,choices,a,why]=fn();const arr=mix(choices.map((v,i)=>({v,i})));return {lesson,q,choices:arr.map(x=>x.v),a:arr.findIndex(x=>x.i===a),why};}\nfunction start(){let size=Number(by('genCount').value),pool=[],tries=0;while(pool.length\u003csize&&tries++\u003csize*80){let q=generated();pool.push(q)}round=pool;at=0;results=[];by('genIntro').classList.add('hidden');by('genResult').classList.add('hidden');by('genPlay').classList.remove('hidden');display();}\nfunction display(){if(at>=round.length)return finish();const q=round[at];by('genProgress').textContent='Question '+(at+1)+' / '+round.length;by('genQuestion').textContent=q.q;by('genChoices').innerHTML=q.choices.map((c,i)=>'\u003cbutton class=\"gen-choice\" data-i=\"'+i+'\">'+String.fromCharCode(65+i)+'. '+esc(c)+'\u003c/button>').join('');by('genFeedback').innerHTML='';by('genNext').classList.add('hidden');by('genChoices').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}\nfunction answer(i){if(results.length!==at)return;const q=round[at],good=i===q.a;results.push({q,i,good});xp+=good?10:2;save();by('genChoices').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===i&&!good)b.classList.add('wrong')});by('genFeedback').innerHTML='\u003cdiv class=\"review-explanation '+(good?'':'missed')+'\">\u003cb>'+(good?'✅ Correct!':'❌ Review this')+'\u003c/b>\u003cp>\u003cb>Correct answer:\u003c/b> '+esc(q.choices[q.a])+'\u00
