ck=()=>rate(false);by('genKnowCard').onclick=()=>rate(true);fillCards();\nconst style=document.createElement('style');style.textContent='.gen-choice{display:block;width:100%;text-align:left;background:#20344d;border:1px solid #45667e;color:white;padding:14px;margin:8px 0;border-radius:12px;font:inherit;cursor:pointer}.gen-choice.correct{border-color:#61dbb8;background:#16473d}.gen-choice.wrong{border-color:#ff858f;background:#492533}.gen-choice:disabled{cursor:default}';document.head.appendChild(style);\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\u003c/script>\u003cscript>/* Biology Smart Study Hub v3 — offline, mobile-first, local progress only */\n(()=>{\n'use strict';\nconst BANK=[[\"4.1\",\"A bacterium lives near a deep-sea hydrothermal vent with no sunlight. It makes carbohydrates using energy released from inorganic chemicals. What BEST describes it?\",[\"A photosynthetic heterotroph\",\"A chemosynthetic autotroph\",\"A scavenger\",\"A decomposer\"],1,\"It makes its own organic food using chemical energy, without sunlight.\"],[\"4.1\",\"A forest mushroom releases enzymes onto a rotting log and absorbs the products. It is acting primarily as a…\",[\"detritivore\",\"herbivore\",\"decomposer\",\"scavenger\"],2,\"Decomposers chemically break down dead organic matter externally.\"],[\"4.1\",\"Which statement correctly compares photosynthesis and chemosynthesis?\",[\"Both require sunlight\",\"Both produce energy-rich organic compounds but use different energy sources\",\"Only chemosynthesis can be carried out by autotrophs\",\"Both require eating other organisms\"],1,\"Light powers photosynthesis; chemical reactions power chemosynthesis.\"],[\"4.1\",\"An earthworm swallows small pieces of decaying leaves. A nearby fungus releases digestive enzymes into the same material. What is the BEST classification?\",[\"Both are scavengers\",\"Worm is decomposer; fungus is detritivore\",\"Worm is detritivore; fungus is decomposer\",\"Both are primary producers\"],2,\"Detritivores ingest detritus; decomposers chemically break it down.\"],[\"4.1\",\"A raccoon eats berries, small fish, and insect larvae. How is it BEST classified?\",[\"Herbivore\",\"Omnivore\",\"Detritivore\",\"Autotroph\"],1,\"An omnivore eats plant and animal material.\"],[\"4.2\",\"In a food web, an arrow points from grass to a rabbit. What does that arrow indicate?\",[\"Grass eats the rabbit\",\"Energy moves from the grass to the rabbit\",\"The rabbit gives nutrients to living grass directly\",\"The rabbit is a primary producer\"],1,\"Arrows show energy transfer from eaten organism to eater.\"],[\"4.2\",\"Use this chain: algae → zooplankton → small fish → heron. Which organism is the SECONDARY consumer?\",[\"Algae\",\"Zooplankton\",\"Small fish\",\"Heron\"],2,\"The small fish eats the primary consumer (zooplankton).\"],[\"4.2\",\"A marsh loses most of its frogs. Frogs eat insects; snakes eat frogs. Assuming other factors stay the same, which change is MOST likely at first?\",[\"Insects decrease and snakes increase\",\"Insects increase and snakes may decrease\",\"Plants must immediately disappear\",\"Snakes become producers\"],1,\"Fewer frogs can mean less predation on insects and less food for snakes.\"],[\"4.2\",\"A food chain starts with 50,000 kJ in producers. Using the 10% rule, about how much reaches the SECONDARY consumers?\",[\"50,000 kJ\",\"5,000 kJ\",\"500 kJ\",\"50 kJ\"],2,\"50,000 → 5,000 primary → 500 secondary.\"],[\"4.2\",\"A single tree supports hundreds of insects. Which ecological pyramid could be inverted in this ecosystem?\",[\"Energy pyramid only\",\"Pyramid of numbers\",\"All energy pyramids\",\"None of the ecological pyramids\"],1,\"One producer may support many consumers, inverting a pyramid of numbers.\"],[\"4.2\",\"Which statement BEST describes a biomass pyramid?\",[\"It measures only how many organisms live at each level\",\"It shows relative mass of living organic matter at each trophic level\",\"It shows water volume at each trophic level\",\"It is always numerically identical to the energy pyramid\"],1,\"Biomass represents living organic matter (often dry mass).\"],[\"4.2\",\"Why is less energy available to tertiary consumers than to primary consumers?\",[\"Organisms destroy energy\",\"Most captured energy is used for life processes and much is released as heat\",\"The food web reverses energy flow\",\"Matter cannot move between trophic levels\"],1,\"Energy transforms and disperses, including as heat; only a fraction reaches the next level.\"],[\"4.2\",\"A lake food web includes algae → insects → fish, and algae → snails → fish. Which claim is supported?\",[\"The lake has two unrelated food chains\",\"Fish get energy only from snails\",\"The food web contains multiple linked food chains\",\"Arrows would point from fish to algae\"],2,\"Several interconnected feeding paths make a food web.\"],[\"4.3\",\"A drought kills many plants, greatly reducing photosynthesis. What is the most direct expected effect on atmospheric CO₂, all else equal?\",[\"CO₂ removal by photosynthesis decreases\",\"Denitrification automatically stops\",\"All carbon disappears\",\"Photosynthesis releases more CO₂\"],0,\"Less photosynthesis means less CO₂ is removed from the atmosphere.\"],[\"4.3\",\"Which process turns atmospheric nitrogen gas into forms that can enter biological food webs?\",[\"Denitrification\",\"Nitrogen fixation\",\"Transpiration\",\"Combustion\"],1,\"Nitrogen fixation converts N₂ into usable compounds.\"],[\"4.3\",\"A soil bacterium converts nitrates into nitrogen gas. Which process is occurring?\",[\"Nitrification\",\"Photosynthesis\",\"Denitrification\",\"Ammonification\"],2,\"Denitrification returns nitrogen gas to the atmosphere.\"],[\"4.3\",\"Why does the phosphorus cycle differ from the carbon and nitrogen cycles?\",[\"Phosphorus is not used by living organisms\",\"It has no major gaseous atmospheric phase\",\"It cannot be found in water\",\"It is created by producers\"],1,\"Phosphates mainly cycle through rocks, water, soil, and organisms.\"],[\"4.3\",\"Rain falls on a forest. Some water soaks into soil, enters roots, and later leaves through leaf openings. What process returns this water to the atmosphere?\",[\"Denitrification\",\"Transpiration\",\"Runoff\",\"Condensation\"],1,\"Transpiration releases water vapor from plants.\"],[\"7.2\",\"After fertilizer runoff enters a pond, algae grow rapidly, then many fish die. What BEST explains the fish deaths?\",[\"Photosynthesis removes all nitrogen\",\"Bacteria decomposing dead algae use up dissolved oxygen\",\"More algae always raise oxygen at every depth\",\"Phosphorus directly turns into toxins\"],1,\"Decomposition can deplete dissolved oxygen, causing hypoxia.\"],[\"7.2\",\"A predator contains a higher concentration of mercury than the fish it eats. Which term BEST describes increasing concentrations up the food chain?\",[\"Nitrogen fixation\",\"Bioaccumulation\",\"Biomagnification\",\"Transpiration\"],2,\"Biomagnification is the increase in pollutant concentrations at higher trophic levels.\"],[\"7.2\",\"As extra atmospheric CO₂ dissolves in seawater, which change MOST directly contributes to ocean acidification?\",[\"Hydrogen ion concentration increases\",\"All dissolved gases disappear\",\"Seawater becomes pure freshwater\",\"Nitrogen gas becomes phosphate\"],0,\"Dissolved CO₂ forms carbonic acid chemistry that increases H⁺ and reduces pH.\"],[\"4.2\",\"WRITTEN RESPONSE 1 — A coastal marsh has grass → grasshoppers → frogs → snakes. A disease kills half the frogs. Predict TWO changes in the food web, explain arrow directions, and explain why less energy reaches the snakes. Use scientific reasoning.\",null,null,\"Look for: grasshopper increase (less frog predation); snake decrease (less prey); arrows food → eater; only ~10% transfers at each step, with energy used and dispersed as heat.\"],[\"4.3\",\"WRITTEN RESPONSE 2 — Heavy rain washes fertilizer into a lake while nearby forests are cleared. Explain (1) how nutrient runoff can lead to fish deaths and (2) how deforestation can change atmospheric CO₂. Connect matter cycling and energy flow in your explanation.\",null,null,\"Look for: nutrient runoff → algal bloom → dead algae → decomposers use oxygen → fish die; fewer trees → less photosynthesis/CO₂ uptake (and burning releases CO₂); nutrients/carbon cycle, energy flows and dissipates.\"]];\nconst TOPICS={'4.1':'Producers & Consumers','4.2':'Energy Flow & Pyramids','4.3':'Matter & Nutrient Cycles','7.2':'Human Impacts'};\nconst STORE='biology:smart:v3';\nconst $=id=>document.getElementById(id);\nlet data={attempts:[],flash:{},exams:[]};try{const saved=JSON.parse(localStorage.getItem(STORE)||'{}');data={...data,...saved,attempts:Array.isArray(saved.attempts)?saved.attempts:[],flash:saved.flash||{},exams:Array.isArray(saved.exams)?saved.exams:[]}}catch(e){}\nconst persist=()=>{try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){}};\nconst escape=s=>String(s??'').replace(/[&\u003c>\"']/g,x=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[x]));\nconst shuffle=a=>[...a].sort(()=>Math.random()-.5);\nfunction track(topic,ok,kind){data.attempts.push({topic,ok:!!ok,kind,date:Date.now()});data.attempts=data.attempts.slice(-1500);persist();refreshDashboard()}\nfunction scores(){const out={};for(const k of Object.keys(TOPICS)){const recent=data.attempts.filter(a=>a.topic===k).slice(-30);out[k]={count:recent.length,correct:recent.filter(a=>a.ok).length,percent:recent.length?Math.round(recent.filter(a=>a.ok).length/recent.length*100):null}}return out}\nfunction weakTopic(){const s=scores();return Object.keys(TOPICS).sort((a,b)=>(s[a].count\u003c3?-100:s[a].percent)-(s[b].count\u003c3?-100:s[b].percent))[0]}\nfunction go(page){const b=document.querySelector('#nav button[data-page=\"'+page+'\"]');if(b)b.click();document.getElementById(page)?.scrollIntoView({block:'start',behavior:'smooth'})}\nlet trainer=[],trIndex=0;\nfunction startTrainer(){const unit=$('smartUnit').value;const topic=unit==='weak'?weakTopic():unit;trainer=shuffle(BANK.filter(q=>q[2]&&(topic==='all'||q[0]===topic)));trIndex=0;$('trainerMessage').textContent='';showTrainer()}\nfunction showTrainer(){const q=trainer[trIndex];if(!q){$('trainerBox').innerHTML='\u003cp>Session finished! Review your topic mastery below.\u003c/p>\u003cbutton class=\"btn\" id=\"trainerRestart\">Try another session\u003c/button>';$('trainerRestart').onclick=startTrainer;return}\n$('trainerBox').innerHTML='\u003cdiv class=\"smart-counter\">Question '+(trIndex+1)+' of '+trainer.length+' · '+TOPICS[q[0]]+'\u003c/div>\u003ch3>'+escape(q[1])+'\u003c/h3>\u003cdiv class=\"smart-answers\">'+q[2].map((x,n)=>'\u003cbutton type=\"button\" data-choice=\"'+n+'\">'+String.fromCharCode(65+n)+'. '+escape(x)+'\u003c/button>').join('')+'\u003c/div>\u003cdiv class=\"smart-feedback\" aria-live=\"polite\">\u003c/div>\u003cbutton class=\"btn secondary\" id=\"trainerNext\" disabled>Next question →\u003c/button>';\n$('trainerBox').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const correct=+b.dataset.choice===q[3];track(q[0],correct,'trainer');$('trainerBox').querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;x.classList.toggle('correct',+x.dataset.choice===q[3]);x.classList.toggle('incorrect',x===b&&!correct)});$('trainerBox').querySelector('.smart-feedback').textContent=(correct?'Correct. ':'Not quite. ')+q[4];$('trainerNext').disabled=false});\n$('trainerNext').onclick=()=>{trIndex++;showTrainer()};\n}\nlet exam=null,examTimer=null;\nfunction startExam(){if(exam&&!exam.done&&!confirm('Restart the current timed exam?'))return;clearInterval(examTimer);exam={questions:window.buildVariedExam?window.buildVariedExam():BANK.map(q=>q),answers:{},flags:{},at:0,remaining:Number($('examMinutes').value)*60,done:false};$('smartExamResult').innerHTML='';renderExam();examTimer=setInterval(()=>{if(!exam||exam.done){clearInterval(examTimer);return}exam.remaining--;updateExamClock();if(exam.remaining\u003c=0)finishExam(true)},1000)}\nfunction saveAnswer(){if(!exam||exam.done)return;const n=exam.at,q=exam.questions[n];if(q[2]){const checked=$('smartExamBody').querySelector('input[name=\"smartAnswer\"]:checked');if(checked)exam.answers[n]=Number(checked.value)}else{const area=$('smartWritten');if(area)exam.answers[n]=area.value}}\nfunction updateExamClock(){if($('smartExamClock')&&exam)$('smartExamClock').textContent=Math.floor(Math.max(0,exam.remaining)/60)+':'+String(Math.max(0,exam.remaining)%60).padStart(2,'0')}\nfunction renderExam(){if(!exam)return;const n=exam.at,q=exam.questions[n];$('smartExamBody').innerHTML='\u003cdiv class=\"smart-exam-nav\">\u003cspan>Question '+(n+1)+' / '+exam.questions.length+'\u003c/span>\u003cstrong id=\"smartExamClock\">\u003c/strong>\u003c/div>\u003cp class=\"smart-counter\">'+TOPICS[q[0]]+' · '+(q[2]?'Multiple choice':'Written response')+'\u003c/p>\u003ch3>'+escape(q[1])+'\u003c/h3>'+(q[2]?q[2].map((v,i)=>'\u003clabel class=\"smart-choice\">\u003cinput type=\"radio\" name=\"smartAnswer\" value=\"'+i+'\" '+(exam.answers[n]===i?'checked':'')+'>'+String.fromCharCode(65+i)+'. '+escape(v)+'\u003c/label>').join(''):'\u003ctextarea id=\"smartWritten\" rows=\"6\" placeholder=\"Write a claim, evidence, and reasoning.\">'+escape(exam.answers[n]||'')+'\u003c/textarea>')+'\u003cdiv class=\"smart-exam-actions\">\u003cbutton type=\"button\" id=\"smartPrev\" class=\"btn secondary\" '+(n===0?'disabled':'')+'>← Back\u003c/button>\u003cbutton type=\"button\" class=\"btn secondary\" id=\"smartFlag\">'+(exam.flags[n]?'★ Flagged':'☆ Flag for review')+'\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"smartNext\">'+(n===exam.questions.length-1?'Finish test':'Next →')+'\u003c/button>\u003c/div>\u003cdiv class=\"smart-number-grid\">'+exam.questions.map((v,i)=>'\u003cbutton data-jump=\"'+i+'\" class=\"'+(i===n?'current ':'')+(exam.flags[i]?'flagged':'')+'\" aria-label=\"Question '+(i+1)+'\">'+(i+1)+'\u003c/button>').join('')+'\u003c/div>\u003cbutton type=\"button\" class=\"btn secondary\" id=\"smartSubmit\">Submit now\u003c/button>';\nupdateExamClock();$('smartPrev').onclick=()=>{saveAnswer();exam.at--;renderExam()};$('smartNext').onclick=()=>{saveAnswer();if(n===exam.questions.length-1)finishExam(false);else{exam.at++;renderExam()}};$('smartFlag').onclick=()=>{saveAnswer();exam.flags[n]=!exam.flags[n];renderExam()};$('smartSubmit').onclick=()=>{saveAnswer();if(confirm('Submit your exam?'))finishExam(false)};$('smartExamBody').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{saveAnswer();exam.at=Number(b.dataset.jump);renderExam()})}\nfunction finishExam(expired){if(!exam||exam.done)return;saveAnswer();clearInterval(examTimer);exam.done=true;let correct=0;const per={};const mc=exam.questions.map((q,i)=>({q,i})).filter(x=>x.q[2]);for(const {q,i} of mc){const good=exam.answers[i]===q[3];if(good)correct++;track(q[0],good,'exam');if(!per[q[0]])per[q[0]]=[0,0];per[q[0]][1]++;if(good)per[q[0]][0]++}\ndata.exams.push({date:Date.now(),correct,total:mc.length,timeRemaining:exam.remaining});data.exams=data.exams.slice(-30);persist();$('smartExamBody').innerHTML='';$('smartExamResult').innerHTML='\u003cdiv class=\"card\">\u003ch2>'+(expired?'Time is up!':'Exam complete!')+'\u003c/h2>\u003cdiv class=\"score\">'+correct+' / '+mc.length+' ('+Math.round(correct/mc.length*100)+'%)\u003c/div>\u003cp>Multiple-choice score only. Written answers are for self-review, not automatically graded.\u003c/p>\u003ch3>Topic breakdown\u003c/h3>'+Object.entries(per).map(([k,v])=>'\u003cp>'+TOPICS[k]+': '+v[0]+' / '+v[1]+'\u003c/p>').join('')+'\u003ch3>Review your answers\u003c/h3>'+exam.questions.map((q,i)=>'\u003cdetails class=\"smart-review\">\u003csummary>'+(exam.flags[i]?'★ ':'')+'Question '+(i+1)+' · '+TOPICS[q[0]]+' '+(q[2]?(exam.answers[i]===q[3]?'✓':'✗'):'Written')+'\u003c/summary>\u003cp>'+escape(q[1])+'\u003c/p>'+(q[2]?'\u003cp>Your answer: '+escape(q[2][exam.answers[i]]||'Not answered')+'\u003c/p>\u003cp>Correct answer: \u003cstrong>'+escape(q[2][q[3]])+'\u003c/strong>\u003c/p>\u003cp>'+escape(q[4])+'\u003c/p>':'\u003cp>Your response: '+escape(exam.answers[i]||'Not answered')+'\u003c/p>\u003cp>\u003cb>Self-check:\u003c/b> '+escape(q[4])+'\u003c/p>')+'\u003c/details>').join('')+'\u003cbutton class=\"btn\" id=\"smartExamAgain\">New attempt\u003c/button>\u003c/div>';$('smartExamAgain').onclick=startExam;refreshDashboard()}\nconst diagrams=[\n{title:'Food-web arrows',prompt:'Grass → rabbit → fox. What do these arrows represent?',choices:['Predators walking toward food','Energy flowing from food to consumer','Numbers of each species'],correct:1,why:'Food-web arrows point from the organism being eaten to its consumer.',nodes:['🌱 Grass','🐇 Rabbit','🦊 Fox'],topic:'4.2'},\n{title:'Nitrogen cycle',prompt:'What process takes nitrate (NO₃⁻) back to atmospheric nitrogen (N₂)?',choices:['Nitrogen fixation','Ammonification','Denitrification'],correct:2,why:'Denitrifying bacteria return nitrogen gas to the atmosphere.',nodes:['N₂ in air','NH₄⁺ in soil','NO₃⁻ in soil'],topic:'4.3'},\n{title:'Water cycle',prompt:'Which process transports water vapor from leaves to the atmosphere?',choices:['Transpiration','Condensation','Runoff'],correct:0,why:'Water exits plants, mainly through stomata, in transpiration.',nodes:['🌳 Plant','💧 Water vapor','☁ Clouds'],topic:'4.3'},\n{title:'Energy pyramid',prompt:'If producers hold 10,000 kJ, how much reaches secondary consumers?',choices:['1,000 kJ','100 kJ','10 kJ'],correct:1,why:'Two 10% transfers: 10,000 → 1,000 → 100 kJ.',nodes:['Producers 10,000 kJ','Primary 1,000 kJ','Secondary ?'],topic:'4.2'},\n{title:'Phosphorus cycle',prompt:'How does phosphorus first enter soil from its main long-term store?',choices:['Nitrogen fixation','Rock weathering','Evaporation'],correct:1,why:'Phosphate is released into soil and water as rocks weather.',nodes:['⛰ Rocks','🌱 Soil','🐾 Food web'],topic:'4.3'},\n{title:'Eutrophication',prompt:'What causes oxygen to drop after an algal bloom dies?',choices:['Decomposer activity','Photosynthesis alone','Evaporation'],correct:0,why:'Decomposers consume dissolved oxygen as they break down dead algae.',nodes:['🚜 Runoff','🟢 Bloom','🐟 Low oxygen'],topic:'7.2'}];\nlet diagramAt=0;function renderDiagram(){const d=diagrams[diagramAt];$('smartDiagram').innerHTML='\u003ch3>'+d.title+'\u003c/h3>\u003cdiv class=\"smart-diagram\" role=\"img\" aria-label=\"Schematic: '+escape(d.nodes.join(' to '))+'\">'+d.nodes.map((n,i)=>'\u003cdiv class=\"smart-diagram-node\">'+escape(n)+'\u003c/div>'+(i\u003cd.nodes.length-1?'\u003cspan class=\"smart-diagram-arrow\" aria-hidden=\"true\">→\u003c/span>':'')).join('')+'\u003c/div>\u003cp>'+d.prompt+'\u003c/p>\u003cdiv class=\"smart-answers\">'+d.choices.map((a,i)=>'\u003cbutton type=\"button\" data-answer=\"'+i+'\">'+escape(a)+'\u003c/button>').join('')+'\u003c/div>\u003cp class=\"smart-feedback\" aria-live=\"polite\">\u003c/p>\u003cbutton type=\"button\" id=\"nextDiagram\" class=\"btn secondary\">Next diagram →\u003c/button>\u003cp class=\"small\">'+(diagramAt+1)+' of '+diagrams.length+'\u003c/p>';$('smartDiagram').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.answer)===d.correct;track(d.topic,ok,'diagram');$('smartDiagram').querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;x.classList.toggle('correct',Number(x.dataset.answer)===d.correct);x.classList.toggle('incorrect',x===b&&!ok)});$('smartDiagram').querySelector('.smart-feedback').textContent=(ok?'Correct. ':'Try to remember: ')+d.why});$('nextDiagram').onclick=()=>{diagramAt=(diagramAt+1)%diagrams.length;renderDiagram()}}\nfunction refreshDashboard(){const s=scores(),container=$('smartMastery');if(!container)return;container.innerHTML=Object.entries(s).map(([k,v])=>'\u003cdiv class=\"smart-topic\">\u003cdiv class=\"smart-topic-header\">\u003cstrong>'+k+' · '+TOPICS[k]+'\u003c/strong>\u003cspan>'+(v.percent===null?'Not practiced':v.percent+'% · '+v.count+' attempts')+'\u003c/span>\u003c/div>\u003cdiv class=\"smart-meter\">\u003cdiv style=\"width:'+(v.percent??0)+'%\">\u003c/div>\u003c/div>\u003c/div>').join('');const weak=weakTopic();$('smartRecommendation').textContent='Recommended next: '+TOPICS[weak]+' — '+(s[weak].count\u003c3?'answer a few questions to establish your baseline.':'review your weakest recent topic.');$('smartHistory').textContent=data.exams.length?'Latest timed exam: '+data.exams.at(-1).correct+' / '+data.exams.at(-1).total+' MCQ':'No timed exam completed yet';const due=Object.values(data.flash).filter(x=>x.due\u003c=Date.now()).length;$('smartDueCount').textContent=due+' flashcards due for review'}\nfunction showTab(tab){document.querySelectorAll('[data-smart-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.smartTab===tab)));document.querySelectorAll('[data-smart-panel]').forEach(p=>p.hidden=p.dataset.smartPanel!==tab)}\nwindow.BiologySmart={track,refreshDashboard,reviewCard:(key,known)=>{const old=data.flash[key]||{stage:0,due:0};const stage=known?Math.min(5,old.stage+1):0;const intervals=[0,1,3,7,14,30];data.flash[key]={stage,due:Date.now()+intervals[stage]*86400000};persist();refreshDashboard()},due:key=>!data.flash[key]||data.flash[key].due\u003c=Date.now()};\nfunction init(){if(!$('smartHub'))return;document.querySelectorAll('[data-smart-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.smartTab));$('smartStartTrainer').onclick=startTrainer;$('smartStartExam').onclick=startExam;$('smartReviewDue').onclick=()=>{const t=document.querySelector('#nav button[data-page=\"flash\"]');if(t)t.click();const mode=$('flashMode');if(mode){mode.value='due';window.resetFlash?.()} };showTab('mastery');renderDiagram();refreshDashboard()}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\u003c/script>\u003cscript>/* Guided Biology Course — original text, interactive diagrams, checkpoint questions. */\n(function(){\n'use strict';\nconst $=id=>document.getElementById(id);\nconst units=[\n{tag:'4.1',name:'Producers, consumers & decomposers',summary:'How organisms obtain energy and recycle nutrients',\nsteps:[\n['Where energy enters the food web','Most ecosystems begin with producers such as plants and algae. Producers use photosynthesis to convert sunlight into chemical energy stored in sugars. Some bacteria use chemosynthesis, powered by chemical reactions instead of sunlight.'],\n['Who eats whom','Herbivores eat producers; carnivores eat other animals; omnivores eat both. Scavengers consume dead animals. Detritivores ingest fragments of dead material; decomposers such as fungi and bacteria chemically break it down and return nutrients to ecosystems.'],\n['Key distinction','Energy enters an ecosystem through producers and moves through consumers. Decomposers recycle matter, but they do not recycle energy.']\n],diagram:'roles',tip:'Test trap: decomposers return nutrients to the environment; they do not create new matter.',q:'Which organisms chemically break down dead material and recycle nutrients?',answers:['Primary consumers','Decomposers','Primary producers'],correct:1,why:'Fungi and bacteria act as decomposers, releasing nutrients from dead organisms and wastes.'},\n{tag:'4.2',name:'Food chains, food webs & trophic levels',summary:'Follow the arrows and predict population changes',\nsteps:[\n['Read the arrow correctly','In a food web the arrow goes FROM the food TO the organism that eats it. Grass → rabbit means the rabbit obtains energy by eating grass—not the reverse.'],\n['Trophic levels','Primary producers occupy trophic level 1. Primary consumers are level 2; secondary consumers level 3; tertiary consumers level 4. Some omnivores can occupy more than one level depending on their food.'],\n['Predict the indirect effects','If predators disappear, some prey populations may increase. That can reduce the producers the prey consume. A food web reveals many connected pathways, not just one chain.']\n],diagram:'food',tip:'Remember: arrows show the direction of energy transfer, not the direction of an animal moving.',q:'In grass → rabbit → fox, which direction does energy flow?',answers:['Fox toward rabbit toward grass','Grass toward rabbit toward fox','In both directions equally'],correct:1,why:'Arrows point from food to consumer.'},\n{tag:'4.2',name:'Energy transfer & ecological pyramids',summary:'The 10% rule, biomass and pyramid types',\nsteps:[\n['The 10% rule','On average, about 10% of energy at one trophic level transfers to the next. If producers contain 10,000 kJ, primary consumers receive about 1,000 kJ and secondary consumers about 100 kJ.'],\n['Where the rest goes','Energy supports movement, cellular respiration, maintenance, growth and other processes. Much eventually dissipates as heat; some remains in waste and uneaten material.'],\n['Three pyramids','An energy pyramid tracks available energy and is always upright. A biomass pyramid compares dry organic mass, while a numbers pyramid compares individual counts. Biomass and numbers pyramids can sometimes be inverted.']\n],diagram:'energy',tip:'Do not confuse energy and matter: energy flows one way, while atoms are reused in cycles.',q:'If producers have 20,000 kJ, about how much reaches secondary consumers?',answers:['2,000 kJ','200 kJ','20 kJ'],correct:1,why:'Two 10% transfers: 20,000 → 2,000 → 200 kJ.'},\n{tag:'4.3',name:'Carbon cycle & ocean acidification',summary:'Photosynthesis, respiration, sources, sinks and CO₂',\nsteps:[\n['Carbon moves between reservoirs','Carbon is stored in the atmosphere, oceans, soils, organisms, fossil fuels and rocks. A carbon sink absorbs more carbon than it releases; a source releases more than it absorbs.'],\n['Short and long carbon pathways','Photosynthesis takes up CO₂ into organic molecules. Eating moves carbon through food webs. Respiration and decomposition release carbon; burning fossil fuels adds long-stored carbon to the atmosphere. An organism can store carbon and release it.'],\n['Ocean acidification','Extra atmospheric CO₂ dissolves into seawater and produces chemical reactions that increase hydrogen ions. The lower pH and reduced carbonate availability can make it harder for many corals and shell-building animals to form calcium carbonate structures. Coral bleaching is different: environmental stress such as high temperature causes corals to lose symbiotic algae.']\n],diagram:'carbon',tip:'Carbon sink vs. source is a NET balance: a tree can respire CO₂ while growing and storing more carbon overall.',q:'Which process directly removes CO₂ from the atmosphere and stores carbon in sugars?',answers:['Cellular respiration','Photosynthesis','Fossil fuel combustion'],correct:1,why:'Photosynthesis fixes inorganic carbon into organic molecules.'},\n{tag:'4.3',name:'Water cycle & transpiration',summary:'Follow water through air, land and organisms',\nsteps:[\n['Movement through the environment','Evaporation changes liquid water into water vapor. Condensation forms droplets and clouds; precipitation brings water back to Earth. Runoff flows across the surface; infiltration and percolation move water into and through soil. Collection occurs in rivers, lakes and oceans.'],\n['How plants move water','Water enters plant roots and rises through xylem. Evaporation from leaves and vapor loss through stomata—transpiration—help pull more water upward.'],\n['When the cycle is disrupted','A drought is an extended period of abnormally low precipitation, often leading to water shortages and ecosystem stress.']\n],diagram:'water',tip:'Transpiration is specifically water loss from plants, mostly through the stomata in leaves.',q:'What is the name for water vapor leaving plants mainly through leaf stomata?',answers:['Condensation','Transpiration','Runoff'],correct:1,why:'Transpiration sends water vapor from plants into the atmosphere.'},\n{tag:'4.3',name:'The nitrogen cycle',summary:'Fixation, ammonification, nitrification and denitrification',\nsteps:[\n['Why nitrogen is essential','Organisms need nitrogen to make proteins and nucleic acids such as DNA. Most cannot use atmospheric N₂ directly.'],\n['Follow the processes','Nitrogen fixation converts N₂ into usable nitrogen forms. Ammonification turns organic nitrogen from wastes and dead organisms into ammonium (NH₄⁺). Nitrification converts ammonium into nitrite (NO₂⁻) and then nitrate (NO₃⁻).'],\n['Return to living things and air','Plants assimilate ammonium or nitrate into organic molecules; animals obtain nitrogen by eating plants or other animals. Denitrifying bacteria convert nitrate back into N₂, returning it to the atmosphere.']\n],diagram:'nitrogen',tip:'A common confusion: nitrification ends with nitrate; denitrification returns nitrogen gas to the atmosphere.',q:'Which process converts nitrate into atmospheric nitrogen gas?',answers:['Denitrification','Ammonification','Assimilation'],correct:0,why:'Denitrifying bacteria return nitrogen to the air as N₂.'},\n{tag:'4.3',name:'Phosphorus cycle & limiting nutrients',summary:'Rock weathering, uptake, decomposition and runoff',\nsteps:[\n['Where phosphorus begins','Unlike the nitrogen cycle, phosphorus has no major atmospheric gas phase. Weathering releases phosphate from rocks into soil and water.'],\n['How it cycles','Plants take up phosphate; animals obtain it by feeding. Excretion and decomposition return phosphorus to soil and water. Phosphorus may leach into groundwater or become locked in sediments and rocks.'],\n['Why small amounts matter','Phosphorus is essential for DNA, RNA, ATP and cell membranes. It is often a limiting nutrient in freshwater. Extra fertilizer and mining can move excess phosphorus into waterways and trigger algal blooms.']\n],diagram:'phosphorus',tip:'Remember: phosphorus is stored mainly in rocks, sediments, soil, water and organisms—not as atmospheric gas.',q:'Which nutrient cycle lacks a major gaseous atmospheric phase?',answers:['Carbon','Phosphorus','Nitrogen'],correct:1,why:'Phosphorus chiefly moves through rocks, water, soils and organisms.'},\n{tag:'7.2',name:'Human impacts: runoff, acid rain & pollution',summary:'Eutrophication, dead zones, bioaccumulation and cleanup',\nsteps:[\n['Eutrophication and dead zones','Nutrient-rich runoff can cause fast algal growth. When algae die, decomposers use oxygen. Dissolved oxygen may become dangerously low, creating hypoxic dead zones and harming aquatic life.'],\n['Acid rain','Sulfur dioxide (SO₂) and nitrogen oxides (NOₓ) from emissions react in the atmosphere to form sulfuric and nitric acids, which may fall with precipitation.'],\n['Pollutants and remediation','Bioaccumulation is the buildup of persistent pollutants within one organism over time. Biomagnification describes increasing pollutant concentrations at higher trophic levels. Plastic and microplastic debris can accumulate in oceans. Bioremediation uses living organisms, often microbes, to help treat certain pollutants.']\n],diagram:'impact',tip:'Individual = bioaccumulation. Across food-web trophic levels = biomagnification.',q:'What is the direct cause of oxygen loss during many eutrophication events?',answers:['Decomposition of dead algal biomass','Extra oxygen produced by algae','Water evaporating'],correct:0,why:'Decomposers consume dissolved oxygen while breaking down dead algae.'}\n];\nconst COURSE_REREAD=[[\"Key Takeaways Chapter 4 Test, slide 2.\",\"Lecture 4.1, producers/consumers: slide number not supplied.\",\"CB 4.1: book/notebook page number not visible.\"],[\"Key Takeaways Chapter 4 Test, slide 3.\",\"Lecture 4.2, food chains and trophic levels: slide number not supplied.\",\"CB 4.2: book/notebook page number not visible.\"],[\"Key Takeaways Chapter 4 Test, slide 3.\",\"Lecture 4.2, energy/biomass/numbers pyramids: slide number not supplied.\",\"CB 4.2: book/notebook page number not visible.\"],[\"Key Takeaways Chapter 4 Test, slide 5.\",\"Lecture 4.3, slide 8 (carbon sinks/sources) and slide 18 (ocean acidification).\",\"CB 4.3 class notebook pages 36–37 are shown; textbook page not verified.\"],[\"Key Takeaways Chapter 4 Test, slide 6.\",\"Lecture 4.3, slide 27 (transpiration) and slide 30 (water-cycle review).\",\"CB 4.3 class notebook pages 36–37 are shown; textbook page not verified.\"],[\"Key Takeaways Chapter 4 Test, slide 7.\",\"Lecture 4.3, slide 34 (nitrogen-cycle review) and slide 36 (nitrogen diagram).\",\"CB 4.3 class notebook pages 36–37 are shown; textbook page not verified.\"],[\"Key Takeaways Chapter 4 Test, slide 7.\",\"Lecture 4.3, slide 42 (phosphorus cycle).\",\"CB 4.3 class notebook pages 36–37 are shown; textbook page not verified.\"],[\"Key Takeaways Chapter 4 Test, slides 4–6.\",\"Lecture 4.3, slide 18 (acidification), slide 39 (acid rain), slide 45 (pollution/bioremediation).\",\"CB 7.2: book/notebook page number not visible.\"]];\nconst TEACHER_KEY_TAKEAWAYS=[{\"items\":[\"How energy enters ecosystems: photosynthesis and chemosynthesis\",\"Autotrophs versus heterotrophs; carbohydrates store chemical energy\",\"Types of consumers: omnivores, herbivores, carnivores, decomposers, detritivores, scavengers\"],\"review\":\"A producer uses sunlight or chemical reactions to make energy-rich food; a heterotroph consumes organisms or their products.\"},{\"items\":[\"Explain trophic levels: producers → consumers → decomposers\",\"Trace arrows in food chains and food webs\",\"Predict what happens when an organism is removed\"],\"review\":\"Know the role of each trophic level and the direction of energy transfer.\"},{\"items\":[\"The three ecological pyramids: energy, biomass and numbers\",\"Only about 10% of energy passes to the next trophic level\",\"Matter cycles, while energy flows one way and eventually dissipates as heat\"],\"review\":\"Be able to calculate successive 10% transfers and tell the three pyramids apart.\"},{\"items\":[\"Carbon cycle: where carbon is stored, released, and a nst known=new Set(presets.map(x=>x[0]));\nconst read=(key,def)=>{try{return localStorage.getItem(key)||def}catch(e){return def}};\nconst save=(key,val)=>{try{localStorage.setItem(key,val)}catch(e){}};\nlet chosen=known.has(read(KEY,'blue'))?read(KEY,'blue'):'blue';\nlet hue=Math.max(0,Math.min(359,Number(read(HUE,'210'))||210));\nlet lightChoice=read(LIGHT,'dark');\nconst mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;\nconst root=document.documentElement;\nfunction hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),fn=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return '#'+fn(0)+fn(8)+fn(4)}\nfunction customPalette(H,light){\nconst base=light?{bg:hex(H,34,96),header:hex(H,45,98),card:'#ffffff',card2:hex(H,34,90),border:hex(H,28,74),text:hex(H,40,19),muted:hex(H,24,37),accent:hex(H,72,34),accentText:'#ffffff',focus:hex((H+35)%360,66,37),soft:hex(H,50,32)}:{bg:hex(H,42,12),header:hex(H,45,16),card:hex(H,36,21),card2:hex(H,33,27),border:hex(H,23,43),text:'#f1f6ff',muted:hex(H,25,79),accent:hex(H,67,78),accentText:hex(H,42,13),focus:'#f0dba6',soft:hex(H,65,87)};\nfor(const [k,v] of Object.entries(base))root.style.setProperty('--t-'+k.replace(/[A-Z]/g,x=>'-'+x.toLowerCase()),v);\nreturn base.bg\n}\nfunction clearPalette(){for(const s of ['bg','header','card','card2','border','text','muted','accent','accent-text','focus','soft'])root.style.removeProperty('--t-'+s)}\nfunction apply(mode,remember=true){\nchosen=known.has(mode)?mode:'blue';const resolved=chosen==='auto'?(mq?.matches?'light':'blue'):chosen;\nroot.setAttribute('data-study-theme',resolved==='custom'?'custom':resolved);\nroot.setAttribute('data-study-choice',chosen);\nclearPalette();\nconst bg=resolved==='custom'?customPalette(hue,lightChoice==='light'):getComputedStyle(root).getPropertyValue('--t-bg').trim();\ndocument.body?.classList.remove('light');\nconst meta=document.querySelector('meta[name=\"theme-color\"]');if(meta)meta.content=bg||'#0e2038';\nif(remember)save(KEY,chosen);\ndocument.querySelectorAll('.study-theme-select').forEach(x=>x.value=chosen);\ndocument.querySelectorAll('.theme-picked').forEach(x=>x.textContent=presets.find(x=>x[0]===chosen)?.[1]||'');\ndocument.querySelectorAll('.custom-color-controls').forEach(x=>x.hidden=chosen!=='custom');\n}\nfunction decorate(){const page=document.getElementById('chapters')?'home':document.getElementById('nav')?'chapter':document.getElementById('missions')?'forge':'other';\nconst header=document.querySelector('header');if(!header)return;\nconst wrap=document.createElement('div');wrap.className='study-theme-wrap';\nwrap.innerHTML='\u003clabel for=\"studyThemeSelect\">🎨 Theme\u003c/label>\u003cselect id=\"studyThemeSelect\" class=\"study-theme-select\" aria-label=\"Choose color theme\">\u003c/select>\u003cbutton type=\"button\" class=\"theme-more\" aria-expanded=\"false\" aria-controls=\"themePanel\">Customize\u003c/button>\u003cdiv class=\"theme-panel\" id=\"themePanel\" hidden>\u003cstrong>Color & appearance\u003c/strong>\u003cp>Pick a preset, match your device automatically, or make your own color.\u003c/p>\u003cdiv class=\"theme-swatch-grid\" id=\"themeSwatches\">\u003c/div>\u003cdiv class=\"custom-color-controls\" hidden>\u003clabel for=\"themeWheel\">Color wheel\u003c/label>\u003cinput id=\"themeWheel\" type=\"color\" value=\"#3976bd\" aria-label=\"Custom theme color wheel\">\u003clabel for=\"themeHue\">Fine-tune color\u003c/label>\u003cinput id=\"themeHue\" type=\"range\" min=\"0\" max=\"359\" value=\"210\">\u003clabel for=\"themeCustomLight\">Custom background\u003c/label>\u003cselect id=\"themeCustomLight\">\u003coption value=\"dark\">Dark\u003c/option>\u003coption value=\"light\">Light\u003c/option>\u003c/select>\u003c/div>\u003cp class=\"theme-help\">Auto follows your phone or computer light/dark setting. Your choice is saved on this device.\u003c/p>\u003c/div>';\nconst selector=wrap.querySelector('.study-theme-select');\npresets.forEach(([id,label])=>{const option=document.createElement('option');option.value=id;option.textContent=label;selector.append(option)});\nselector.onchange=()=>apply(selector.value);\nconst toggle=wrap.querySelector('.theme-more'),panel=wrap.querySelector('#themePanel');toggle.onclick=()=>{panel.hidden=!panel.hidden;toggle.setAttribute('aria-expanded',String(!panel.hidden))};\nconst grid=wrap.querySelector('#themeSwatches');\npresets.forEach(([id,label])=>{let b=document.createElement('button');b.type='button';b.className='theme-swatch';b.dataset.theme=id;b.innerHTML='\u003cspan class=\"theme-swatch-dots\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan>'+label+'\u003c/span>';b.setAttribute('aria-label','Use '+label+' theme');b.onclick=()=>apply(id);grid.append(b)});\nconst wheel=wrap.querySelector('#themeWheel'),slider=wrap.querySelector('#themeHue'),mode=wrap.querySelector('#themeCustomLight');\nfunction rgbToHue(v){const num=parseInt(v.slice(1),16);let r=(num>>16)/255,g=((num>>8)&255)/255,b=(num&255)/255;let min=Math.min(r,g,b),max=Math.max(r,g,b),d=max-min;if(!d)return 210;let h=max===r?((g-b)/d)%6:max===g?(b-r)/d+2:(r-g)/d+4;return Math.round((h*60+360)%360)}\nwheel.value=hex(hue,65,52);slider.value=hue;mode.value=lightChoice;\nwheel.oninput=()=>{hue=rgbToHue(wheel.value);slider.value=hue;save(HUE,String(hue));apply('custom')};\nslider.oninput=()=>{hue=Number(slider.value);wheel.value=hex(hue,65,52);save(HUE,String(hue));apply('custom')};\nmode.onchange=()=>{lightChoice=mode.value;save(LIGHT,lightChoice);apply('custom')};\nconst slot=header.querySelector('.header-links')||header.querySelector('.bar')||header.querySelector('.inside')||header;slot.prepend(wrap);\napply(chosen,false);\nif(page==='home'||page==='chapter')addGuide(page);\n}\nconst links=[\n['📘 Learn Everything','Illustrated lessons with quick understanding checks','chapter4.html?mode=course'],\n['🧠 Flashcards','Questions, definitions, miss tch-dots i:first-child{background:#137c89}\n.theme-swatch[data-theme=\"lagoon\"] .theme-swatch-dots i:nth-child(2){background:#fce5d1}\n.theme-swatch[data-theme=\"lagoon\"] .theme-swatch-dots i:nth-child(3){background:#c65c2f}\n.theme-swatch[data-theme=\"festival\"] .theme-swatch-dots i:first-child{background:#4a2a76}\n.theme-swatch[data-theme=\"festival\"] .theme-swatch-dots i:nth-child(2){background:#d0ed72}\n.theme-swatch[data-theme=\"festival\"] .theme-swatch-dots i:nth-child(3){background:#dc72b7}\n.custom-color-controls:not([hidden]){display:grid;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--t-border)}\n.custom-color-controls label{color:var(--t-text)}\n.custom-color-controls input[type=color]{height:48px;width:100%;background:transparent;border:0;cursor:pointer}\n.custom-color-controls input[type=range]{width:100%;accent-color:var(--t-accent)}\n.custom-color-controls select{background:var(--t-card2);color:var(--t-text);border:1px solid var(--t-border);padding:9px;border-radius:8px}\n.where-guide{padding:20px;background:var(--t-card);border:1px solid var(--t-border);border-radius:18px;margin:22px 0}\n.where-guide-head{display:flex;align-items:start;justify-content:space-between;gap:12px}\n.where-guide h2{margin:5px 0}.where-guide p{margin:5px 0 12px}\n.where-guide-toggle{padding:9px 12px;background:var(--t-card2);border:1px solid var(--t-border);color:var(--t-text);border-radius:10px;white-space:nowrap;cursor:pointer}\n.where-guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.where-guide-grid[hidden]{display:none!important}\n.where-guide-grid a{display:flex;flex-direction:column;gap:7px;background:var(--t-card2);border:1px solid var(--t-border);border-radius:12px;padding:14px;text-decoration:none;color:var(--t-text);min-width:0}\n.where-guide-grid strong{font-size:.95rem;color:var(--t-text)}.where-guide-grid small{font-size:.8rem;color:var(--t-muted)}.where-guide-grid em{font-size:.76rem;color:var(--t-accent);font-style:normal;font-weight:750;margin-top:auto}\n:root[data-study-theme=\"beach\"] .where-guide-grid em,:root[data-study-theme=\"sunshine\"] .where-guide-grid em,:root[data-study-theme=\"candy\"] .where-guide-grid em,:root[data-study-theme=\"lagoon\"] .where-guide-grid em{color:var(--t-text)}\n@media(max-width:730px){.theme-panel{right:auto;left:0;width:min(91vw,410px)}.where-guide{padding:13px}.where-guide-grid{grid-template-columns:1fr}.where-guide-head{align-items:start}.where-guide-toggle{font-size:.78rem;min-height:43px}.theme-swatch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003cdiv class=\"bar\">\u003ca class=\"brand\" href=\"chapter4.html\">\u003cspan class=\"logo\">B\u003c/span> BIOFORGE \u003cspan class=\"pill\">CHAPTER 4\u003c/span>\u003c/a>\u003cnav>\u003ca href=\"themes.html\">🎨 Themes & Color Wheel\u003c/a>\u003ca href=\"#missions\">Missions\u003c/a>\u003ca href=\"#lab\">Ecosystem Lab\u003c/a>\u003ca href=\"#arena\">Battle Arena\u003c/a>\u003ca href=\"#evidence\">Evidence Desk\u003c/a>\u003ca href=\"chapter4.html\">Classic Study Hub ↗\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\n\u003cmain class=\"container\">\n\u003cdiv class=\"hero\">\u003cdiv class=\"hero-main\">\u003cdiv class=\"eyebrow\">Biology • The field lab edition\u003c/div>\u003ch1>Don't just study\u003cbr>the ecosystem.\u003cbr>\u003cspan>Control it.\u003c/span>\u003c/h1>\u003cp class=\"intro\">Change the food web. Trigger an algal bloom. Trace energy. Defend your scientific reasoning. Then walk into your real Chapter 4 exam knowing why things happen.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"btn\" href=\"#lab\">Launch Ecosystem Lab ↗\u003c/a>\u003ca class=\"btn ghost\" href=\"#arena\">Enter Battle Arena\u003c/a>\u003c/div>\u003c/div>\n\u003caside class=\"hero-side\">\u003cdiv>\u003cspan class=\"eyebrow\">Your field researcher profile\u003c/span>\u003cdiv style=\"font-size:1.25rem;font-weight:850;margin-top:8px\">Ecosystem Analyst\u003c/div>\u003cp>Unlock ranks by explaining ecological relationships correctly.\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"big-number\" id=\"xp\">0 XP\u003c/div>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cb id=\"rank\">1\u003c/b>\u003csmall>Level\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cb id=\"wins\">0\u003c/b>\u003csmall>Correct\u003c/small>\u003c/div>\u003cdiv class=\"stat\">\u003cb id=\"streak\">0\u003c/b>\u003csmall>Streak\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003c/aside>\u003c/div>\n\u003csection id=\"missions\">\u003cdiv class=\"section-title\">\u003cdiv>\u003cspan class=\"eyebrow\">The expedition path\u003c/span>\u003ch2>Three ecosystems. Three crises.\u003c/h2>\u003cp>Each lab generates a different scientific prediction.\u003c/p>\u003c/div>\u003cspan class=\"pill\">4.1 · 4.2 · 4.3 · 7.2\u003c/span>\u003c/div>\n\u003cdiv class=\"mission-grid\">\n\u003cbutton class=\"mission\" data-mission=\"0\">\u003cspan class=\"icon\">🌿\u003c/span>\u003ch3>01 · Predator Collapse\u003c/h3>\u003cp>Remove predators. Predict the trophic cascade across a food web.\u003c/p>\u003csmall>4.2 FOOD WEBS · +35 XP\u003c/small>\u003c/button>\n\u003cbutton class=\"mission\" data-mission=\"1\">\u003cspan class=\"icon\">🦠\u003c/span>\u003ch3>02 · The Green Disaster\u003c/h3>\u003cp>Flood a lake with fertilizer. Investigate oxygen depletion.\u003c/p>\u003csmall>7.2 EUTROPHICATION · +35 XP\u003c/small>\u003c/button>\n\u003cbutton class=\"mission\" data-mission=\"2\">\u003cspan class=\"icon\">🌎\u003c/span>\u003ch3>03 · Carbon Emergency\u003c/h3>\u003cp>Compare photosynthesis, respiration and fuel burning.\u003c/p>\u003csmall>4.3 CARBON CYCLE · +35 XP\u003c/small>\u003c/button>\n\u003c/div>\u003c/section>\n\u003csection id=\"lab\">\u003cdiv class=\"section-title\">\u003cdiv>\u003cspan class=\"eyebrow\">Interactive investigation\u003c/span>\u003ch2>Ecosystem Lab\u003c/h2>\u003cp>Adjust the conditions. The model recalculates instantly.\u003c/p>\u003c/div>\u003cspan class=\"pill\" id=\"missionBadge\">Mission 01 / 03\u003c/span>\u003c/div>\n\u003cdiv class=\"lab-layout\">\u003cdiv class=\"card\">\u003ch3 id=\"labTitle\">Predator Collapse · Wetland Food Web\u003c/h3>\u003cp id=\"labDesc\">Adjust the predators and watch an illustrative trophic cascade. Arrows show energy transfer from food to consumer.\u003c/p>\n\u003cdiv class=\"lab-visual\">\u003csvg viewBox=\"0 0 680 340\" role=\"img\" aria-label=\"Interactive wetland food web: grass to insects to frogs to snakes, with population estimates\">\n\u003cdefs>\u003cmarker id=\"arrow\" markerWidth=\"10\" markerHeight=\"10\" refX=\"6\" refY=\"3\" orient=\"auto\">\u003cpath d=\"M0,0 L0,6 L6,3 Z\" fill=\"#b3e0b2\"/>\u003c/marker>\u003c/defs>\n\u003cpath class=\"arrow\" d=\"M125 175 Q180 175 227 175\"/>\u003cpath class=\"arrow\" d=\"M300 175 Q355 175 405 175\"/>\u003cpath class=\"arrow\" d=\"M476 175 Q520 175 565 175\"/>\n\u003cg class=\"diagram-node\" id=\"grass\">\u003ccircle cx=\"92\" cy=\"175\" r=\"57\" fill=\"#356940\"/>\u003ctext x=\"92\" y=\"162\">🌱\u003c/text>\u003ctext x=\"92\" y=\"185\">Plants\u003c/text>\u003ctext class=\"sub\" x=\"92\" y=\"205\">Producer\u003c/text>\u003c/g>\n\u003cg class=\"diagram-node\" id=\"insects\">\u003ccircle cx=\"262\" cy=\"175\" r=\"55\" fill=\"#536433\"/>\u003ctext x=\"262\" y=\"160\">🦗\u003c/text>\u003ctext x=\"262\" y=\"184\">Insects\u003c/text>\u003ctext class=\"sub\" x=\"262\" y=\"204\">Primary\u003c/text>\u003c/g>\n\u003cg class=\"diagram-node\" id=\"frogs\">\u003ccircle cx=\"438\" cy=\"175\" r=\"55\" fill=\"#306c73\"/>\u003ctext x=\"438\" y=\"160\">🐸\u003c/text>\u003ctext x=\"438\" y=\"184\">Frogs\u003c/text>\u003ctext class=\"sub\" x=\"438\" y=\"204\">Secondary\u003c/text>\u003c/g>\n\u003cg class=\"diagram-node\" id=\"snakes\">\u003ccircle cx=\"595\" cy=\"175\" r=\"57\" fill=\"#705642\"/>\u003ctext x=\"595\" y=\"160\">🐍\u003c/text>\u003ctext x=\"595\" y=\"184\">Snakes\u003c/text>\u003ctext class=\"sub\" x=\"595\" y=\"204\">Tertiary\u003c/text>\u003c/g>\n\u003ctext x=\"340\" y=\"32\" fill=\"#93c7bd\" font-size=\"15\" text-anchor=\"middle\">Simplified energy-transfer model\u003c/text>\u003ctext x=\"340\" y=\"316\" fill=\"#93c7bd\" font-size=\"14\" text-anchor=\"middle\">Model directions ≠ precise field predictions\u003c/text>\n\u003c/svg>\u003c/div>\u003cdiv class=\"insight\" id=\"labInsight\">When the top predators decrease, frogs may increase, insect populations may fall, and plants may recover. This is a simplified model of a trophic cascade.\u003c/div>\u003cdiv class=\"reviewref\" id=\"labRef\">Review: 4.2 food webs — textbook pp. 118–120 and 122.\u003c/div>\n\u003c/div>\u003cdiv class=\"card\">\u003ch3>Environmental controls\u003c/h3>\u003cp class=\"small\">These sliders represent illustrative conditions, not measured ecological data.\u003c/p>\n\u003cdiv class=\"lab-control\">\u003clabel for=\"predators\">Predator abundance \u003coutput id=\"predatorVal\">50%\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"predators\" min=\"0\" max=\"100\" value=\"50\">\u003c/div>\n\u003cdiv class=\"lab-control\">\u003clabel for=\"fertilizer\">Nutrient runoff \u003coutput id=\"fertVal\">35%\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"fertilizer\" min=\"0\" max=\"100\" value=\"35\">\u003c/div>\n\u003cdiv class=\"lab-control\">\u003clabel for=\"burning\">Fossil fuel burning \u003coutput id=\"burnVal\">40%\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"burning\" min=\"0\" max=\"100\" value=\"40\">\u003c/div>\n\u003cdiv class=\"lab-control\">\u003clabel for=\"forest\">Producer abundance \u003coutput id=\"forestVal\">65%\u003c/output>\u003c/label>\u003cinput type=\"range\" id=\"forest\" min=\"0\" max=\"100\" value=\"65\">\u003c/div>\n\u003cdiv class=\"meters\" id=\"meters\">\u003c/div>\n\u003cdiv class=\"quest-row\">\u003cbutton class=\"btn ghost\" id=\"resetLab\">Reset experiment\u003c/button>\u003cbutton class=\"btn gold\" id=\"predict\">Make a prediction\u003c/button>\u003c/div>\n\u003cdiv class=\"challenge hide\" id=\"labChallenge\">\u003ch3 id=\"labQuestion\">\u003c/h3>\u003cdiv id=\"labChoices\">\u003c/div>\u003cdiv id=\"labFeedback\">\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"arena\">\u003cdiv class=\"section-title\">\u003cdiv>\u003cspan class=\"eyebrow\">Teacher-style exam simulator\u003c/span>\u003ch2>Battle Arena\u003c/h2>\u003cp>Scenarios, trophic-level math, misconceptions and cause-and-effect explanations.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"grid-2\">\u003cdiv class=\"card\">\u003cspan class=\"tag\">Choose your difficulty\u003c/span>\u003ch3>Training or Hardcore?\u003c/h3>\u003cdiv class=\"mode-options\">\u003cbutton id=\"easyMode\" class=\"active\" data-mode=\"training\">🌱 Training · explanations after each question\u003c/button>\u003cbutton id=\"hardMode\" data-mode=\"hardcore\">⚔️ Hardcore · all feedback at the end\u003c/button>\u003c/div>\u003cp class=\"small\">Choose the lesson, then generate a fresh round. The generator varies scenarios and values; it doesn't claim unlimited original facts.\u003c/p>\n\u003cdiv class=\"quest-row\">\u003cselect id=\"arenaTopic\" aria-label=\"Topic filter\" style=\"flex:1;background:#1d3c43;color:white;border:1px solid #588078;border-radius:10px;padding:9px\">\u003coption value=\"all\">All lessons\u003c/option>\u003coption value=\"4.1\">4.1 Energy & consumers\u003c/option>\u003coption value=\"4.2\">4.2 Food webs & pyramids\u003c/option>\u003coption value=\"4.3\">4.3 Cycles of matter\u003c/option>\u003coption value=\"7.2\">7.2 Human impacts\u003c/option>\u003c/select>\u003cselect id=\"arenaLength\" style=\"background:#1d3c43;color:white;border:1px solid #588078;border-radius:10px;padding:9px\">\u003coption value=\"5\">5 questions\u003c/option>\u003coption value=\"10\">10 questions\u003c/option>\u003coption value=\"23\" selected>23 questions\u003c/option>\u003c/select>\u003c/div>\u003cbutton id=\"startArena\" class=\"btn\" style=\"width:100%\">Generate battle ⚡\u003c/button>\u003c/div>\n\u003cdiv class=\"card\">\u003cspan class=\"tag\">How to master each lesson\u003c/span>\u003cdiv class=\"info-row\">\u003cb>4.1 Producers\u003c/b>\u003cspan>Light vs chemical energy\u003c/span>\u003c/div>\u003cdiv class=\"info-row\">\u003cb>4.2 Energy flow\u003c/b>\u003cspan>10% rule & predictions\u003c/span>\u003c/div>\u003cdiv class=\"info-row\">\u003cb>4.3 Matter cycles\u003c/b>\u003cspan>Carbon, nitrogen, phosphorus\u003c/span>\u003c/div>\u003cdiv class=\"info-row\">\u003cb>7.2 Human impacts\u003c/b>\u003cspan>Blooms, CO₂, pollutants\u003c/span>\u003c/div>\u003cdiv class=\"reviewref\">Your original 23-question mock exam and flashcard bank remain in the \u003ca href=\"chapter4.html\">Classic Study Hub\u003c/a>.\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"card hide\" id=\"arenaPlay\" style=\"margin-top:16px\">\u003cspan class=\"pill\" id=\"battleCount\">Question 1\u003c/span>\u003cdiv class=\"progress-wrap\">\u003cdiv id=\"battleProgress\">\u003c/div>\u003c/div>\u003ch2 id=\"battleQuestion\">\u003c/h2>\u003cdiv id=\"battleChoices\">\u003c/div>\u003cdiv id=\"battleFeedback\">\u003c/div>\u003cbutton id=\"battleNext\" class=\"btn hide\">Next →\u003c/button>\u003c/div>\n\u003cdiv class=\"card hide\" id=\"arenaEnd\" style=\"margin-top:16px\">\u003c/div>\u003c/section>\n\u003csection id=\"evidence\">\u003cdiv class=\"section-title\">\u003cdiv>\u003cspan class=\"eyebrow\">Science argument training\u003c/span>\u003ch2>Evidence Desk\u003c/h2>\u003cp>Practice the hardest part: using biology to justify an answer.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"grid-2\">\u003cdiv class=\"card\">\u003cspan class=\"tag\">Claim · Evidence · Reasoning\u003c/span>\u003ch3 id=\"writtenPrompt\">A lake receives fertilizer runoff. Explain why fish may die even though algae initially increase.\u003c/h3>\u003ctextarea id=\"writtenAnswer\" placeholder=\"My claim is... The evidence is... This occurs because...\">\u003c/textarea>\u003cdiv class=\"quest-row\">\u003cbutton class=\"btn\" id=\"checkWriting\">Check my reasoning\u003c/button>\u003cbutton class=\"btn ghost\" id=\"newWriting\">New prompt ↻\u003c/button>\u003c/div>\u003cdiv id=\"writingFeedback\">\u003c/div>\u003cp class=\"small\">The offline checker uses approximate key-idea matching, not live AI. It may overlook correct wording.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cspan class=\"tag\">Your learning profile\u003c/span>\u003ch3>Mastery intelligence\u003c/h3>\u003cdiv id=\"masteryList\">\u003c/div>\u003cp class=\"small\">Your progress is saved locally in this browser, not sent to a server.\u003c/p>\u003cbutton id=\"resetStats\" class=\"btn ghost\">Reset my progress\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003c/main>\u003cfooter>BioForge • Chapter 4 Ecosystems • Built around Lessons 4.1, 4.2, 4.3 & 7.2 · \u003ca href=\"chapter4.html\">Classic study guide\u003c/a>\u003cbr>\u003csmall>Learning simulations are deliberately simplified and are not field measurements.\u003c/small>\u003c/footer>\n\u003cscript>\n(()=>{'use strict';\nconst el=id=>document.getElementById(id),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rand(0,a.length-1)],shuf=a=>[...a].sort(()=>Math.random()-.5),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));\nlet currentMission=0,mode='training',round=[],current=0,answered=[],session={};\nconst KEY='bioforge:v1';let state={xp:0,correct:0,streak:0,topics:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){};updateHeader()};\nfunction earn(x,topic){state.xp+=x;state.correct++;state.streak++;state.topics[topic]=(state.topics[topic]||0)+1;save()}\nfunction miss(){state.streak=0;save()}\nfunction updateHeader(){el('xp').textContent=state.xp+' XP';el('rank').textContent=Math.floor(state.xp/180)+1;el('wins').textContent=state.correct;el('streak').textContent=state.streak;el('masteryList').innerHTML=['4.1','4.2','4.3','7.2'].map(t=>'\u003cdiv class=\"info-row\">\u003cb>Lesson '+t+'\u003c/b>\u003cspan>'+Number(state.topics[t]||0)+' concepts solved\u003c/span>\u003c/div>').join('')}\nconst reset=()=>{['predators','fertilizer','burning','forest'].forEach((id,i)=>el(id).value=[50,35,40,65][i]);calc()};\nfunction calc(){\nconst p=+el('predators').value,n=+el('fertilizer').value,b=+el('burning').value,f=+el('forest').value;\nfor(const [id,v] of [['predatorVal',p],['fertVal',n],['burnVal',b],['forestVal',f]])el(id).textContent=v+'%';\nconst grass=clamp(f+(p-50)*.18,0,100),insect=clamp(65-(p-50)*.32,0,100),frog=clamp(45+(p-50)*.28,0,100),snake=p;\nconst oxygen=clamp(92-(n*.7),5,100),bloom=clamp(n*1.0,0,100),atm=clamp(20+b*.68-f*.33,0,100),storage=clamp(15+f*.8-b*.12,0,100);\nconst choices=[[\n ['Estimated plants',grass],['Estimated insects',insect],['Estimated frogs',frog],['Predators',snake]\n],[\n ['Bloom pressure',bloom],['Dissolved O₂ index',oxygen],['Aquatic stress',clamp(n*.75,0,100)],['Runoff',n]\n],[\n ['Atmospheric CO₂ pressure',atm],['Plant carbon uptake',f],['Combustion pressure',b],['Carbon storage index',storage]\n]][currentMission];\nel('meters').innerHTML=choices.map(([t,v])=>'\u003cdiv class=\"meter\">\u003cdiv class=\"top\">\u003cb>'+t+'\u003c/b>\u003cspan>'+Math.round(v)+'/100\u003c/span>\u003c/div>\u003cdiv class=\"track\">\u003cdiv style=\"width:'+v+'%;background:'+(t.includes('stress')||t.includes('pressure')?'linear-gradient(90deg,#e9bf78,#fc9886)':'linear-gradient(90deg,#5caeaf,#adeab1)')+'\">\u003c/div>\u003c/div>\u003c/div>').join('');\nel('insects').style.opacity=.45+insect/180;el('frogs').style.opacity=.45+frog/180;el('snakes').style.opacity=.45+snake/180;el('grass').style.opacity=.45+grass/180;\nconst insights=[\n'Predator changes alter prey pressure and may indirectly affect plants. With fewer snakes, frogs might increase, insects might decrease, and plants may increase. This is a simplified model; other food-web links could change the result.',\n'Higher nutrient runoff increases the risk of algal blooms. When algae die, decomposers use oxygen, so dissolved oxygen can fall and fish may die from hypoxia.',\n'More burning generally releases CO₂, while more photosynthetic producers can take up CO₂. The relative balance helps explain atmospheric carbon trends.'\n];\nel('labInsight').textContent=insights[currentMission];\n}\nconst missions=[\n ['Predator Collapse · Wetland Food Web','Adjust predators and trace energy transfers in a simplified wetland chain.','4.2 food webs: textbook pp. 118–120 and 122.',\n 'If snakes decrease while all other factors remain similar, frogs may…',['Increase because they face less predation.','Become autotrophs.','Stop using energy.','Disappear because the food web ends.'],0,'Fewer snakes can mean less predation on frogs. This may influence insects and plants.'],\n ['Green Disaster · Runoff Crisis','Increase nutrients, then look for oxygen depletion as a consequence of decomposition.','4.3 nutrient limitation: textbook pp. 130–131; Chapter 7.2 teacher outline.',\n 'What BEST explains fish deaths following a large algal bloom?',['The algae turn into predators.','Microbes decomposing algae consume dissolved oxygen.','Algae consume all the rocks.','Phosphorus is transformed into oxygen.'],1,'Excess nutrients cause a bloom; bacterial decomposition can reduce dissolved oxygen and harm fish.'],\n ['Carbon Emergency · Global Cycle','Compare the effects of combustion and primary producers on atmospheric carbon dioxide.','4.3 carbon cycle: textbook pp. 126–128.',\n 'Which change is MOST likely to increase atmospheric CO₂ over time?',['More photosynthesis and less burning.','More forest growth and less respiration.','More fossil fuel combustion and fewer trees.','More producers without any other changes.'],2,'Combustion releases stored carbon rapidly, while deforestation reduces carbon uptake.']\n];\nfunction selectMission(i){currentMission=i;el('missionBadge').textContent='Mission 0'+(i+1)+' / 03';el('labTitle').textContent=missions[i][0];el('labDesc').textContent=missions[i][1];el('labRef').textContent='Review: '+missions[i][2];el('labChallenge').classList.add('hide');document.querySelectorAll('[data-mission]').forEach(x=>x.style.borderColor=+x.dataset.mission===i?'#c5e8b3':'#437476');calc();el('lab').scrollIntoView({behavior:'smooth'})}\ndocument.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>selectMission(+b.dataset.mission));\nfor(const id of ['predators','fertilizer','burning','forest'])el(id).addEventListener('input',calc);\nel('resetLab').onclick=reset;\nel('predict').onclick=()=>{const m=missions[currentMission];el('labQuestion').textContent=m[3];el('labChoices').innerHTML=m[4].map((v,i)=>'\u003cbutton class=\"choice\" data-i=\"'+i+'\">'+String.fromCharCode(65+i)+'. '+v+'\u003c/button>').join('');el('labFeedback').innerHTML='';el('labChallenge').classList.remove('hide');el('labChoices').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(session['m'+currentMission])return;const i=+b.dataset.i,good=i===m[5];if(good){session['m'+currentMission]=true;earn(35,['4.2','7.2','4.3'][currentMission])}else miss();el('labChoices').querySelectorAll('button').forEach(z=>{z.disabled=true;if(+z.dataset.i===m[5])z.classList.add('good');else if(+z.dataset.i===i)z.classList.add('bad')});el('labFeedback').innerHTML='\u003cdiv class=\"feedback\">\u003cb>'+(good?'Correct · +35 XP':'Not quite')+'\u003c/b>\u003cp>'+m[6]+'\u003c/p>\u003csmall>'+m[2]+'\u003c/small>\u003c/div>'})};\nconst BANK=[\n['4.1',()=>{const org=pick(['deep ocean bacteria near a hydrothermal vent','bacteria in a cave with sulfur-rich water','microbes at an underwater vent']);return ['Why can '+org+' produce food without sunlight?',['They use chemical energy from inorganic compounds.','They store sunlight from yesterday.','They eat only dead fish.','They absorb energy directly from heat without chemistry.'],0,'Chemosynthesis harnesses energy from inorganic chemical reactions.','Textbook p. 115'] }],\n['4.1',()=>{let item=pick([['rabbit eating grass','herbivore'],['vulture eating a carcass','scavenger'],['fungus chemically breaking down dead wood','decomposer'],['earthworm swallowing leaf fragments','detritivore'],['bear eating fruit and animals','omnivore']]);return ['Which classification BEST describes '+item[0]+'?',[item[1],...shuf(['herbivore','scavenger','decomposer','detritivore','omnivore','producer'].filter(x=>x!==item[1])).slice(0,3)],0,'Classification depends on what an organism eats and how it gets energy.','Textbook p. 116'] }],\n['4.2',()=>{const energy=pick([10000,20000,40000,50000,80000]),steps=rand(1,3),correct=energy/10**steps;return ['Producers store '+energy.toLocaleString()+' kJ. Using the 10% rule, about how much reaches '+['primary','secondary','tertiary'][steps-1]+' consumers?',[correct.toLocaleString()+' kJ',(correct*10).toLocaleString()+' kJ',(correct/10).toLocaleString()+' kJ',(energy*.9).toLocaleString()+' kJ'],0,'Each trophic transfer passes approximately one-tenth of the previous level.','Textbook pp. 121–122'] }],\n['4.2',()=>{let x=pick([['grass','insect'],['algae','zooplankton'],['insect','frog']]);return ['What does the arrow '+x[0]+' → '+x[1]+' mean?',['Energy transfers from '+x[0]+' to '+x[1]+'.','Energy transfers from '+x[1]+' to '+x[0]+'.','Matter is destroyed at feeding.','The prey is always the top predator.'],0,'Food-web arrows show energy from food to eater.','Textbook pp. 118–120'] }],\n['4.2',()=>{let t=pick([['energy','energy available at each trophic level'],['biomass','living organic mass at each trophic level'],['numbers','individual organisms at each trophic level']]);return ['A pyramid of '+t[0]+' represents which measurement?',[t[1],'Number of habitats in the ecosystem','Total nutrients in the atmosphere','Quantity of extinct species'],0,'Energy, biomass and numbers pyramids represent different ecological quantities.','Textbook pp. 121–122'] }],\n['4.3',()=>{let x=pick([['nitrogen fixation','Conversion of N₂ to biologically usable compounds'],['denitrification','Conversion of nitrate to N₂ gas'],['nitrification','Conversion of ammonium into nitrites and nitrates']]);return ['Which definition matches '+x[0]+'?',[x[1],'Conversion of all matter to heat','Conversion of energy into atoms','Removal of all phosphorus from soil'],0,'Nitrogen-cycle bacteria carry out essential chemical transformations.','Textbook p. 129'] }],\n['4.3',()=>{let x=pick([['photosynthesis','CO₂ is fixed into sugars'],['cellular respiration','Organic carbon is released as CO₂'],['decomposition','Dead organic matter is broken down']]);return ['In the carbon cycle, '+x[0]+' is best described as…',[x[1],'N₂ becomes nitrate in soil','Phosphate is destroyed','Carbon disappears from the biosphere'],0,'Carbon is conserved as it is transferred and transformed through living and nonliving reservoirs.','Textbook pp. 126–128'] }],\n['4.3',()=>['Why is phosphorus cycling different from nitrogen cycling?',['Phosphorus has no major atmospheric phase.','Phosphorus atoms are created by algae.','Most phosphorus comes from the Sun.','Phosphorus is not needed by organisms.'],0,'The primary reservoir of phosphorus is rock and sediment.','Textbook p. 130']],\n['7.2',()=>{let water=pick(['lake','estuary','pond','stream']);return ['After a '+water+' receives fertilizer runoff, algae bloom and fish die. What is a strong explanation?',['Decomposers use dissolved oxygen as dead algae decay.','Fish become producers.','Oxygen is chemically transformed into nitrogen atoms.','All algae immediately become predators.'],0,'Eutrophication can cause decomposition-driven hypoxia.','Chapter 7.2 teacher outline; related textbook p. 131'] }],\n['7.2',()=>['Why can elevated atmospheric CO₂ contribute to ocean acidification?',['Dissolved CO₂ increases H⁺ and alters carbonate chemistry.','CO₂ destroys nitrogen atoms.','The ocean turns into pure freshwater.','The water cycle completely stops.'],0,'CO₂ dissolved into seawater leads to chemical equilibria that can lower pH.','Chapter 7.2 teacher outline']],\n['7.2',()=>{let predator=pick(['eagle','shark','large predatory fish']);return ['A '+predator+' has greater persistent-pollutant concentration than its prey. Which concept fits?',['Biomagnification','Nitrogen fixation','Photosynthesis','Denitrification'],0,'Persistent pollutants can become more concentrated at higher trophic levels.','Chapter 7.2 teacher outline'] }]\n];\nfunction newQ(topic){const item=pick(BANK.filter(x=>topic==='all'||x[0]===topic));const [q,options,answer,why,ref]=item[1]();const shuffled=shuf(options.map((v,i)=>({v,i})));return {topic:item[0],q,options:shuffled.map(x=>x.v),answer:shuffled.findIndex(x=>x.i===answer),why,ref}}\nfunction startBattle(){const topic=el('arenaTopic').value,limit=+el('arenaLength').value;round=[];let attempts=0;while(round.length\u003climit&&attempts++\u003climit*65){const q=newQ(topic);if(!round.some(x=>x.q===q.q)||attempts>limit*20)round.push(q)}answered=[];current=0;el('arenaPlay').classList.remove('hide');el('arenaEnd').classList.add('hide');el('arenaPlay').scrollIntoView({behavior:'smooth'});showBattle()}\nfunction showBattle(){if(current>=round.length)return endBattle();const q=round[current];el('battleCount').textContent='QUESTION '+(current+1)+' / '+round.length+' · '+q.topic;el('battleProgress').style.width=(current/round.length*100)+'%';el('battleQuestion').textContent=q.q;el('battleChoices').innerHTML=q.options.map((v,i)=>'\u003cbutton class=\"choice\" data-i=\"'+i+'\">'+String.fromCharCode(65+i)+'. '+v+'\u003c/button>').join('');el('battleFeedback').innerHTML='';el('battleNext').classList.add('hide');el('battleChoices').querySelectorAll('button').forEach(b=>b.onclick=()=>battleAnswer(+b.dataset.i))}\nfunction battleAnswer(i){if(answered.length!==current)return;const q=round[current],good=q.answer===i;answered.push({good,i,q});if(good)earn(mode==='hardcore'?15:10,q.topic);else miss();el('battleChoices').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('good');if(j===i&&!good)b.classList.add('bad')});if(mode==='training')el('battleFeedback').innerHTML='\u003cdiv class=\"feedback\">\u003cb>'+(good?'Correct!':'Not quite.')+'\u003c/b>\u003cp>'+q.why+'\u003c/p>\u003csmall>Review: '+q.ref+'\u003c/small>\u003c/div>';el('battleNext').textContent=current===round.length-1?'Finish battle':'Next question →';el('battleNext').classList.remove('hide')}\nfunction endBattle(){el('arenaPlay').classList.add('hide');el('arenaEnd').classList.remove('hide');const score=answered.filter(x=>x.good).length;el('arenaEnd').innerHTML='\u003cspan class=\"eyebrow\">Battle complete\u003c/span>\u003cdiv class=\"score\">'+score+'/'+answered.length+'\u003c/div>\u003cp>'+Math.round(100*score/answered.length)+'% correct. '+(score===answered.length?'Flawless fieldwork!':'Review the questions you missed, then run another scenario.')+'\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"againBattle\">Another battle ↻\u003c/button>\u003ca class=\"btn ghost\" href=\"chapter4.html\">Open full flashcard library\u003c/a>\u003c/div>'+answered.map((x,i)=>'\u003cdetails '+(!x.good?'open':'')+' class=\"feedback\">\u003csummary>'+(x.good?'✅':'❌')+' Question '+(i+1)+' · '+x.q.topic+': '+x.q.q+'\u003c/summary>\u003cp>\u003cb>Your choice:\u003c/b> '+x.q.options[x.i]+'\u003c/p>\u003cp>\u003cb>Correct:\u003c/b> '+x.q.options[x.q.answer]+'\u003c/p>\u003cp>'+x.q.why+'\u003c/p>\u003csmall>Review: '+x.q.ref+'\u003c/small>\u003c/details>').join('');el('againBattle').onclick=startBattle;el('arenaEnd').scrollIntoView({behavior:'smooth'})}\nel('startArena').onclick=startBattle;el('battleNext').onclick=()=>{current++;showBattle()};el('easyMode').onclick=()=>{mode='training';el('easyMode').classList.add('active');el('hardMode').classList.remove('active')};el('hardMode').onclick=()=>{mode='hardcore';el('hardMode').classList.add('active');el('easyMode').classList.remove('active')};\nconst WRITING=[\n {q:'A lake receives fertilizer runoff. Explain why fish may die even though algae initially increase.',ideas:[['nutrients','runoff','fertilizer'],['algae','bloom'],['decompos','bacter','microb'],['oxygen','hypoxi','respirat']],model:'Fertilizer runoff increases nutrients such as nitrogen and phosphorus, causing rapid algal growth. When algae die, decomposers consume dissolved oxygen during respiration. Low oxygen conditions can kill fish.',ref:'Textbook pp. 130–132 and Chapter 7.2 teacher outline.'},\n {q:'Explain why energy decreases at higher trophic levels while matter cycles through ecosystems.',ideas:[['energy','flow','transf'],['heat','respirat','metabol'],['matter','atom','conserv'],['decompos','nutrient','recycl']],model:'Energy moves from producers through consumers, but only some is passed on; much becomes heat through life processes. Matter is made of conserved atoms that can be recycled, including through decomposition.',ref:'Textbook pp. 120–124.'},\n {q:'Describe how carbon moves from the atmosphere into plants, animals, and back to the atmosphere.',ideas:[['carbon','co2','dioxide'],['photosynth','plant','produc'],['consum','eat','herbiv'],['respirat','decompos']],model:'Plants fix carbon dioxide into sugars during photosynthesis. Animals obtain carbon by eating plants or other animals. Respiration and decomposition return carbon to the environment as carbon dioxide.',ref:'Textbook pp. 126–128.'},\n {q:'Explain the roles of nitrogen fixation and denitrification, and why microorganisms are essential.',ideas:[['fixat','nitrogen','n2'],['bacter','microb'],['plant','soil','usable'],['denitrif','atmosph','nitrate']],model:'Nitrogen-fixing bacteria convert atmospheric nitrogen into compounds that can become available to producers. Denitrifying bacteria convert nitrates back to atmospheric nitrogen gas. Microbes allow nitrogen to cycle.',ref:'Textbook p. 129.'}\n];let w=0;\nconst setW=()=>{el('writtenPrompt').textContent=WRITING[w].q;el('writtenAnswer').value='';el('writingFeedback').innerHTML=''};\nel('newWriting').onclick=()=>{w=(w+1)%WRITING.length;setW()};\nel('checkWriting').onclick=()=>{const t=el('writtenAnswer').value.trim().toLowerCase(),data=WRITING[w];if(t.length\u003c35){el('writingFeedback').innerHTML='\u003cdiv class=\"feedback\">Write a longer explanation with a claim, evidence, and reasoning.\u003c/div>';return}const checks=data.ideas.map(group=>group.some(k=>t.includes(k)));const count=checks.filter(Boolean).length;el('writingFeedback').innerHTML='\u003cdiv class=\"feedback\">\u003cb>Offline rubric check: '+count+'/'+checks.length+' idea groups detected\u003c/b>\u003cp>This is not a real AI grader. Correct synonyms may be missed.\u003c/p>\u003cul>'+data.ideas.map((g,i)=>'\u003cli>'+(checks[i]?'✓ Likely covered: ':'Review: ')+g.join(', ')+'\u003c/li>').join('')+'\u003c/ul>\u003cdetails>\u003csummary>See model answer\u003c/summary>\u003cp>'+data.model+'\u003c/p>\u003c/details>\u003csmall>Review: '+data.ref+'\u003c/small>\u003c/div>';if(count===4)earn(15,['7.2','4.2','4.3','4.3'][w])};\nel('resetStats').onclick=()=>{if(confirm('Reset XP, streak and mastery for BioForge?')){state={xp:0,correct:0,streak:0,topics:{}};save()}};\nselectMission(0);updateHeader();\n})();\n\u003c/script>\u003cscript>/* Adaptive navigation for the Biology Study Vault — works without dependencies */\n(function(){\n'use strict';\nfunction init(){\nconst root=document.body,isHub=!!document.getElementById('chapters'),isChapter=!!document.getElementById('nav'),isForge=!!document.getElementById('missions');\nif(!(isHub||isChapter||isForge))return;\nconst base=[['⌂','Home','index.html'],['📘','Learn','chapter4.html?mode=course'],['🎯','Tests','chapter4.html?mode=exam'],['🧠','Cards','chapter4.html?mode=flash'],['🚀','Smart','chapter4.html?mode=smart'],['🎮','Game','bioforge.html']];\nconst dock=document.createElement('nav');dock.className='vault-dock';dock.setAttribute('aria-label','Mobile quick navigation');\ document.querySelector('main'))?.scrollIntoView({behavior:'smooth',block:'start'})}jump.value=''};\nconst back=document.createElement('a');back.href='index.html';back.textContent='← All chapters';actions.append(jump,back);const main=document.querySelector('main');if(main)main.prepend(actions);\n}\nif(isHub){const tools=document.getElementById('vault-tools');if(tools){const s=document.createElement('a');s.href='#vault-tools';s.className='badge';s.textContent='⚡ Jump to dashboard';s.style.marginLeft='8px';const hero=document.querySelector('.hero .intro');hero?.after(s)}}\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\u003c/script>\u003cscript>/* Biology Study Vault — consistent preset, automatic and color wheel themes */\n(()=>{'use strict';\nconst KEY='biology:color-theme',HUE='biology:custom-hue',LIGHT='biology:custom-light';\nconst presets=[['blue','💙 Calm Blue'],['midnight','🌙 Midnight'],['lavender','💜 Lavender'],['forest','🌲 Forest'],['light','☀️ Light'],['ocean','🌊 Ocean'],['rose','🌹 Rose'],['sunset','🌅 Sunset'],['amber','🍯 Amber'],['mint','🍃 Mint'],['berry','🫐 Berry'],['slate','🪨 Slate'],['beach','🏖️ Beach Blue + Orange'],['tropical','🌴 Tropical Aqua + Coral'],['sunshine','☀️ Sunshine Yellow + Blue'],['candy','🍬 Candy Pink + Mint'],['lagoon','🐠 Lagoon Teal + Peach'],['festival','🎉 Festival Purple + Lime'],['auto','🌓 Auto (device)'],['custom','🎨 Custom color wheel']];\nconst known=new Set(presets.map(x=>x[0]));\nconst read=(key,def)=>{try{return localStorage.getItem(key)||def}catch(e){return def}};\nconst save=(key,val)=>{try{localStorage.setItem(key,val)}catch(e){}};\nlet chosen=known.has(read(KEY,'blue'))?read(KEY,'blue'):'blue';\nlet hue=Math.max(0,Math.min(359,Number(read(HUE,'210'))||210));\nlet lightChoice=read(LIGHT,'dark');\nconst mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;\nconst root=document.documentElement;\nfunction hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l
