\u003cmain>\u003csection class=\"hero\">\u003cdiv>\u003cdiv class=\"eyebrow\">DISCOVER THE SCIENCE OF LIFE\u003c/div>\u003ch1>Explore life.\u003cbr>\u003cem>Master biology.\u003c/em>\u003c/h1>\u003cp class=\"intro\">From ecosystems and energy flow to the processes that keep life going, explore biology through clear notes, flashcards, practice exams, and interactive challenges.\u003c/p>\u003cdiv class=\"hero-direct-actions\">\u003ca href=\"race.html\">⚡ Multiplayer Speed Battle\u003c/a>\u003ca href=\"themes.html\">🎨 Themes & Color Wheel\u003c/a>\u003ca href=\"chapter4.html?mode=smart\">🚀 Smart Study Hub\u003c/a>\u003ca href=\"chapter4.html?mode=course\">📘 Learn Everything\u003c/a>\u003ca href=\"chapter4.html?mode=flash\">🧠 Flashcards\u003c/a>\u003c/div>\u003cspan class=\"badge\">No login · Free · Works on mobile\u003c/span>\u003c/div>\u003caside class=\"hero-side\">\u003cspan class=\"eyebrow\">ACTIVE TEST BANK\u003c/span>\u003cb>Chapter 4\u003c/b>\u003cstrong>Ecosystems + Human Impacts\u003c/strong>\u003cp>4.1 Producers & Consumers · 4.2 Energy Flow · 4.3 Cycles of Matter · 7.2 Human Impacts\u003c/p>\u003cspan class=\"badge\">23-question original mock exam + extra practice\u003c/span>\u003c/aside>\u003c/section>\n\u003csection class=\"focus-banner\" aria-label=\"Focus timer\">\u003cdiv class=\"focus-heading\">\u003cstrong>Stay focused while you study\u003c/strong>\u003cspan>Optional · 15, 25, or 45-minute sessions\u003c/span>\u003c/div>\u003cdiv class=\"focus-inner\">\u003cdiv class=\"focus-title\">\u003cdiv>\u003cspan class=\"daytag\">STUDY TOOL\u003c/span>\u003ch3>⏱️ Focus timer\u003c/h3>\u003cp>Set your time, start a focused session, and track completed minutes.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"big\" id=\"vault-clock\" role=\"timer\">25:00\u003c/div>\u003cdiv class=\"timer-actions\">\u003cbutton class=\"minibtn primary\" id=\"vault-start\" type=\"button\">Start\u003c/button>\u003cbutton class=\"minibtn\" id=\"vault-pause\" type=\"button\">Pause\u003c/button>\u003cbutton class=\"minibtn\" id=\"vault-reset\" type=\"button\">Reset\u003c/button>\u003cselect class=\"toolinput\" style=\"width:auto;margin:0\" id=\"vault-length\" aria-label=\"Focus timer length\">\u003coption value=\"15\">15 min\u003c/option>\u003coption value=\"25\" selected>25 min\u003c/option>\u003coption value=\"45\">45 min\u003c/option>\u003c/select>\u003c/div>\u003cp id=\"vault-timer-note\" aria-live=\"polite\">Complete a session to add minutes to your progress.\u003c/p>\u003c/div>\u003c/section>\n\n\u003cnav class=\"learning-path\" aria-label=\"How to use Biology Study Vault\">\u003cdiv class=\"path-label\">HOW IT WORKS\u003c/div>\u003cdiv class=\"path-items\">\u003ca href=\"#chapters\">\u003cspan>1\u003c/span>\u003cstrong>Choose a chapter\u003c/strong>\u003csmall>Pick the biology topic\u003c/small>\u003c/a>\u003ca href=\"#modes\">\u003cspan>2\u003c/span>\u003cstrong>Tap an activity\u003c/strong>\u003csmall>Go straight to notes, cards, tests, or games\u003c/small>\u003c/a>\u003ca href=\"#launch\">\u003cspan>3\u003c/span>\u003cstrong>Open instantly\u003c/strong>\u003csmall>Tap an activity to go directly there\u003c/small>\u003c/a>\u003c/div>\u003c/nav>\n\u003csection id=\"chapters\">\u003cdiv class=\"step\">\u003ci>1\u003c/i> SELECT YOUR CHAPTER\u003c/div>\u003ch2>What are you studying today?\u003c/h2>\u003cp class=\"section-explain\">Start here. Chapter 4 is currently available; select it to continue to the study methods below.\u003c/p>\u003cdiv class=\"grid\">\n\u003cdiv class=\"chapter-card\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chapter-icon\">🔬\u003c/span>\u003cspan class=\"status\">NEEDS COMPLETE MATERIALS\u003c/span>\u003c/div>\u003ch3>Chapter 1 · The Science of Biology\u003c/h3>\u003cp>Scientific investigations, variables, validity, characteristics of life, peer review.\u003c/p>\u003cbutton disabled title=\"Chapter 1 complete source-based study page has not been built\">Coming soon\u003c/button>\u003c/div>\n\u003cdiv class=\"chapter-card\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chapter-icon\">⚛️\u003c/span>\u003cspan class=\"status\">NEEDS COMPLETE MATERIALS\u003c/span>\u003c/div>\u003ch3>Chapter 2 · Chemistry of Life\u003c/h3>\u003cp>Atoms, bonds, water, acids and bases, and chemistry in living things.\u003c/p>\u003cbutton disabled title=\"Chapter 2 complete source-based study page has not been built\">Coming soon\u003c/button>\u003c/div>\n\u003cdiv class=\"chapter-card selected\">\u003cdiv class=\"chapter-title\">\u003cspan class=\"chapter-icon\">🌿\u003c/span>\u003cspan class=\"badge\">READY\u003c/span>\u003c/div>\u003ch3>Chapter 4 · Ecosystems\u003c/h3>\u003cp>All shared Chapter 4 lessons, teaching models, question practice, mock exams and study resources.\u003c/p>\u003cbutton id=\"pickChapter4\">Continue to study methods ↓\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"hint\">Chapters 1 and 2 are listed for future expansion, but they are not presented as finished tests. This prevents made-up content from being passed off as your course materials.\u003c/p>\u003c/section>\n\u003csection class=\"panel\" id=\"modes\">\u003cdiv class=\"stephead\">\u003cdiv>\u003cdiv class=\"step\">\u003ci>2\u003c/i> CHOOSE YOUR EXPERIENCE\u003c/div>\u003ch2>Tap a study activity to open it\u003c/h2>\u003cp class=\"section-explain\">No extra steps. Tap Mock Exam to go straight to the mock exam, or tap Flashcards to open flashcards immediately.\u003c/p>\u003c/div>\u003cspan class=\"badge\">Selected: Chapter 4\u003c/span>\u003c/div>\n\u003cdiv id=\"modeGrid\">\n\u003cdiv class=\"mode-category\">\u003ch3>📖 Learn & remember\u003c/h3>\u003cp>Best when you are learning a topic or reviewing key terms.\u003c/p>\u003c/div>\u003cdiv class=\"mode-grid\">\n\u003cbutton class=\"mode\" aria-pressed=\"false\" data-mode=\"smart\">\u003cspan class=\"mode-icon\">🚀\u003c/span>\u003cb>Smart Study Hub\u003c/b>\u003csmall>Timed exam, weakness training, diagram challenges and progress dashboard — all in one place.\u003c/small>\u003c/button>\n\u003cbutton class=\"mode\" aria-pressed=\"false\" data-mode=\"course\">\u003cspan class=\"mode-icon\">📘\u003c/span>\u003cb>Learn Everything (Guided)\u003c/b>\u003csmall>Illustrated step-by-step lessons and review questions. Opens the complete guided biology course.\u003c/small>\u003c/button>\n\u003cbutton class=\"mode\" aria-pressed=\"false\" data-mode=\"learn\">\u003cspan class=\"mode-icon\">📚\u003c/span>\u003cb>Study the Lessons\u003c/b>\u003csmall>Read organized biology notes and explanations. Opens Chapter 4 → Study Lessons.\u003c/small>\u003c/button>\n\u003cbutton class=\"mode\" aria-pressed=\"false\" data-mode=\"flash\">\u003cspan class=\"mode-icon\">🧠\u003c/span>\u003cb>Flashcards\u003c/b>\u003csmall>Flip question-and-answer cards to practice remembering terms. Opens Chapter 4 → Flashcards.\u003c/small>\u003c/button>\n\u003cbutton class=\"mode\" aria-pressed=\"false\" data-mode=\"tutor\">\u003cspan class=\"mode-icon\">💬\u003c/span>\u003cb>Guided Tutor\u003c/b>\u003csmall>Get guided explanations from an offline tutor (not live AI). Opens Chapter 4 → Guided Tutor.\u003c/small>\u003c/button>\n\u003c/div>\n\u003cdiv class=\"mode-category\">\u003ch3>✏️ Practice & check understanding\u003c/h3>\u003cp>Best when you know the basics and want to see what you can answer.\u003c/p>\u003c/div>\u003cdiv class=\"mode-grid\">\n\u003cbutton class=\"mode\" aria-pressed=\"false\" data-mode=\"generator\">\u003cspan class=\"mode-icon\">♾️\u003c/span>\u003cb>Endless Tests\u003c/b>\u003csmall>Create new practice-question variations. Opens Chapter 4 → Test Generator.\u003c/small>\u003c/button>\n\u003cbutton class=\"mode\" aria-pressed=\"false\" data-mode=\"written\">\u003cspan class=\"mode-icon\">✍️\u003c/span>\u003cb>Written Practice\u003c/b>\u003csmall>Practice written explanations and scientific reasoning. Opens Chapter 4 → Written Practice.\u003c/small>\u003c/button>\n\u003cbutton class=\"mode\" aria-pressed=\"false\" data-mode=\"everything\">\u003cspan class=\"mode-icon\">🧪\u003c/span>\u003cb>All Concepts + Recall\u003c/b>\u003csmall>Review all concepts and test what you remember. Opens Chapter 4 → All Concepts + Recall.\u003c/small>\u003c/button>\n\u003c/div>\n\u003cdiv class=\"mode-category\">\u003ch3>🎯 Test yourself & play\u003c/h3>\u003cp>Best for exam preparation or interactive learning.\u003c/p>\u003c/div>\u003cdiv class=\"mode-grid\">\n\u003cbutton class=\"mode\" aria-pressed=\"true\" data-mode=\"exam\">\u003cspan class=\"mode-icon\">🎯\u003c/span>\u003cb>Original Mock Exam\u003c/b>\u003csmall>Take the original 23-question exam: 21 multiple choice and 2 written. Opens Chapter 4 → Mock Exam.\u003c/small>\u003c/button>\n\u003cbutton class=\"mode\" aria-pressed=\"false\" data-mode=\"hardcore\">\u003cspan class=\"mode-icon\">🔥\u003c/span>\u003cb>Hardcore Study\u003c/b>\u003csmall>Try more challenging questions and review mistakes. Opens Chapter 4 → Hardcore Study.\u003c/small>\u003c/button>\n\u003cbutton class=\"mode\" aria-pressed=\"false\" data-mode=\"bioforge\">\u003cspan class=\"mode-icon\">🎮\u003c/span>\u003cb>BioForge Game\u003c/b>\u003csmall>Play ecosystem missions and simulations. Opens the separate BioForge game page.\u003c/small>\u003c/button>\n\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"launch\">\u003cdiv class=\"step\">\u003ci>3\u003c/i> OPTIONAL: CUSTOMIZE\u003c/div>\u003ch2>Want to focus on one lesson?\u003c/h2>\u003cp class=\"section-explain\">Most activities open immediately when tapped above. This optional section lets you pick a specific lesson before opening a study mode.\u003c/p>\u003cdiv class=\"selected-route\" id=\"selectedRoute\" aria-live=\"polite\">Chapter 4 → Original Mock Exam → Chapter 4 Study Page\u003c/div>\u003cdiv class=\"options\">\u003clabel for=\"topic\">Lesson focus\u003cselect id=\"topic\">\u003coption value=\"all\">All test topics\u003c/option>\u003coption value=\"4.1\">4.1 Producers & Consumers\u003c/option>\u003coption value=\"4.2\">4.2 Energy Flow\u003c/option>\u003coption value=\"4.3\">4.3 Cycles of Matter\u003c/option>\u003coption value=\"7.2\">7.2 Human Impacts\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"start\">\u003cbutton class=\"btn\" id=\"launchBtn\">Start Original Mock Exam →\u003c/button>\u003cspan class=\"hint\">Use this only if you want a specific lesson filter.\u003c/span>\u003c/div>\u003cp class=\"highlight\" id=\"selectionInfo\">The original mock exam is a full mixed-topic test, so its topic filter stays set to All test topics.\u003c/p>\u003c/section>\n\u003csection id=\"vault-tools\" aria-labelledby=\"vault-heading\">\n\u003cdiv class=\"studytop\">\u003cdiv>\u003cdiv class=\"eyebrow\">OPTIONAL STUDY TOOLS\u003c/div>\u003ch2 id=\"vault-heading\">Progress & quick search\u003c/h2>\u003cdiv class=\"mutedline\">Check your weekly goal or quickly find a study activity. The focus timer is at the top of this page.\u003c/div>\u003c/div>\u003cspan class=\"badge\" id=\"vault-date\">READY TO LEARN\u003c/span>\u003c/div>\n\n\u003cdiv class=\"toolgrid\">\n\u003cdiv class=\"toolbox\">\u003ch3>🎯 Weekly study target\u003c/h3>\u003cp>Track completed focus minutes, saved on this device.\u003c/p>\u003cdiv class=\"big\">\u003cspan id=\"vault-minutes\">0\u003c/span>\u003cspan style=\"font-size:1rem;color:var(--muted)\"> / \u003cspan id=\"vault-target\">150\u003c/span> min\u003c/span>\u003c/div>\u003cdiv class=\"goaltrack\" role=\"progressbar\" aria-label=\"Weekly study progress\" aria-valuemin=\"0\" aria-valuemax=\"150\" aria-valuenow=\"0\" id=\"vault-track\">\u003ci style=\"width:0\" id=\"vault-fill\">\u003c/i>\u003c/div>\u003cdiv class=\"timer-actions\" style=\"margin-top:13px\">\u003cbutton class=\"minibtn\" id=\"vault-goal\" type=\"button\">Change goal\u003c/button>\u003cbutton class=\"minibtn\" id=\"vault-clear\" type=\"button\">Reset week\u003c/button>\u003c/div>\u003cdiv id=\"vault-achievements\" style=\"margin-top:13px\">\u003c/div>\u003c/div>\n\u003cdiv class=\"toolbox\">\u003ch3>⚡ Find a study mode\u003c/h3>\u003cp>Search for the exact type of practice you need.\u003c/p>\u003clabel for=\"vault-search\" class=\"daytag\">Quick search\u003c/label>\u003cinput class=\"toolinput\" id=\"vault-search\" placeholder=\"Try flashcards, energy flow, quiz...\">\u003cdiv class=\"searchresults\" id=\"vault-results\" aria-live=\"polite\">\u003c/div>\u003c/div>\n\u003c/div>\u003c/section>\n\u003csection>\u003cdiv class=\"step\">ALTERNATE SHORTCUTS\u003c/div>\u003ch2>Other places you can go\u003c/h2>\u003cp class=\"section-explain\">These direct links skip the three-step selector above.\u003c/p>\u003cdiv class=\"links\">\u003ca href=\"chapter4.html\">Full Chapter 4 Dashboard\u003c/a>\u003ca href=\"chapter4.html?mode=generator\">Unlimited Practice\u003c/a>\u003ca href=\"bioforge.html\">Ecosystem Command Center\u003c/a>\u003ca href=\"chapter4.html?mode=flash\">Flashcard Review\u003c/a>\u003c/div>\u003c/section>\n\u003cdiv class=\"foot\">Built for Biology Chapter 4: 4.1, 4.2, 4.3 and 7.2. This site is an evolving study tool; question generators remix learned concepts, not literally limitless new facts. Source materials for other chapters will be added when fully available.\u003c/div>\n\u003c/main>\n\u003cscript>\n(()=>{'use strict';\nconst buttons=[...document.querySelectorAll('.mode')],launch=document.getElementById('launchBtn'),topic=document.getElementById('topic'),info=document.getElementById('selectionInfo'),route=document.getElementById('selectedRoute');let mode='exam';\nconst names={smart:'Smart Study Hub',course:'Learn Everything (Guided)',exam:'Original Mock Exam',generator:'Endless Tests',hardcore:'Hardcore Study',learn:'Study Notes',flash:'Flashcards',written:'Written Practice',bioforge:'BioForge Game',everything:'All Concepts + Recall',tutor:'Guided Tutor'};\nconst filterable=new Set(['generator','flash','learn','everything']);\nfunction choose(value){if(!names[value])return;mode=value;for(const b of buttons)b.setAttribute('aria-pressed',String(b.dataset.mode===mode));launch.textContent='Open '+names[mode]+' →';route.textContent='Chapter 4 → '+names[mode]+' → '+(mode==='bioforge'?'BioForge Game Page':'Chapter 4 Study Page');topic.disabled=!filterable.has(mode);info.textContent=filterable.has(mode)?'This lesson will open inside the chosen study mode.':'This activity uses its own chapter-wide content. The lesson selector is disabled because it does not apply.';try{localStorage.setItem('biology:picker:mode',mode)}catch(e){}}\nbuttons.forEach(b=>{b.setAttribute('title','Open '+names[b.dataset.mode]+' directly');b.addEventListener('click',()=>{choose(b.dataset.mode);const url=b.dataset.mode==='bioforge'?'bioforge.html':'chapter4.html?mode='+encodeURIComponent(b.dataset.mode);parent.BIO_NAV(url)})});document.getElementById('pickChapter4').onclick=()=>document.getElementById('modes').scrollIntoView({behavior:'smooth'});\nlaunch.onclick=()=>{const url=mode==='bioforge'?'bioforge.html':'chapter4.html?mode='+encodeURIComponent(mode)+(filterable.has(mode)?'&topic='+encodeURIComponent(topic.value):'');parent.BIO_NAV(url)};\ntry{choose(localStorage.getItem('biology:picker:mode')||'exam')}catch(e){choose('exam')}\n})();\n\u003c/script>\u003cscript>\n(function(){\n'use strict';\nconst prefix='bio-vault-v2:',qs=id=>document.getElementById(id);\nlet now=new Date(),monday=new Date(now);monday.setHours(0,0,0,0);monday.setDate(now.getDate()-((now.getDay()+6)%7));\nconst wk=monday.toISOString().slice(0,10),minutesKey=prefix+'minutes-'+wk,goalKey=prefix+'goal';\nconst read=(key,def)=>{try{return localStorage.getItem(key)??def}catch(e){return def}},write=(key,value)=>{try{localStorage.setItem(key,String(value))}catch(e){}};\nlet mins=Math.max(0,Number(read(minutesKey,'0'))||0),goal=Math.max(15,Number(read(goalKey,'150'))||150);\nqs('vault-date').textContent=new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',weekday:'long'}).format(now);\nfunction progress(){qs('vault-minutes').textContent=mins;qs('vault-target').textContent=goal;qs('vault-fill').style.width=Math.min(100,mins/goal*100)+'%';qs('vault-track').setAttribute('aria-valuemax',goal);qs('vault-track').setAttribute('aria-valuenow',Math.min(goal,mins));qs('vault-achievements').innerHTML=mins>=goal?'\u003cspan>🏆 Weekly goal reached\u003c/span>':mins>=60?'\u003cspan>🚀 One hour studied\u003c/span>':mins>=25?'\u003cspan>🌿 First focus sprint\u003c/span>':'\u003cspan>🌱 Your first sprint awaits\u003c/span>'}\nprogress();\nqs('vault-goal').onclick=()=>{const n=prompt('Weekly study goal in minutes (15 to 1000):',goal);if(n===null)return;const v=Number(n);if(!Number.isInteger(v)||v\u003c15||v>1000)return alert('Choose a whole number from 15 to 1000.');goal=v;write(goalKey,goal);progress()};\nqs('vault-clear').onclick=()=>{if(!confirm('Reset this week’s focus minutes?'))return;mins=0;write(minutesKey,mins);progress()};\nlet sec=25*60,run=false,startAt=0,remainingAtStart=sec,interval=0;\nfunction clock(){qs('vault-clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');document.title=(run?qs('vault-clock').textContent+' • ':'')+'Biology Study Vault | Choose Your Test'}\nfunction pause(){if(run){sec=Math.max(0,Math.ceil(remainingAtStart-(Date.now()-startAt)/1000));run=false;clearInterval(interval);interval=0;clock()}}\nfunction tick(){sec=Math.max(0,Math.ceil(remainingAtStart-(Date.now()-startAt)/1000));clock();if(sec===0){run=false;clearInterval(interval);interval=0;const total=Number(qs('vault-length').value);mins+=total;write(minutesKey,mins);progress();qs('vault-timer-note').textContent='🎉 Focus sprint completed! +'+total+' minutes logged.';if('Notification' in window&&Notification.permission==='granted')new Notification('Study sprint complete!')}}\nqs('vault-start').onclick=()=>{if(run)return;if(sec\u003c=0)sec=Number(qs('vault-length').value)*60;remainingAtStart=sec;startAt=Date.now();run=true;interval=setInterval(tick,250);clock();qs('vault-timer-note').textContent='You got this! Stay focused.'};\nqs('vault-pause').onclick=pause;\nqs('vault-reset').onclick=()=>{pause();sec=Number(qs('vault-length').value)*60;clock();qs('vault-timer-note').textContent='Ready for a new sprint.'};\nqs('vault-length').onchange=()=>{pause();sec=Number(qs('vault-length').value)*60;clock()};clock();\nconst terms=[['Smart Study Hub','chapter4.html?mode=smart','weakness trainer diagram timed exam mastery dashboard'],['Learn Everything (Guided)','chapter4.html?mode=course','illustrated biology lessons pictures diagrams teaching'],['Mock Exam','chapter4.html?mode=exam','test exam teacher questions'],['Endless Tests','chapter4.html?mode=generator','unlimited quiz practice scenario'],['Flashcards','chapter4.html?mode=flash','memorize vocabulary recall'],['Study Notes','chapter4.html?mode=learn','lessons 4.1 4.2 4.3 7.2 producers consumers energy flow cycles human impacts'],['Hardcore','chapter4.html?mode=hardcore','difficult advanced questions'],['Written Practice','chapter4.html?mode=written','explanations CER short answer'],['BioForge','bioforge.html','ecosystem ecology food web game simulation'],['Guided Tutor','chapter4.html?mode=tutor','explanation tutor help']];\nfunction search(){const q=qs('vault-search').value.trim().toLowerCase(),list=q?terms.filter(t=>t.join(' ').toLowerCase().includes(q)):terms.slice(0,3);qs('vault-results').innerHTML=list.length?list.slice(0,5).map(t=>'\u003ca href=\"'+t[1]+'\">'+t[0]+' ↗\u003c/a>').join(''):'\u003cdiv class=\"hint\">No match. Try “quiz”, “flashcards”, or “ecosystem”.\u003c/div>'}\nqs('vault-search').addEventListener('input',search);search();\n\n})();\n\u003c/script>\u003cscript>/* Adaptive navigation for the Biology Study Vault — works without dependencies */\n(function(){\n'use strict';\nfunction init(){\nconst root=document.body,isHub=!!document.getElementById('chapters'),isChapter=!!document.getElementById('nav'),isForge=!!document.getElementById('missions');\nif(!(isHub||isChapter||isForge))return;\nconst base=[['⌂','Home','index.html'],['📘','Learn','chapter4.html?mode=course'],['🎯','Tests','chapter4.html?mode=exam'],['🧠','Cards','chapter4.html?mode=flash'],['🚀','Smart','chapter4.html?mode=smart'],['🎮','Game','bioforge.html']];\nconst dock=document.createElement('nav');dock.className='vault-dock';dock.setAttribute('aria-label','Mobile quick navigation');\nconst currentMode=new URLSearchParams(location.search).get('mode');const here=isHub?'Home':isForge?'Game':currentMode==='smart'?'Smart':currentMode==='exam'?'Tests':currentMode==='flash'?'Cards':'Learn';\ndock.innerHTML=base.map(([emoji,label,url])=>'\u003ca href=\"'+url+'\"'+(here===label?' aria-current=\"page\"':'')+'>\u003cspan aria-hidden=\"true\">'+emoji+'\u003c/span>'+label+'\u003c/a>').join('');\nroot.appendChild(dock);\nconst top=document.createElement('button');top.className='vault-to-top';top.type='button';top.textContent='↑';top.setAttribute('aria-label','Return to top');top.onclick=()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});root.appendChild(top);\nlet raf=0;addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{top.classList.toggle('visible',scrollY>550);raf=0})},{passive:true});\nif(isChapter){const nav=document.getElementById('nav');const actions=document.createElement('div');actions.className='vault-screen-actions';const jump=document.createElement('select');jump.className='vault-view-chooser';jump.setAttribute('aria-label','Jump directly to a study mode');let buttons=[...nav.querySelectorAll('button[data-page]')];const labels={home:'Dashboard',smart:'Smart Study Hub',course:'Learn Everything (Guided)',learn:'Study notes',everything:'All concepts',flash:'Flashcards',tutor:'Offline tutor','ai-live':'Live AI (requires setup)',practice:'Practice questions',exam:'Mock exam',hardcore:'Hardcore',written:'Written responses',generator:'Endless tests',path:'Learning path',lab:'Ecology lab'};jump.innerHTML='\u003coption value=\"\">Jump to study mode…\u003c/option>'+buttons.map(b=>'\u003coption value=\"'+b.dataset.page+'\">'+(labels[b.dataset.page]||b.textContent.trim())+'\u003c/option>').join('');\njump.onchange=()=>{const b=nav.querySelector('button[data-page=\"'+jump.value+'\"]');if(b){b.click();const heading=document.querySelector('.view.active h2,.view.active h1');(heading||document.querySelector('main'))?.scrollIntoView({behavior:'smooth',block:'start'})}jump.value=''};\nconst back=document.createElement('a');back.href='index.html';back.textContent='← All chapters';actions.append(jump,back);const main=document.querySelector('main');if(main)main.prepend(actions);\n}\nif(isHub){const tools=document.getElementById('vault-tools');if(tools){const s=document.createElement('a');s.href='#vault-tools';s.className='badge';s.textContent='⚡ Jump to dashboard';s.style.marginLeft='8px';const hero=document.querySelector('.hero .intro');hero?.after(s)}}\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\u003c/script>\u003cscript>/* Biology Study Vault — consistent preset, automatic and color wheel themes */\n(()=>{'use strict';\nconst KEY='biology:color-theme',HUE='biology:custom-hue',LIGHT='biology:custom-light';\nconst presets=[['blue','💙 Calm Blue'],['midnight','🌙 Midnight'],['lavender','💜 Lavender'],['forest','🌲 Forest'],['light','☀️ Light'],['ocean','🌊 Ocean'],['rose','🌹 Rose'],['sunset','🌅 Sunset'],['amber','🍯 Amber'],['mint','🍃 Mint'],['berry','🫐 Berry'],['slate','🪨 Slate'],['beach','🏖️ Beach Blue + Orange'],['tropical','🌴 Tropical Aqua + Coral'],['sunshine','☀️ Sunshine Yellow + Blue'],['candy','🍬 Candy Pink + Mint'],['lagoon','🐠 Lagoon Teal + Peach'],['festival','🎉 Festival Purple + Lime'],['auto','🌓 Auto (device)'],['custom','🎨 Custom color wheel']];\nconst known=new Set(presets.map(x=>x[0]));\nconst read=(key,def)=>{try{return localStorage.getItem(key)||def}catch(e){return def}};\nconst save=(key,val)=>{try{localStorage.setItem(key,val)}catch(e){}};\nlet chosen=known.has(read(KEY,'blue'))?read(KEY,'blue'):'blue';\nlet hue=Math.max(0,Math.min(359,Number(read(HUE,'210'))||210));\nlet lightChoice=read(LIGHT,'dark');\nconst mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;\nconst root=document.documentElement;\nfunction hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),fn=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return '#'+fn(0)+fn(8)+fn(4)}\nfunction customPalette(H,light){\nconst base=light?{bg:hex(H,34,96),header:hex(H,45,98),card:'#ffffff',card2:hex(H,34,90),border:hex(H,28,74),text:hex(H,40,19),muted:hex(H,24,37),accent:hex(H,72,34),accentText:'#ffffff',focus:hex((H+35)%360,66,37),soft:hex(H,50,32)}:{bg:hex(H,42,12),header:hex(H,45,16),card:hex(H,36,21),card2:hex(H,33,27),border:hex(H,23,43),text:'#f1f6ff',muted:hex(H,25,79),accent:hex(H,67,78),accentText:hex(H,42,13),focus:'#f0dba6',soft:hex(H,65,87)};\nfor(const [k,v] of Object.entries(base))root.style.setProperty('--t-'+k.replace(/[A-Z]/g,x=>'-'+x.toLowerCase()),v);\nreturn base.bg\n}\nfunction clearPalette(){for(const s of ['bg','header','card','card2','border','text','muted','accent','accent-text','focus','soft'])root.style.removeProperty('--t-'+s)}\nfunction apply(mode,remember=true){\nchosen=known.has(mode)?mode:'blue';const resolved=chosen==='auto'?(mq?.matches?'light':'blue'):chosen;\nroot.setAttribute('data-study-theme',resolved==='custom'?'custom':resolved);\nroot.setAttribute('data-study-choice',chosen);\nclearPalette();\nconst bg=resolved==='custom'?customPalette(hue,lightChoice==='light'):getComputedStyle(root).getPropertyValue('--t-bg').trim();\ndocument.body?.classList.remove('light');\nconst meta=document.querySelector('meta[name=\"theme-color\"]');if(meta)meta.content=bg||'#0e2038';\nif(remember)save(KEY,chosen);\ndocument.querySelectorAll('.study-theme-select').forEach(x=>x.value=chosen);\ndocument.querySelectorAll('.theme-picked').forEach(x=>x.textContent=presets.find(x=>x[0]===chosen)?.[1]||'');\ndocument.querySelectorAll('.custom-color-controls').forEach(x=>x.hidden=chosen!=='custom');\n}\nfunction decorate(){const page=document.getElementById('chapters')?'home':document.getElementById('nav')?'chapter':document.getElementById('missions')?'forge':'other';\nconst header=document.querySelector('header');if(!header)return;\nconst wrap=document.createElement('div');wrap.className='study-theme-wrap';\nwrap.innerHTML='\u003clabel for=\"studyThemeSelect\">🎨 Theme\u003c/label>\u003cselect id=\"studyThemeSelect\" class=\"study-theme-select\" aria-label=\"Choose color theme\">\u003c/select>\u003cbutton type=\"button\" class=\"theme-more\" aria-expanded=\"false\" aria-controls=\"themePanel\">Customize\u003c/button>\u003cdiv class=\"theme-panel\" id=\"themePanel\" hidden>\u003cstrong>Color & appearance\u003c/strong>\u003cp>Pick a preset, match your device automatically, or make your own color.\u003c/p>\u003cdiv class=\"theme-swatch-grid\" id=\"themeSwatches\">\u003c/div>\u003cdiv class=\"custom-color-controls\" hidden>\u003clabel for=\"themeWheel\">Color wheel\u003c/label>\u003cinput id=\"themeWheel\" type=\"color\" value=\"#3976bd\" aria-label=\"Custom theme color wheel\">\u003clabel for=\"themeHue\">Fine-tune color\u003c/label>\u003cinput id=\"themeHue\" type=\"range\" min=\"0\" max=\"359\" value=\"210\">\u003clabel for=\"themeCustomLight\">Custom background\u003c/label>\u003cselect id=\"themeCustomLight\">\u003coption value=\"dark\">Dark\u003c/option>\u003coption value=\"light\">Light\u003c/option>\u003c/select>\u003c/div>\u003cp class=\"theme-help\">Auto follows your phone or computer light/dark setting. Your choice is saved on this device.\u003c/p>\u003c/div>';\nconst selector=wrap.querySelector('.study-theme-select');\npresets.forEach(([id,label])=>{const option=document.createElement('option');option.value=id;option.textContent=label;selector.append(option)});\nselector.onchange=()=>apply(selector.value
